<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>🌸 DANMETOPIA - Trang quản trị 🌸</title>
  <link rel="stylesheet" href="style.css">
</head>
<body data-page="admin">
  <div id="mainContainer">
    <div id="header-placeholder"></div>
    
    <div class="admin-panel" style="padding: 20px;">
      <h2>👑 Quản trị hệ thống</h2>
      
      <div class="admin-section">
        <h3>📚 Truyện chờ duyệt</h3>
        <div id="pendingStories"></div>
      </div>
      
      <div class="admin-section">
        <h3>👥 Quản lý người dùng</h3>
        <div id="usersList"></div>
      </div>
    </div>
    
    <div id="footer-placeholder"></div>
  </div>
  
  <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
  <script type="module">
    import { API } from './js/core/api.js';
    import { state } from './js/core/state.js';
    import { FirebaseService } from './js/core/firebaseService.js';
    
    const { db, ref, get, update } = FirebaseService;
    
    emailjs.init("fPq8fpw1OqzOtj-lk");
    
    async function loadAdminData() {
      if (!state.currentUser || !API.isAdmin(state.currentUser)) {
        window.location.href = 'index.html';
        return;
      }
      
      // Load pending stories
      const storiesSnap = await get(ref(db, 'stories'));
      const stories = storiesSnap.val() || {};
      const pending = Object.entries(stories).filter(([id, s]) => s.approved === false);
      
      const pendingDiv = document.getElementById('pendingStories');
      if (pending.length === 0) {
        pendingDiv.innerHTML = '<p>Không có truyện chờ duyệt</p>';
      } else {
        pendingDiv.innerHTML = pending.map(([id, story]) => `
          <div class="admin-story-item" style="background:#2a2a2a; margin:10px 0; padding:15px; border-radius:12px;">
            <strong>${API.escapeHtml(story.title)}</strong> - by ${API.escapeHtml(story.ownerNickname)}
            <div style="margin-top:10px;">
              <button onclick="API.approveStory('${id}')" class="btn-pink">✅ Duyệt</button>
              <button onclick="API.rejectStory('${id}')" class="btn-red">❌ Từ chối</button>
            </div>
          </div>
        `).join('');
      }
      
      // Load users
      const usersSnap = await get(ref(db, 'users'));
      const users = usersSnap.val() || {};
      const usersList = document.getElementById('usersList');
      usersList.innerHTML = Object.entries(users).map(([uid, user]) => `
        <div class="admin-user-item" style="background:#2a2a2a; margin:10px 0; padding:15px; border-radius:12px;">
          <div><strong>${API.escapeHtml(user.nickname)}</strong> - ${API.escapeHtml(user.email)}</div>
          <div>Role: ${user.role}</div>
          <div style="margin-top:10px;">
            <button onclick="promoteToMod('${uid}')" class="btn-pink">⭐ Thành Mod</button>
            <button onclick="demoteUser('${uid}')" class="btn-red">⬇️ Hạ cấp</button>
          </div>
        </div>
      `).join('');
    }
    
    window.promoteToMod = async (uid) => {
      await update(ref(db, `users/${uid}/privileges`), { moderator: true });
      API.showNotification('Đã nâng cấp thành Mod');
      loadAdminData();
    };
    
    window.demoteUser = async (uid) => {
      await update(ref(db, `users/${uid}/privileges`), { moderator: false });
      API.showNotification('Đã hạ cấp user');
      loadAdminData();
    };
    
    async function loadComponents() {
      const headerRes = await fetch('components/header.html');
      const headerHtml = await headerRes.text();
      document.getElementById('header-placeholder').innerHTML = headerHtml;
      
      const footerRes = await fetch('components/footer.html');
      const footerHtml = await footerRes.text();
      document.getElementById('footer-placeholder').innerHTML = footerHtml;
      
      document.getElementById('homeLogo')?.addEventListener('click', () => window.location.href = 'index.html');
    }
    
    const restored = await API.restoreSession();
    if (!restored || !API.isAdmin(state.currentUser)) {
      window.location.href = 'index.html';
    } else {
      await loadComponents();
      await loadAdminData();
    }
  </script>
</body>
</html>
