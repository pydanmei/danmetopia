<!DOCTYPE html>
<html>

<head>
  <title>ADMIN DANMETOPIA</title>

  <style>
    body{
      margin:0;
      background:#0f0f0f;
      color:white;
      font-family:Arial;
      display:flex;
      justify-content:center;
      align-items:center;
      height:100vh;
    }

    .box{
      background:#1c1c1c;
      padding:25px;
      border-radius:12px;
      width:300px;
      text-align:center;
    }

    input{
      width:100%;
      padding:10px;
      margin-top:10px;
      border:none;
      border-radius:8px;
    }

    button{
      width:100%;
      padding:10px;
      margin-top:10px;
      border:none;
      border-radius:8px;
      background:#00dc64;
      font-weight:bold;
      cursor:pointer;
    }

    .hidden{
      display:none;
    }

    .error{
      color:red;
      margin-top:10px;
    }

    .panel{
      padding:20px;
    }

  </style>
</head>

<body>

<!-- LOGIN -->
<div class="box" id="loginBox">

  <h2>ADMIN LOGIN</h2>

  <input type="password" id="pass" placeholder="Password">

  <button onclick="login()">ENTER</button>

  <div class="error" id="error"></div>

</div>

<!-- ADMIN PANEL -->
<div class="panel hidden" id="panel">

  <h2>ADMIN PANEL</h2>

  <p>✔ Bạn đã đăng nhập</p>

  <button onclick="goUpload()">Upload truyện</button>

  <button onclick="logout()">Đăng xuất</button>

</div>

<script>

const ADMIN_PASS = "admin123";

function login(){

  const pass = document.getElementById("pass").value;

  if(pass === ADMIN_PASS){

    document.getElementById("loginBox").classList.add("hidden");
    document.getElementById("panel").classList.remove("hidden");

    localStorage.setItem("admin", "true");

  } else {
    document.getElementById("error").innerText = "Sai mật khẩu!";
  }

}

function logout(){
  localStorage.removeItem("admin");
  location.reload();
}

function goUpload(){
  window.location.href = "upload.html";
}

// auto login nếu đã đăng nhập
if(localStorage.getItem("admin") === "true"){
  document.getElementById("loginBox").classList.add("hidden");
  document.getElementById("panel").classList.remove("hidden");
}

</script>

</body>
</html>
