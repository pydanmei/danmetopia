<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DANMETOPIA - Trang quản trị</title>
<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
  background: #0f0f0f;
  color: #e0e0e0;
}

.admin-layout {
  display: flex;
  min-height: 100vh;
}

.sidebar {
  width: 260px;
  background: #1c1c1c;
  padding: 20px;
  display: flex;
  flex-direction: column;
  gap: 10px;
  border-right: 1px solid #FF69B4;
}

.sidebar h2 {
  color: #FF69B4;
  margin-bottom: 20px;
  font-size: 20px;
}

.sidebar button {
  padding: 12px;
  border: none;
  background: #2a2a2a;
  color: white;
  border-radius: 10px;
  cursor: pointer;
  text-align: left;
  font-size: 14px;
  transition: background 0.2s;
}

.sidebar button:hover {
  background: #FF69B4;
  color: black;
}

.main-content {
  flex: 1;
  padding: 20px;
  overflow-y: auto;
}

.card {
  background: #1c1c1c;
  padding: 15px;
  margin-bottom: 15px;
  border-radius: 12px;
  border: 1px solid #333;
}

.card h3 {
  color: #FF69B4;
  margin-bottom: 10px;
}

.card p {
  color: #aaa;
  margin-bottom: 10px;
}

button {
  padding: 8px 16px;
  border: none;
  border-radius: 8px;
  cursor: pointer;
  font-weight: bold;
  margin-right: 8px;
  margin-bottom: 8px;
}

.btn-approve { background: #FF69B4; color: black; }
.btn-reject { background: #ff4444; color: white; }
.btn-delete { background: #ff8800; color: black; }
.btn-hide { background: #FFCCCC; color: black; }

select {
  padding: 6px 12px;
  background: #2a2a2a;
  border: 1px solid #444;
  border-radius: 8px;
  color: white;
}

.stats-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
  gap: 15px;
  margin-bottom: 30px;
}

.stat-card {
  background: linear-gradient(135deg, #1c1c1c, #2a2a2a);
  padding: 20px;
  border-radius: 16px;
  text-align: center;
  border: 1px solid #FF69B4;
}

.stat-card .number {
  font-size: 32px;
  font-weight: bold;
  color: #FF69B4;
}

.stat-card .label {
  color: #aaa;
  margin-top: 8px;
}

.broadcast-box {
  background: #1c1c1c;
  padding: 20px;
  border-radius: 16px;
  margin-top: 20px;
  border: 1px solid #FF69B4;
}

.broadcast-box textarea {
  width: 100%;
  padding: 12px;
  background: #2a2a2a;
  border: 1px solid #444;
  border-radius: 12px;
  color: white;
  margin: 10px 0;
  resize: vertical;
}

.loading-spinner {
  display: inline-block;
  width: 30px;
  height: 30px;
  border: 3px solid #333;
  border-top-color: #FF69B4;
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
}

@keyframes spin {
  to { transform: rotate(360deg); }
}

.user-badge {
  display: inline-block;
  padding: 2px 8px;
  border-radius: 12px;
  font-size: 11px;
  font-weight: bold;
  margin-left: 8px;
}

.badge-admin { background: #FF1493; color: white; }
.badge-moderator { background: #FF69B4; color: black; }
.badge-group { background: #FFCCCC; color: black; }
.badge-user { background: #555; color: white; }
</style>
</head>
<body>
<div class="admin-layout">
  <aside class="sidebar">
    <h2>🌸 DANMETOPIA</h2>
    <button onclick="showTab('dashboard')">📊 Tổng quan</button>
    <button onclick="showTab('stories')">📚 Tất cả truyện</button>
    <button onclick="showTab('pending')">⏳ Chờ duyệt</button>
    <button onclick="showTab('users')">👤 Người dùng</button>
    <button onclick="showTab('comments')">💬 Bình luận</button>
    <button onclick="showTab('groups')">📚 Nhóm dịch</button>
    <button onclick="showTab('broadcast')">📢 Gửi thông báo</button>
    <hr style="margin: 15px 0; border-color: #333;">
    <button onclick="goHome()">🏠 Về trang chủ</button>
    <button onclick="logout()" style="background:#ff4444; color:white;">🚪 Đăng xuất</button>
  </aside>
  <main class="main-content" id="adminMain">
    <div style="text-align:center; padding:50px;">
      <div class="loading-spinner"></div>
      <p>Đang tải...</p>
    </div>
  </main>
</div>

<script type="module">
import { 
  auth, db,
  ADMIN_EMAILS,
  getUserData, getUserGroup, getDisplayName, getUserLevel, getUserLevelText,
  isAdmin, isModerator, hasGroup, isGuest,
  canModerate, canDeleteStory, canDeleteUser, canChangeRole, canEditStory,
  setModerator, setGroupId, joinGroup,
  createGroup, getAllGroups, deleteGroup, deleteUser,
  logout, getCurrentSession
} from "./auth.js";

let currentUserData = null;

function showNotification(msg, isError = false) {
  const notif = document.createElement("div");
  notif.style.cssText = `position:fixed;bottom:20px;right:20px;background:${isError ? '#ff4444' : '#FF69B4'};color:black;padding:12px 20px;border-radius:40px;z-index:1000;animation:slideIn 0.3s ease;`;
  notif.innerText = msg;
  document.body.appendChild(notif);
  setTimeout(() => notif.remove(), 3000);
}

function escapeHtml(str) {
  if (!str) return "";
  return str.replace(/[&<>]/g, m => m === "&" ? "&amp;" : m === "<" ? "&lt;" : "&gt;");
}

function getUserBadge(user) {
  if (user.role === "admin") return '<span class="user-badge badge-admin">Admin</span>';
  if (user.privileges?.moderator) return '<span class="user-badge badge-moderator">Quản lý</span>';
  if (user.privileges?.groupId) return '<span class="user-badge badge-group">Nhóm dịch</span>';
  return '<span class="user-badge badge-user">Người dùng</span>';
}

// ==================== AUTH GUARD ====================
async function checkAdminAccess() {
  const session = getCurrentSession();
  if (!session || session.role !== "admin") {
    document.body.innerHTML = "<div style='height:100vh;display:flex;justify-content:center;align-items:center;'><h1 style='color:#ff4444;'>⛔ Không có quyền truy cập</h1><br><button onclick='window.location.href=\"index.html\"'>Về trang chủ</button></div>";
    return false;
  }
  currentUserData = session;
  return true;
}

// ==================== DASHBOARD ====================
async function loadDashboard() {
  const storiesSnap = await get(ref(db, "stories"));
  const stories = storiesSnap.val() || {};
  const usersSnap = await get(ref(db, "users"));
  const users = usersSnap.val() || {};
  const commentsSnap = await get(ref(db, "comments"));
  const comments = commentsSnap.val() || {};
  const groupsSnap = await get(ref(db, "groups"));
  const groups = groupsSnap.val() || {};
  
  let totalViews = 0;
  let totalLikes = 0;
  let pendingCount = 0;
  let topStories = [];
  
  Object.entries(stories).forEach(([id, s]) => {
    totalViews += s.views || 0;
    totalLikes += s.likes || 0;
    if (s.status === "pending") pendingCount++;
    topStories.push({ title: s.title, views: s.views || 0 });
  });
  topStories.sort((a,b) => b.views - a.views);
  
  document.getElementById("adminMain").innerHTML = `
    <h2>📊 Tổng quan</h2>
    <div class="stats-grid">
      <div class="stat-card"><div class="number">${Object.keys(stories).length}</div><div class="label">📚 Truyện</div></div>
      <div class="stat-card"><div class="number">${totalViews}</div><div class="label">👁 Lượt xem</div></div>
      <div class="stat-card"><div class="number">${totalLikes}</div><div class="label">❤️ Lượt thích</div></div>
      <div class="stat-card"><div class="number">${pendingCount}</div><div class="label">⏳ Chờ duyệt</div></div>
      <div class="stat-card"><div class="number">${Object.keys(users).length}</div><div class="label">👤 Người dùng</div></div>
      <div class="stat-card"><div class="number">${Object.keys(comments).length}</div><div class="label">💬 Bình luận</div></div>
      <div class="stat-card"><div class="number">${Object.keys(groups).length}</div><div class="label">📚 Nhóm dịch</div></div>
    </div>
    <h3>🔥 Top 5 truyện xem nhiều nhất</h3>
    ${topStories.slice(0,5).map((s, i) => `
      <div class="card">
        <b>${i+1}. ${escapeHtml(s.title)}</b> — 👁 ${s.views}
      </div>
    `).join("")}
  `;
}

// ==================== STORIES MANAGEMENT ====================
function loadStories() {
  onValue(ref(db, "stories"), (snap) => {
    const data = snap.val() || {};
    const storiesList = Object.entries(data).map(([id, v]) => ({ id, ...v }));
    
    document.getElementById("adminMain").innerHTML = `
      <h2>📚 Tất cả truyện</h2>
      ${storiesList.map(s => `
        <div class="card">
          <h3>${escapeHtml(s.title)}</h3>
          <p>Trạng thái: ${s.status || "pending"} | 👤 ${s.groupName || "Cá nhân"} | 👁 ${s.views || 0} | ❤️ ${s.likes || 0}</p>
          <button class="btn-approve" onclick="approveStory('${s.id}')">✔ Duyệt</button>
          <button class="btn-reject" onclick="rejectStory('${s.id}')">❌ Từ chối</button>
          <button class="btn-delete" onclick="deleteStory('${s.id}')">🗑 Xóa</button>
        </div>
      `).join("")}
    `;
  });
}

// ==================== PENDING MODERATION ====================
function loadPending() {
  onValue(ref(db, "stories"), (snap) => {
    const data = snap.val() || {};
    const pendingList = Object.entries(data)
      .map(([id, v]) => ({ id, ...v }))
      .filter(s => s.status === "pending");
    
    document.getElementById("adminMain").innerHTML = `
      <h2>⏳ Truyện chờ duyệt (${pendingList.length})</h2>
      ${pendingList.map(s => `
        <div class="card">
          <h3>${escapeHtml(s.title)}</h3>
          <p>👤 ${s.groupName || "Cá nhân"} | 📅 ${new Date(s.createdAt).toLocaleDateString()}</p>
          <button class="btn-approve" onclick="approveStory('${s.id}')">✔ Duyệt</button>
          <button class="btn-reject" onclick="rejectStory('${s.id}')">❌ Từ chối</button>
          <button class="btn-delete" onclick="deleteStory('${s.id}')">🗑 Xóa</button>
        </div>
      `).join("")}
    `;
  });
}

// ==================== USER MANAGEMENT ====================
function loadUsers() {
  onValue(ref(db, "users"), (snap) => {
    const data = snap.val() || {};
    const usersList = Object.entries(data).map(([id, u]) => ({ id, ...u }));
    
    document.getElementById("adminMain").innerHTML = `
      <h2>👤 Quản lý người dùng</h2>
      ${usersList.map(u => `
        <div class="card">
          <h3>${escapeHtml(u.nickname || u.email)} ${getUserBadge(u)}</h3>
          <p>📧 ${u.email}</p>
          <p>📅 Tham gia: ${new Date(u.createdAt).toLocaleDateString()}</p>
          <p>⚠️ Vi phạm: ${u.strike || 0}</p>
          <div style="margin-top:10px;">
            <select id="moderator-${u.id}" onchange="toggleModerator('${u.id}', this.value)">
              <option value="false" ${!u.privileges?.moderator ? "selected" : ""}>👤 Người dùng thường</option>
              <option value="true" ${u.privileges?.moderator ? "selected" : ""}>🛡️ Quản lý (Moderator)</option>
            </select>
            <button onclick="resetStrike('${u.id}')" style="background:#FFCCCC; color:black;">🔄 Reset vi phạm</button>
            <button onclick="deleteUserAccount('${u.id}', '${escapeHtml(u.email)}')" style="background:#ff4444; color:white;">🗑 Xóa tài khoản</button>
          </div>
        </div>
      `).join("")}
    `;
  });
}

// ==================== COMMENTS MODERATION ====================
function loadComments() {
  onValue(ref(db, "comments"), (snap) => {
    const data = snap.val() || {};
    let allComments = [];
    
    Object.entries(data).forEach(([storyId, comments]) => {
      Object.entries(comments).forEach(([cid, c]) => {
        allComments.push({ storyId, cid, ...c });
      });
    });
    
    allComments.sort((a,b) => (b.createdAt || 0) - (a.createdAt || 0));
    
    document.getElementById("adminMain").innerHTML = `
      <h2>💬 Quản lý bình luận</h2>
      ${allComments.map(c => `
        <div class="card">
          <p><b>${escapeHtml(c.userName)}</b> — ${new Date(c.createdAt).toLocaleString()}</p>
          <p>${escapeHtml(c.text)}</p>
          <p style="font-size:12px; color:#888;">Truyện ID: ${c.storyId}</p>
          ${c.hidden ? '<span style="color:#FF69B4;">🔒 Đã ẩn</span>' : ''}
          <button class="btn-hide" onclick="hideComment('${c.storyId}','${c.cid}')">${c.hidden ? 'Hiện' : 'Ẩn'}</button>
        </div>
      `).join("")}
    `;
  });
}

// ==================== GROUP MANAGEMENT ====================
function loadGroups() {
  onValue(ref(db, "groups"), (snap) => {
    const data = snap.val() || {};
    const groupsList = Object.entries(data).map(([id, g]) => ({ id, ...g }));
    
    document.getElementById("adminMain").innerHTML = `
      <h2>📚 Quản lý nhóm dịch</h2>
      ${groupsList.map(g => `
        <div class="card">
          <h3>${escapeHtml(g.groupName)}</h3>
          <p>👑 Chủ nhóm: ${escapeHtml(g.ownerId)}</p>
          <p>👥 Số thành viên: ${g.members?.length || 0}</p>
          <p>📅 Ngày tạo: ${new Date(g.createdAt).toLocaleDateString()}</p>
          <button onclick="deleteGroup('${g.id}')" style="background:#ff4444; color:white;">🗑 Xóa nhóm</button>
        </div>
      `).join("")}
    `;
  });
}

// ==================== BROADCAST ====================
function loadBroadcast() {
  document.getElementById("adminMain").innerHTML = `
    <h2>📢 Gửi thông báo đến tất cả người dùng</h2>
    <div class="broadcast-box">
      <p>Nội dung thông báo sẽ được gửi đến email của tất cả người dùng:</p>
      <textarea id="broadcastMsg" rows="5" placeholder="Nhập nội dung thông báo..."></textarea>
      <button class="btn-approve" onclick="sendBroadcast()">📨 Gửi ngay</button>
    </div>
  `;
}

// ==================== ACTIONS ====================
window.approveStory = async (id) => {
  await update(ref(db, `stories/${id}`), {
    approved: true,
    status: "approved",
    moderatedBy: currentUserData.uid,
    moderatedAt: Date.now()
  });
  showNotification("Đã duyệt truyện");
};

window.rejectStory = async (id) => {
  const reason = prompt("Lý do từ chối?");
  await update(ref(db, `stories/${id}`), {
    approved: false,
    status: "rejected",
    rejectedReason: reason || "",
    moderatedBy: currentUserData.uid,
    moderatedAt: Date.now()
  });
  showNotification("Đã từ chối truyện");
};

window.deleteStory = async (id) => {
  if (!confirm("Xóa truyện này?")) return;
  await remove(ref(db, `stories/${id}`));
  showNotification("Đã xóa truyện");
};

window.toggleModerator = async (uid, value) => {
  const isMod = value === "true";
  await setModerator(uid, isMod);
  showNotification(isMod ? "Đã cấp quyền Quản lý" : "Đã thu hồi quyền Quản lý");
  loadUsers();
};

window.resetStrike = async (uid) => {
  await update(ref(db, `users/${uid}`), { strike: 0, bannedUntil: 0 });
  showNotification("Đã reset vi phạm");
};

window.deleteUserAccount = async (uid, email) => {
  if (ADMIN_EMAILS.includes(email)) {
    showNotification("Không thể xóa tài khoản Admin!", true);
    return;
  }
  if (!confirm(`Xóa tài khoản ${email}?`)) return;
  try {
    await deleteUser(uid, email);
    showNotification("Đã xóa tài khoản");
    loadUsers();
  } catch (err) {
    showNotification(err.message, true);
  }
};

window.hideComment = async (storyId, commentId) => {
  const commentsRef = ref(db, `comments/${storyId}/${commentId}`);
  const snap = await get(commentsRef);
  const currentHidden = snap.val()?.hidden || false;
  await update(commentsRef, { hidden: !currentHidden });
  showNotification(currentHidden ? "Đã hiện comment" : "Đã ẩn comment");
};

window.deleteGroup = async (groupId) => {
  if (!confirm("Xóa nhóm này? Thành viên sẽ mất quyền nhóm!")) return;
  await deleteGroup(groupId);
  showNotification("Đã xóa nhóm");
  loadGroups();
};

window.sendBroadcast = async () => {
  const msg = document.getElementById("broadcastMsg")?.value;
  if (!msg) { showNotification("Nhập nội dung", true); return; }
  
  const usersSnap = await get(ref(db, "users"));
  const users = usersSnap.val() || {};
  let count = 0;
  
  for (const uid in users) {
    const u = users[uid];
    if (u.email) {
      await push(ref(db, "notifications"), {
        to: u.email,
        subject: "📢 Thông báo từ Admin",
        content: msg,
        sentAt: Date.now(),
        read: false
      });
      count++;
    }
  }
  
  showNotification(`Đã gửi thông báo đến ${count} người dùng`);
  document.getElementById("broadcastMsg").value = "";
};

// ==================== TAB SWITCHER ====================
window.showTab = (tab) => {
  if (tab === "dashboard") loadDashboard();
  if (tab === "stories") loadStories();
  if (tab === "pending") loadPending();
  if (tab === "users") loadUsers();
  if (tab === "comments") loadComments();
  if (tab === "groups") loadGroups();
  if (tab === "broadcast") loadBroadcast();
};

window.goHome = () => {
  window.location.href = "index.html";
};

window.logout = async () => {
  await logout();
  window.location.href = "index.html";
};

// ==================== INIT ====================
(async function() {
  const hasAccess = await checkAdminAccess();
  if (hasAccess) {
    loadDashboard();
  }
})();
</script>
</body>
</html>
