<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>DANMETOPIA ADMIN</title>
<link rel="stylesheet" href="style.css">
<style>
body{
  background:#0f0f0f;
  color:white;
}
.topbar{
  background:#00dc64;
  color:black;
  padding:15px;
  font-weight:bold;
  display:flex;
  justify-content:space-between;
  align-items:center;
}
.container{
  padding:15px;
}
.panel{
  background:#1c1c1c;
  padding:15px;
  border-radius:12px;
  margin-top:15px;
}
.story{
  background:#2a2a2a;
  padding:15px;
  border-radius:10px;
  margin-top:10px;
}
button{
  padding:10px;
  border:none;
  border-radius:8px;
  cursor:pointer;
  margin-top:10px;
  font-weight:bold;
}
.green{
  background:#00dc64;
  color:black;
}
.red{
  background:#ff4444;
  color:white;
}
.yellow{
  background:#ffcc00;
  color:black;
}
input,textarea{
  width:100%;
  padding:10px;
  margin-top:10px;
  border:none;
  border-radius:8px;
  background:#111;
  color:white;
  box-sizing:border-box;
}
textarea{
  height:100px;
  resize:none;
}
.group-item{
  background:#333;
  padding:10px;
  margin:5px 0;
  border-radius:8px;
}
</style>
</head>
<body>
<div class="topbar">
  <div>👑 DANMETOPIA ADMIN</div>
  <button class="red" onclick="logout()">Đăng xuất</button>
</div>
<div class="container">
  <!-- Groups management -->
  <div class="panel">
    <h2>📚 QUẢN LÝ NHÓM DỊCH</h2>
    <div id="groupList"></div>
  </div>
  
  <!-- Duyệt truyện -->
  <div class="panel">
    <h2>📚 DUYỆT TRUYỆN</h2>
    <div id="approvalList"></div>
  </div>
  
  <!-- Quản lý truyện -->
  <div class="panel">
    <h2>🛠 QUẢN LÝ TRUYỆN</h2>
    <div id="storyList"></div>
  </div>
  
  <!-- Upload chapter -->
  <div class="panel">
    <h2>📤 THÊM CHAPTER</h2>
    <input id="chapterStoryId" placeholder="Story ID">
    <input id="chapterTitle" placeholder="Tên chapter">
    <textarea id="chapterPages" placeholder="Mỗi dòng là 1 link ảnh"></textarea>
    <button class="green" onclick="uploadChapter()">ĐĂNG CHAPTER</button>
  </div>
</div>

<script type="module">
import { getStories, updateStory, deleteStory, addChapter, getPendingStories } from "./db.js";
import { db, getAllGroups } from "./auth.js";
import { doc, updateDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-firestore.js";

const user = JSON.parse(localStorage.getItem("user") || "{}");

if (user.role !== "admin") {
  document.body.innerHTML = `<div style="display:flex;justify-content:center;align-items:center;height:100vh;font-size:30px;">❌ KHÔNG CÓ QUYỀN</div>`;
  throw new Error("Not admin");
}

async function load() {
  const stories = await getStories();
  const pending = await getPendingStories();
  renderApproval(pending);
  renderStories(stories);
  loadGroups();
}

function renderApproval(stories) {
  const list = document.getElementById("approvalList");
  list.innerHTML = "";
  stories.forEach(story => {
    if (story.approved) return;
    list.innerHTML += `
      <div class="story">
        <h3>${escapeHtml(story.title)}</h3>
        <p>📚 Nhóm: ${story.groupName || "Cá nhân"}</p>
        <p>👤 Người đăng: ${story.ownerNickname || "Không rõ"}</p>
        <button class="green" onclick="approve('${story.id}')">DUYỆT</button>
        <button class="red" onclick="removeStory('${story.id}')">XÓA</button>
      </div>
    `;
  });
}

function renderStories(stories) {
  const list = document.getElementById("storyList");
  list.innerHTML = "";
  stories.forEach(story => {
    list.innerHTML += `
      <div class="story">
        <h3>${escapeHtml(story.title)}</h3>
        <p>📚 ${story.groupName || "Cá nhân"}</p>
        <p>✅ ${story.approved ? "Đã duyệt" : "Chờ duyệt"}</p>
        <input id="title-${story.id}" value="${escapeHtml(story.title)}" placeholder="Tên truyện">
        <textarea id="desc-${story.id}" placeholder="Mô tả">${escapeHtml(story.desc || "")}</textarea>
        <button class="yellow" onclick="editStory('${story.id}')">CẬP NHẬT</button>
        <button class="red" onclick="removeStory('${story.id}')">XÓA</button>
      </div>
    `;
  });
}

  const groups = await getAllGroups();
  const groupList = document.getElementById("groupList");
  groupList.innerHTML = "";
  groups.forEach(group => {
    groupList.innerHTML += `
      <div class="group
