<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DANMETOPIA - Admin Dashboard</title>
<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
  background: #0f0f0f;
  color: #e0e0e0;
}

.admin-layout {
  display: flex;
  min-height: 100vh;
}

.sidebar {
  width: 260px;
  background: #1c1c1c;
  padding: 20px;
  display: flex;
  flex-direction: column;
  gap: 10px;
  border-right: 1px solid #FF69B4;
}

.sidebar h2 {
  color: #FF69B4;
  margin-bottom: 20px;
  font-size: 20px;
}

.sidebar button {
  padding: 12px;
  border: none;
  background: #2a2a2a;
  color: white;
  border-radius: 10px;
  cursor: pointer;
  text-align: left;
  font-size: 14px;
  transition: background 0.2s;
}

.sidebar button:hover {
  background: #FF69B4;
  color: black;
}

.main-content {
  flex: 1;
  padding: 20px;
  overflow-y: auto;
}

.card {
  background: #1c1c1c;
  padding: 15px;
  margin-bottom: 15px;
  border-radius: 12px;
  border: 1px solid #333;
}

.card h3 {
  color: #FF69B4;
  margin-bottom: 10px;
}

.card p {
  color: #aaa;
  margin-bottom: 10px;
}

button {
  padding: 8px 16px;
  border: none;
  border-radius: 8px;
  cursor: pointer;
  font-weight: bold;
  margin-right: 8px;
}

.btn-approve { background: #FF69B4; color: black; }
.btn-reject { background: #ff4444; color: white; }
.btn-delete { background: #ff8800; color: black; }
.btn-hide { background: #FFCCCC; color: black; }

select {
  padding: 6px 12px;
  background: #2a2a2a;
  border: 1px solid #444;
  border-radius: 8px;
  color: white;
}

.stats-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
  gap: 15px;
  margin-bottom: 30px;
}

.stat-card {
  background: linear-gradient(135deg, #1c1c1c, #2a2a2a);
  padding: 20px;
  border-radius: 16px;
  text-align: center;
  border: 1px solid #FF69B4;
}

.stat-card .number {
  font-size: 32px;
  font-weight: bold;
  color: #FF69B4;
}

.stat-card .label {
  color: #aaa;
  margin-top: 8px;
}

.broadcast-box {
  background: #1c1c1c;
  padding: 20px;
  border-radius: 16px;
  margin-top: 20px;
  border: 1px solid #FF69B4;
}

.broadcast-box textarea {
  width: 100%;
  padding: 12px;
  background: #2a2a2a;
  border: 1px solid #444;
  border-radius: 12px;
  color: white;
  margin: 10px 0;
  resize: vertical;
}

.loading-spinner {
  display: inline-block;
  width: 30px;
  height: 30px;
  border: 3px solid #333;
  border-top-color: #FF69B4;
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
}

@keyframes spin {
  to { transform: rotate(360deg); }
}
</style>
</head>
<body>
<div class="admin-layout">
  <aside class="sidebar">
    <h2>🌸 DANMETOPIA</h2>
    <button onclick="showTab('dashboard')">📊 Dashboard</button>
    <button onclick="showTab('stories')">📚 All Stories</button>
    <button onclick="showTab('pending')">⏳ Pending</button>
    <button onclick="showTab('users')">👤 Users</button>
    <button onclick="showTab('comments')">💬 Comments</button>
    <button onclick="showTab('notifications')">📩 Notifications</button>
    <button onclick="showTab('broadcast')">📢 Broadcast</button>
    <hr style="margin: 15px 0; border-color: #333;">
    <button onclick="logout()" style="background:#ff4444; color:white;">🚪 Đăng xuất</button>
  </aside>
  <main class="main-content" id="adminMain">
    <div style="text-align:center; padding:50px;">
      <div class="loading-spinner"></div>
      <p>Đang tải dashboard...</p>
    </div>
  </main>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
import { getDatabase, ref, get, set, update, remove, push, onValue, off } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyCDQk9DlMNKwn_508fDMI_3IB_dgpgHujA",
  authDomain: "danmetopia.firebaseapp.com",
  projectId: "danmetopia",
  databaseURL: "https://danmetopia-default-rtdb.asia-southeast1.firebasedatabase.app/",
  storageBucket: "danmetopia.appspot.com",
  messagingSenderId: "178240377870",
  appId: "1:178240377870:web:d094b222ebabadccc5585f"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getDatabase(app);

let currentUser = null;
let currentUserData = null;
let storiesUnsubscribe = null;

function showNotification(msg, isError = false) {
  const notif = document.createElement("div");
  notif.style.cssText = `position:fixed;bottom:20px;right:20px;background:${isError ? '#ff4444' : '#FF69B4'};color:black;padding:12px 20px;border-radius:40px;z-index:1000;animation:slideIn 0.3s ease;`;
  notif.innerText = msg;
  document.body.appendChild(notif);
  setTimeout(() => notif.remove(), 3000);
}

function escapeHtml(str) {
  if (!str) return "";
  return str.replace(/[&<>]/g, m => m === "&" ? "&amp;" : m === "<" ? "&lt;" : "&gt;");
}

async function logAction(action, targetId) {
  await push(ref(db, "logs"), {
    action,
    targetId,
    by: currentUser.uid,
    byName: currentUserData?.nickname || currentUser.email,
    time: Date.now()
  });
}

function canModerate() {
  return currentUserData?.role === "admin" || currentUserData?.role === "moderator";
}

function isAdmin() {
  return currentUserData?.role === "admin";
}

// ==================== DASHBOARD ====================
async function loadDashboard() {
  const storiesSnap = await get(ref(db, "stories"));
  const stories = storiesSnap.val() || {};
  const usersSnap = await get(ref(db, "users"));
  const users = usersSnap.val() || {};
  const commentsSnap = await get(ref(db, "comments"));
  const comments = commentsSnap.val() || {};
  
  let totalViews = 0;
  let totalLikes = 0;
  let pendingCount = 0;
  let topStories = [];
  
  Object.entries(stories).forEach(([id, s]) => {
    totalViews += s.views || 0;
    totalLikes += s.likes || 0;
    if (s.status === "pending") pendingCount++;
    topStories.push({ title: s.title, views: s.views || 0 });
  });
  topStories.sort((a,b) => b.views - a.views);
  
  document.getElementById("adminMain").innerHTML = `
    <h2>📊 Dashboard</h2>
    <div class="stats-grid">
      <div class="stat-card"><div class="number">${Object.keys(stories).length}</div><div class="label">📚 Truyện</div></div>
      <div class="stat-card"><div class="number">${totalViews}</div><div class="label">👁 Lượt xem</div></div>
      <div class="stat-card"><div class="number">${totalLikes}</div><div class="label">❤️ Lượt thích</div></div>
      <div class="stat-card"><div class="number">${pendingCount}</div><div class="label">⏳ Chờ duyệt</div></div>
      <div class="stat-card"><div class="number">${Object.keys(users).length}</div><div class="label">👤 Người dùng</div></div>
      <div class="stat-card"><div class="number">${Object.keys(comments).length}</div><div class="label">💬 Bình luận</div></div>
    </div>
    <h3>🔥 Top 5 truyện xem nhiều</h3>
    ${topStories.slice(0,5).map((s, i) => `
      <div class="card">
        <b>${i+1}. ${escapeHtml(s.title)}</b> — 👁 ${s.views}
      </div>
    `).join("")}
  `;
}

// ==================== STORIES MANAGEMENT ====================
function loadStories() {
  if (storiesUnsubscribe) off(ref(db, "stories"));
  
  storiesUnsubscribe = onValue(ref(db, "stories"), (snap) => {
    const data = snap.val() || {};
    const storiesList = Object.entries(data).map(([id, v]) => ({ id, ...v }));
    
    document.getElementById("adminMain").innerHTML = `
      <h2>📚 Tất cả truyện</h2>
      ${storiesList.map(s => `
        <div class="card">
          <h3>${escapeHtml(s.title)}</h3>
          <p>Status: ${s.status || "pending"} | 👤 ${s.groupName || "Cá nhân"} | 👁 ${s.views || 0} | ❤️ ${s.likes || 0}</p>
          <button class="btn-approve" onclick="approveStory('${s.id}')">✔ Duyệt</button>
          <button class="btn-reject" onclick="rejectStory('${s.id}')">❌ Từ chối</button>
          ${isAdmin() ? `<button class="btn-delete" onclick="deleteStory('${s.id}')">🗑 Xóa</button>` : ''}
        </div>
      `).join("")}
    `;
  });
}

// ==================== PENDING MODERATION ====================
function loadPending() {
  if (storiesUnsubscribe) off(ref(db, "stories"));
  
  storiesUnsubscribe = onValue(ref(db, "stories"), (snap) => {
    const data = snap.val() || {};
    const pendingList = Object.entries(data)
      .map(([id, v]) => ({ id, ...v }))
      .filter(s => s.status === "pending");
    
    document.getElementById("adminMain").innerHTML = `
      <h2>⏳ Truyện chờ duyệt (${pendingList.length})</h2>
      ${pendingList.map(s => `
        <div class="card">
          <h3>${escapeHtml(s.title)}</h3>
          <p>👤 ${s.groupName || "Cá nhân"} | 📅 ${new Date(s.createdAt).toLocaleDateString()}</p>
          <button class="btn-approve" onclick="approveStory('${s.id}')">✔ Duyệt</button>
          <button class="btn-reject" onclick="rejectStory('${s.id}')">❌ Từ chối</button>
          ${isAdmin() ? `<button class="btn-delete" onclick="deleteStory('${s.id}')">🗑 Xóa</button>` : ''}
        </div>
      `).join("")}
    `;
  });
}

// ==================== USER MANAGEMENT ====================
function loadUsers() {
  onValue(ref(db, "users"), (snap) => {
    const data = snap.val() || {};
    const usersList = Object.entries(data).map(([id, u]) => ({ id, ...u }));
    
    document.getElementById("adminMain").innerHTML = `
      <h2>👤 Quản lý người dùng</h2>
      ${usersList.map(u => `
        <div class="card">
          <h3>${escapeHtml(u.nickname || u.email)}</h3>
          <p>📧 ${u.email}</p>
          <p>👑 Role: ${u.role || "user"}</p>
          <p>⚠️ Strike: ${u.strike || 0}</p>
          <select id="role-${u.id}" onchange="changeRole('${u.id}', this.value)">
            <option value="user" ${(u.role || "user") === "user" ? "selected" : ""}>User</option>
            <option value="moderator" ${u.role === "moderator" ? "selected" : ""}>Moderator</option>
            <option value="admin" ${u.role === "admin" ? "selected" : ""}>Admin</option>
          </select>
          ${isAdmin() ? `<button onclick="resetStrike('${u.id}')">Reset Strike</button>` : ''}
        </div>
      `).join("")}
    `;
  });
}

// ==================== COMMENTS MODERATION ====================
function loadComments() {
  onValue(ref(db, "comments"), (snap) => {
    const data = snap.val() || {};
    let allComments = [];
    
    Object.entries(data).forEach(([storyId, comments]) => {
      Object.entries(comments).forEach(([cid, c]) => {
        allComments.push({ storyId, cid, ...c });
      });
    });
    
    allComments.sort((a,b) => (b.createdAt || 0) - (a.createdAt || 0));
    
    document.getElementById("adminMain").innerHTML = `
      <h2>💬 Quản lý bình luận</h2>
      ${allComments.map(c => `
        <div class="card">
          <p><b>${escapeHtml(c.userName)}</b> — ${new Date(c.createdAt).toLocaleString()}</p>
          <p>${escapeHtml(c.text)}</p>
          <p style="font-size:12px; color:#888;">Story ID: ${c.storyId}</p>
          ${c.hidden ? '<span style="color:#FF69B4;">🔒 Đã ẩn</span>' : ''}
          <button class="btn-hide" onclick="hideCommentGlobal('${c.storyId}','${c.cid}')">${c.hidden ? 'Hiện' : 'Ẩn'}</button>
        </div>
      `).join("")}
    `;
  });
}

// ==================== NOTIFICATIONS ====================
function loadNotifications() {
  onValue(ref(db, "notifications"), (snap) => {
    const data = snap.val() || {};
    const notifs = Object.entries(data).map(([id, n]) => ({ id, ...n }));
    notifs.sort((a,b) => b.sentAt - a.sentAt);
    
    document.getElementById("adminMain").innerHTML = `
      <h2>📩 Lịch sử thông báo</h2>
      ${notifs.map(n => `
        <div class="card">
          <h3>${escapeHtml(n.subject)}</h3>
          <p>To: ${escapeHtml(n.to)}</p>
          <p>${escapeHtml(n.content)}</p>
          <p style="font-size:12px; color:#888;">${new Date(n.sentAt).toLocaleString()}</p>
        </div>
      `).join("")}
    `;
  });
}

// ==================== BROADCAST ====================
function loadBroadcast() {
  document.getElementById("adminMain").innerHTML = `
    <h2>📢 Gửi thông báo hàng loạt</h2>
    <div class="broadcast-box">
      <p>Gửi email thông báo đến TẤT CẢ người dùng:</p>
      <textarea id="broadcastMsg" rows="5" placeholder="Nhập nội dung thông báo..."></textarea>
      <button class="btn-approve" onclick="sendBroadcast()">📨 Gửi ngay</button>
    </div>
  `;
}

// ==================== ACTIONS ====================
window.approveStory = async (id) => {
  if (!canModerate()) return;
  await update(ref(db, `stories/${id}`), {
    approved: true,
    status: "approved",
    moderatedBy: currentUser.uid,
    moderatedAt: Date.now()
  });
  await logAction("approve_story", id);
  showNotification("Đã duyệt truyện");
};

window.rejectStory = async (id) => {
  if (!canModerate()) return;
  const reason = prompt("Lý do từ chối?");
  await update(ref(db, `stories/${id}`), {
    approved: false,
    status: "rejected",
    rejectedReason: reason || "",
    moderatedBy: currentUser.uid,
    moderatedAt: Date.now()
  });
  await logAction("reject_story", id);
  showNotification("Đã từ chối truyện");
};

window.deleteStory = async (id) => {
  if (!isAdmin()) return;
  if (!confirm("Xóa truyện này?")) return;
  await remove(ref(db, `stories/${id}`));
  await logAction("delete_story", id);
  showNotification("Đã xóa truyện");
};

window.changeRole = async (uid, role) => {
  if (!isAdmin()) return;
  await update(ref(db, `users/${uid}`), { role });
  await logAction("change_role", uid);
  showNotification(`Đã đổi role thành ${role}`);
};

window.resetStrike = async (uid) => {
  if (!isAdmin()) return;
  await update(ref(db, `users/${uid}`), { strike: 0, bannedUntil: 0 });
  await logAction("reset_strike", uid);
  showNotification("Đã reset strike");
};

window.hideCommentGlobal = async (storyId, commentId) => {
  if (!canModerate()) return;
  const commentsRef = ref(db, `comments/${storyId}/${commentId}`);
  const snap = await get(commentsRef);
  const currentHidden = snap.val()?.hidden || false;
  await update(commentsRef, { hidden: !currentHidden });
  await logAction(currentHidden ? "unhide_comment" : "hide_comment", commentId);
  showNotification(currentHidden ? "Đã hiện comment" : "Đã ẩn comment");
};

window.sendBroadcast = async () => {
  if (!isAdmin()) return;
  const msg = document.getElementById("broadcastMsg")?.value;
  if (!msg) { showNotification("Nhập nội dung", true); return; }
  
  const usersSnap = await get(ref(db, "users"));
  const users = usersSnap.val() || {};
  
  for (const uid in users) {
    const u = users[uid];
    if (u.email) {
      await push(ref(db, "notifications"), {
        to: u.email,
        subject: "📢 Thông báo từ Admin",
        content: msg,
        sentAt: Date.now(),
        read: false
      });
    }
  }
  
  await logAction("broadcast", msg.substring(0, 50));
  showNotification(`Đã gửi broadcast đến ${Object.keys(users).length} người dùng`);
  document.getElementById("broadcastMsg").value = "";
};

// ==================== TAB SWITCHER ====================
window.showTab = (tab) => {
  if (tab === "dashboard") loadDashboard();
  if (tab === "stories") loadStories();
  if (tab === "pending") loadPending();
  if (tab === "users") loadUsers();
  if (tab === "comments") loadComments();
  if (tab === "notifications") loadNotifications();
  if (tab === "broadcast") loadBroadcast();
};

// ==================== LOGOUT ====================
window.logout = async () => {
  await signOut(auth);
  window.location.href = "index.html";
};

// ==================== AUTH GUARD ====================
onAuthStateChanged(auth, async (user) => {
  if (!user) {
    window.location.href = "index.html";
    return;
  }
  
  const userSnap = await get(ref(db, `users/${user.uid}`));
  const userData = userSnap.val();
  
  if (!userData || (userData.role !== "admin" && userData.role !== "moderator")) {
    document.body.innerHTML = "<div style='height:100vh;display:flex;justify-content:center;align-items:center;'><h1 style='color:#ff4444;'>⛔ Không có quyền truy cập</h1></div>";
    return;
  }
  
  currentUser = user;
  currentUserData = userData;
  loadDashboard();
});
</script>
</body>
</html>
