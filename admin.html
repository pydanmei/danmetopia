<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>🌸 DANMETOPIA - Trang quản trị 🌸</title>
<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
  background: #0f0f0f;
  color: #e0e0e0;
}

.admin-layout {
  display: flex;
  min-height: 100vh;
}

.sidebar {
  width: 260px;
  background: #1c1c1c;
  padding: 20px;
  display: flex;
  flex-direction: column;
  gap: 10px;
  border-right: 1px solid #FF69B4;
}

.sidebar h2 {
  color: #FF69B4;
  margin-bottom: 20px;
  font-size: 20px;
}

.sidebar button {
  padding: 12px;
  border: none;
  background: #2a2a2a;
  color: white;
  border-radius: 10px;
  cursor: pointer;
  text-align: left;
  font-size: 14px;
  transition: background 0.2s;
}

.sidebar button:hover {
  background: #FF69B4;
  color: black;
}

.main-content {
  flex: 1;
  padding: 20px;
  overflow-y: auto;
}

.card {
  background: #1c1c1c;
  padding: 15px;
  margin-bottom: 15px;
  border-radius: 12px;
  border: 1px solid #333;
}

.card h3 {
  color: #FF69B4;
  margin-bottom: 10px;
}

.card p {
  color: #aaa;
  margin-bottom: 10px;
}

button {
  padding: 8px 16px;
  border: none;
  border-radius: 8px;
  cursor: pointer;
  font-weight: bold;
  margin-right: 8px;
  margin-bottom: 8px;
}

.btn-approve { background: #00dc64; color: black; }
.btn-reject { background: #ff4444; color: white; }
.btn-delete { background: #ff8800; color: black; }
.btn-hide { background: #FFCCCC; color: black; }

select {
  padding: 6px 12px;
  background: #2a2a2a;
  border: 1px solid #444;
  border-radius: 8px;
  color: white;
}

.stats-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
  gap: 15px;
  margin-bottom: 30px;
}

.stat-card {
  background: linear-gradient(135deg, #1c1c1c, #2a2a2a);
  padding: 20px;
  border-radius: 16px;
  text-align: center;
  border: 1px solid #FF69B4;
}

.stat-card .number {
  font-size: 32px;
  font-weight: bold;
  color: #FF69B4;
}

.stat-card .label {
  color: #aaa;
  margin-top: 8px;
}

.broadcast-box {
  background: #1c1c1c;
  padding: 20px;
  border-radius: 16px;
  margin-top: 20px;
  border: 1px solid #FF69B4;
}

.broadcast-box textarea {
  width: 100%;
  padding: 12px;
  background: #2a2a2a;
  border: 1px solid #444;
  border-radius: 12px;
  color: white;
  margin: 10px 0;
  resize: vertical;
}

.loading-spinner {
  display: inline-block;
  width: 30px;
  height: 30px;
  border: 3px solid #333;
  border-top-color: #FF69B4;
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
}

@keyframes spin {
  to { transform: rotate(360deg); }
}

.user-badge {
  display: inline-block;
  padding: 2px 8px;
  border-radius: 12px;
  font-size: 11px;
  font-weight: bold;
  margin-left: 8px;
}

.badge-admin { background: #FF1493; color: white; }
.badge-moderator { background: #FF69B4; color: black; }
.badge-group { background: #FFCCCC; color: black; }
.badge-user { background: #555; color: white; }
</style>
</head>
<body>
<div class="admin-layout">
  <aside class="sidebar">
    <h2>🌸 DANMETOPIA 🌸</h2>
    <button id="dashboardBtn">📊 Tổng quan</button>
    <button id="storiesBtn">📚 Tất cả truyện</button>
    <button id="pendingBtn">⏳ Chờ duyệt</button>
    <button id="usersBtn">👤 Người dùng</button>
    <button id="commentsBtn">💬 Bình luận</button>
    <button id="groupsBtn">📚 Nhóm dịch</button>
    <button id="broadcastBtn">📢 Gửi thông báo</button>
    <hr style="margin: 15px 0; border-color: #333;">
    <button id="homeBtn">🏠 Về trang chủ</button>
    <button id="logoutBtn" style="background:#ff4444; color:white;">🚪 Đăng xuất</button>
  </aside>
  <main class="main-content" id="adminMain">
    <div style="text-align:center; padding:50px;">
      <div class="loading-spinner"></div>
      <p>Đang tải...</p>
    </div>
  </main>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
import { getAuth, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
import { getDatabase, ref, get, set, update, remove, push, onValue, off, query, orderByChild } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyCDQk9DlMNKwn_508fDMI_3IB_dgpgHujA",
  authDomain: "danmetopia.firebaseapp.com",
  projectId: "danmetopia",
  databaseURL: "https://danmetopia-default-rtdb.asia-southeast1.firebasedatabase.app/",
  storageBucket: "danmetopia.appspot.com",
  messagingSenderId: "178240377870",
  appId: "1:178240377870:web:d094b222ebabadccc5585f"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getDatabase(app);

let currentUserData = null;
let currentUnsubscribe = null;

// ==================== HELPER FUNCTIONS ====================
function showNotification(msg, isError = false) {
  const notif = document.createElement("div");
  notif.style.cssText = `position:fixed;bottom:20px;right:20px;background:${isError ? '#ff4444' : '#FF69B4'};color:black;padding:12px 20px;border-radius:40px;z-index:1000;animation:slideIn 0.3s ease;`;
  notif.innerText = msg;
  document.body.appendChild(notif);
  setTimeout(() => notif.remove(), 3000);
}

function escapeHtml(str) {
  if (!str) return "";
  return str.replace(/[&<>]/g, m => m === "&" ? "&amp;" : m === "<" ? "&lt;" : "&gt;");
}

function showLoading(show) {
  const main = document.getElementById("adminMain");
  if (show && main) {
    main.innerHTML = '<div style="text-align:center; padding:50px;"><div class="loading-spinner"></div><p>Đang tải...</p></div>';
  }
}

function getUserBadge(user) {
  if (user.role === "admin") return '<span class="user-badge badge-admin">Admin</span>';
  if (user.privileges?.moderator) return '<span class="user-badge badge-moderator">Quản lý</span>';
  if (user.privileges?.groupId) return '<span class="user-badge badge-group">Nhóm dịch</span>';
  return '<span class="user-badge badge-user">Người dùng</span>';
}

// ==================== AUTH GUARD ====================
async function checkAdminAccess() {
  const session = localStorage.getItem("userSession");
  if (!session) {
    window.location.href = "index.html";
    return false;
  }
  try {
    const data = JSON.parse(session);
    if (data.role !== "admin" && !data.privileges?.moderator) {
      document.getElementById("adminMain").innerHTML = "<div style='text-align:center; padding:50px;'><h1 style='color:#ff4444;'>⛔ Không có quyền truy cập</h1><button onclick='window.location.href=\"index.html\"'>Về trang chủ</button></div>";
      return false;
    }
    currentUserData = data;
    return true;
  } catch(e) {
    window.location.href = "index.html";
    return false;
  }
}

// ==================== DASHBOARD ====================
async function loadDashboard() {
  showLoading(true);
  try {
    const [storiesSnap, usersSnap, commentsSnap, groupsSnap] = await Promise.all([
      get(ref(db, "stories")),
      get(ref(db, "users")),
      get(ref(db, "comments")),
      get(ref(db, "groups"))
    ]);
    
    const stories = storiesSnap.val() || {};
    const users = usersSnap.val() || {};
    const comments = commentsSnap.val() || {};
    const groups = groupsSnap.val() || {};
    
    let totalViews = 0;
    let totalLikes = 0;
    let pendingCount = 0;
    let topStories = [];
    
    Object.entries(stories).forEach(([id, s]) => {
      totalViews += s.views || 0;
      totalLikes += s.likes || 0;
      if (s.approved === false) pendingCount++;
      topStories.push({ title: s.title, views: s.views || 0 });
    });
    topStories.sort((a,b) => b.views - a.views);
    
    document.getElementById("adminMain").innerHTML = `
      <h2>📊 Tổng quan</h2>
      <div class="stats-grid">
        <div class="stat-card"><div class="number">${Object.keys(stories).length}</div><div class="label">📚 Truyện</div></div>
        <div class="stat-card"><div class="number">${totalViews}</div><div class="label">👁 Lượt xem</div></div>
        <div class="stat-card"><div class="number">${totalLikes}</div><div class="label">❤️ Lượt thích</div></div>
        <div class="stat-card"><div class="number">${pendingCount}</div><div class="label">⏳ Chờ duyệt</div></div>
        <div class="stat-card"><div class="number">${Object.keys(users).length}</div><div class="label">👤 Người dùng</div></div>
        <div class="stat-card"><div class="number">${Object.keys(comments).length}</div><div class="label">💬 Bình luận</div></div>
        <div class="stat-card"><div class="number">${Object.keys(groups).length}</div><div class="label">📚 Nhóm dịch</div></div>
      </div>
      <h3>🔥 Top 5 truyện xem nhiều nhất</h3>
      ${topStories.slice(0,5).map((s, i) => `
        <div class="card">
          <b>${i+1}. ${escapeHtml(s.title)}</b> — 👁 ${s.views}
        </div>
      `).join("")}
    `;
  } catch (err) {
    console.error("Dashboard error:", err);
    document.getElementById("adminMain").innerHTML = `<div class="card"><p>Lỗi tải dữ liệu: ${err.message}</p></div>`;
  }
}

// ==================== STORIES MANAGEMENT ====================
function loadStories() {
  if (currentUnsubscribe) currentUnsubscribe();
  
  const storiesRef = ref(db, 'stories');
  currentUnsubscribe = onValue(storiesRef, (snap) => {
    const data = snap.val() || {};
    const storiesList = Object.entries(data).map(([id, v]) => ({ id, ...v }));
    
    document.getElementById("adminMain").innerHTML = `
      <h2>📚 Tất cả truyện (${storiesList.length})</h2>
      ${storiesList.map(s => `
        <div class="card">
          <h3>${escapeHtml(s.title)}</h3>
          <p>📚 Nhóm: ${escapeHtml(s.groupName) || "Cá nhân"} | 👤 Chủ: ${escapeHtml(s.ownerNickname) || "Không rõ"}</p>
          <p>📌 Trạng thái: ${s.approved === true ? '✅ Đã duyệt' : '⏳ Chờ duyệt'} | 📖 Tình trạng: ${s.status || "Đang tiến hành"}</p>
          <p>👁 Lượt xem: ${s.views || 0} | ❤️ Lượt thích: ${s.likes || 0}</p>
          <button class="btn-approve" onclick="approveStory('${s.id}')">✔ Duyệt</button>
          <button class="btn-reject" onclick="rejectStory('${s.id}')">❌ Từ chối</button>
          ${currentUserData?.role === "admin" ? `<button class="btn-delete" onclick="deleteStory('${s.id}')">🗑 Xóa</button>` : ''}
        </div>
      `).join("")}
    `;
  });
}

// ==================== PENDING STORIES ====================
function loadPending() {
  if (currentUnsubscribe) currentUnsubscribe();
  
  const storiesRef = ref(db, 'stories');
  currentUnsubscribe = onValue(storiesRef, (snap) => {
    const data = snap.val() || {};
    const pendingList = Object.entries(data)
      .map(([id, v]) => ({ id, ...v }))
      .filter(s => s.approved === false);
    
    document.getElementById("adminMain").innerHTML = `
      <h2>⏳ Truyện chờ duyệt (${pendingList.length})</h2>
      ${pendingList.map(s => `
        <div class="card">
          <h3>${escapeHtml(s.title)}</h3>
          <p>📚 Nhóm: ${escapeHtml(s.groupName) || "Cá nhân"} | 👤 Chủ: ${escapeHtml(s.ownerNickname) || "Không rõ"}</p>
          <p>📅 Ngày đăng: ${new Date(s.createdAt).toLocaleDateString()}</p>
          <button class="btn-approve" onclick="approveStory('${s.id}')">✔ Duyệt</button>
          <button class="btn-reject" onclick="rejectStory('${s.id}')">❌ Từ chối</button>
          ${currentUserData?.role === "admin" ? `<button class="btn-delete" onclick="deleteStory('${s.id}')">🗑 Xóa</button>` : ''}
        </div>
      `).join("")}
    `;
  });
}

// ==================== USER MANAGEMENT ====================
function loadUsers() {
  if (currentUnsubscribe) currentUnsubscribe();
  
  const usersRef = ref(db, 'users');
  currentUnsubscribe = onValue(usersRef, (snap) => {
    const data = snap.val() || {};
    const usersList = Object.entries(data).map(([id, u]) => ({ id, ...u }));
    
    document.getElementById("adminMain").innerHTML = `
      <h2>👤 Quản lý người dùng (${usersList.length})</h2>
      ${usersList.map(u => `
        <div class="card">
          <h3>${escapeHtml(u.nickname || u.email)} ${getUserBadge(u)}</h3>
          <p>📧 ${u.email}</p>
          <p>📅 Tham gia: ${new Date(u.createdAt).toLocaleDateString()}</p>
          <p>⚠️ Vi phạm: ${u.strike || 0}</p>
          <div style="margin-top:10px;">
            <select id="moderator-${u.id}" onchange="toggleModerator('${u.id}', this.value)">
              <option value="false" ${!u.privileges?.moderator ? "selected" : ""}>👤 Người dùng thường</option>
              <option value="true" ${u.privileges?.moderator ? "selected" : ""}>🛡️ Quản lý (Moderator)</option>
            </select>
            ${currentUserData?.role === "admin" ? `<button onclick="resetStrike('${u.id}')" style="background:#FFCCCC; color:black;">🔄 Reset vi phạm</button>` : ''}
            ${currentUserData?.role === "admin" ? `<button onclick="deleteUser('${u.id}', '${escapeHtml(u.email)}')" style="background:#ff4444; color:white;">🗑 Xóa tài khoản</button>` : ''}
          </div>
        </div>
      `).join("")}
    `;
  });
}

// ==================== COMMENTS MANAGEMENT ====================
function loadComments() {
  if (currentUnsubscribe) currentUnsubscribe();
  
  const commentsRef = ref(db, 'comments');
  currentUnsubscribe = onValue(commentsRef, (snap) => {
    const data = snap.val() || {};
    let allComments = [];
    
    Object.entries(data).forEach(([storyId, comments]) => {
      Object.entries(comments).forEach(([cid, c]) => {
        allComments.push({ storyId, cid, ...c });
      });
    });
    
    allComments.sort((a,b) => (b.createdAt || 0) - (a.createdAt || 0));
    
    document.getElementById("adminMain").innerHTML = `
      <h2>💬 Quản lý bình luận (${allComments.length})</h2>
      ${allComments.map(c => `
        <div class="card">
          <p><b>${escapeHtml(c.userName)}</b> — ${new Date(c.createdAt).toLocaleString()}</p>
          <p>${escapeHtml(c.text)}</p>
          <p style="font-size:12px; color:#888;">Truyện ID: ${c.storyId}</p>
          ${c.hidden ? '<span style="color:#FF69B4;">🔒 Đã ẩn</span>' : ''}
          <button class="btn-hide" onclick="hideComment('${c.storyId}','${c.cid}')">${c.hidden ? 'Hiện' : 'Ẩn'}</button>
          ${currentUserData?.role === "admin" ? `<button class="btn-delete" onclick="deleteComment('${c.storyId}','${c.cid}')">🗑 Xóa</button>` : ''}
        </div>
      `).join("")}
    `;
  });
}

// ==================== GROUPS MANAGEMENT ====================
function loadGroups() {
  if (currentUnsubscribe) currentUnsubscribe();
  
  const groupsRef = ref(db, 'groups');
  currentUnsubscribe = onValue(groupsRef, (snap) => {
    const data = snap.val() || {};
    const groupsList = Object.entries(data).map(([id, g]) => ({ id, ...g }));
    
    document.getElementById("adminMain").innerHTML = `
      <h2>📚 Quản lý nhóm dịch (${groupsList.length})</h2>
      ${groupsList.map(g => `
        <div class="card">
          <h3>${escapeHtml(g.groupName)}</h3>
          <p>👤 Chủ nhóm: ${escapeHtml(g.ownerId)}</p>
          <p>👥 Số thành viên: ${g.members?.length || 0}</p>
          <p>📅 Ngày tạo: ${new Date(g.createdAt).toLocaleDateString()}</p>
          ${currentUserData?.role === "admin" ? `<button onclick="deleteGroup('${g.id}')" style="background:#ff4444; color:white;">🗑 Xóa nhóm</button>` : ''}
        </div>
      `).join("")}
    `;
  });
}

// ==================== BROADCAST ====================
function loadBroadcast() {
  if (currentUnsubscribe) currentUnsubscribe();
  
  document.getElementById("adminMain").innerHTML = `
    <h2>📢 Gửi thông báo đến tất cả người dùng</h2>
    <div class="broadcast-box">
      <p>Nội dung thông báo sẽ được gửi đến email của tất cả người dùng:</p>
      <textarea id="broadcastMsg" rows="5" placeholder="Nhập nội dung thông báo..."></textarea>
      <button class="btn-approve" onclick="sendBroadcast()">📨 Gửi ngay</button>
    </div>
    <h3 style="margin-top:20px;">📩 Lịch sử thông báo</h3>
    <div id="notificationHistory"></div>
  `;
  loadNotificationHistory();
}

async function loadNotificationHistory() {
  const notifRef = ref(db, 'notifications');
  const snapshot = await get(notifRef);
  const data = snapshot.val() || {};
  const notifs = Object.entries(data).map(([id, n]) => ({ id, ...n }));
  notifs.sort((a,b) => b.sentAt - a.sentAt);
  
  document.getElementById("notificationHistory").innerHTML = notifs.slice(0,20).map(n => `
    <div class="card">
      <p><b>📧 ${escapeHtml(n.to)}</b> — ${new Date(n.sentAt).toLocaleString()}</p>
      <p><b>${escapeHtml(n.subject)}</b></p>
      <p>${escapeHtml(n.content)}</p>
    </div>
  `).join("") || "<p>Chưa có thông báo nào</p>";
}

// ==================== ACTIONS ====================
window.approveStory = async (id) => {
  await update(ref(db, `stories/${id}`), { approved: true });
  showNotification("Đã duyệt truyện");
  loadPending();
};

window.rejectStory = async (id) => {
  await update(ref(db, `stories/${id}`), { approved: false });
  showNotification("Đã từ chối truyện");
  loadPending();
};

window.deleteStory = async (id) => {
  if (!confirm("Xóa truyện này?")) return;
  await remove(ref(db, `stories/${id}`));
  showNotification("Đã xóa truyện");
  loadStories();
};

window.toggleModerator = async (uid, value) => {
  const isMod = value === "true";
  await update(ref(db, `users/${uid}/privileges`), { moderator: isMod });
  showNotification(isMod ? "Đã cấp quyền Quản lý" : "Đã thu hồi quyền Quản lý");
  loadUsers();
};

window.resetStrike = async (uid) => {
  await update(ref(db, `users/${uid}`), { strike: 0, bannedUntil: 0 });
  showNotification("Đã reset vi phạm");
  loadUsers();
};

window.deleteUser = async (uid, email) => {
  const ADMIN_EMAILS = ["pydanmeii@gmail.com", "pepyl4298@gmail.com", "maihuong4298@gmail.com"];
  if (ADMIN_EMAILS.includes(email)) {
    showNotification("Không thể xóa tài khoản Admin!", true);
    return;
  }
  if (!confirm(`Xóa tài khoản ${email}?`)) return;
  await remove(ref(db, `users/${uid}`));
  showNotification("Đã xóa tài khoản");
  loadUsers();
};

window.hideComment = async (storyId, commentId) => {
  const commentsRef = ref(db, `comments/${storyId}/${commentId}`);
  const snap = await get(commentsRef);
  const currentHidden = snap.val()?.hidden || false;
  await update(commentsRef, { hidden: !currentHidden });
  showNotification(currentHidden ? "Đã hiện comment" : "Đã ẩn comment");
  loadComments();
};

window.deleteComment = async (storyId, commentId) => {
  if (!confirm("Xóa bình luận này?")) return;
  await remove(ref(db, `comments/${storyId}/${commentId}`));
  showNotification("Đã xóa bình luận");
  loadComments();
};

window.deleteGroup = async (groupId) => {
  if (!confirm("Xóa nhóm này? Thành viên sẽ mất quyền nhóm!")) return;
  await remove(ref(db, `groups/${groupId}`));
  showNotification("Đã xóa nhóm");
  loadGroups();
};

window.sendBroadcast = async () => {
  const msg = document.getElementById("broadcastMsg")?.value;
  if (!msg) { showNotification("Nhập nội dung", true); return; }
  
  const usersSnap = await get(ref(db, "users"));
  const users = usersSnap.val() || {};
  let count = 0;
  
  for (const uid in users) {
    const u = users[uid];
    if (u.email) {
      await push(ref(db, "notifications"), {
        to: u.email,
        subject: "📢 Thông báo từ Admin",
        content: msg,
        sentAt: Date.now(),
        read: false
      });
      count++;
    }
  }
  
  showNotification(`Đã gửi thông báo đến ${count} người dùng`);
  document.getElementById("broadcastMsg").value = "";
  loadNotificationHistory();
};

// ==================== LOGOUT & NAVIGATION ====================
window.logout = async () => {
  await signOut(auth);
  localStorage.removeItem("userSession");
  window.location.href = "index.html";
};

window.goHome = () => {
  window.location.href = "index.html";
};

// ==================== TAB SWITCHER ====================
function switchTab(tab) {
  if (currentUnsubscribe) {
    currentUnsubscribe();
    currentUnsubscribe = null;
  }
  
  switch(tab) {
    case 'dashboard': loadDashboard(); break;
    case 'stories': loadStories(); break;
    case 'pending': loadPending(); break;
    case 'users': loadUsers(); break;
    case 'comments': loadComments(); break;
    case 'groups': loadGroups(); break;
    case 'broadcast': loadBroadcast(); break;
  }
}

// ==================== INIT ====================
(async function() {
  const hasAccess = await checkAdminAccess();
  if (hasAccess) {
    loadDashboard();
    
    document.getElementById("dashboardBtn").onclick = () => switchTab('dashboard');
    document.getElementById("storiesBtn").onclick = () => switchTab('stories');
    document.getElementById("pendingBtn").onclick = () => switchTab('pending');
    document.getElementById("usersBtn").onclick = () => switchTab('users');
    document.getElementById("commentsBtn").onclick = () => switchTab('comments');
    document.getElementById("groupsBtn").onclick = () => switchTab('groups');
    document.getElementById("broadcastBtn").onclick = () => switchTab('broadcast');
    document.getElementById("homeBtn").onclick = () => window.goHome();
    document.getElementById("logoutBtn").onclick = () => window.logout();
  }
})();
</script>
</body>
</html>
