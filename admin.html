<!DOCTYPE html>
<html>

<head>
  <title>ADMIN DANMETOPIA</title>

  <style>
    body{
      background:#0f0f0f;
      color:white;
      font-family:Arial;
      padding:20px;
    }

    input, button{
      padding:10px;
      margin:5px;
      width:300px;
      display:block;
    }

    button{
      background:#00dc64;
      border:none;
      cursor:pointer;
    }

    .box{
      background:#1c1c1c;
      padding:15px;
      margin:10px 0;
      border-radius:10px;
    }
  </style>
</head>

<body>

<h1>ADMIN PANEL</h1>

<!-- STORY -->
<div class="box">
  <h3>Thêm truyện</h3>
  <input id="title" placeholder="Tên truyện">
  <input id="genre" placeholder="Thể loại">
  <button onclick="addStory()">Thêm truyện</button>
</div>

<!-- CHAPTER -->
<div class="box">
  <h3>Thêm chapter</h3>
  <input id="storyId" placeholder="Story ID">
  <input id="chapterTitle" placeholder="Tên chapter">
  <button onclick="addChapter()">Thêm chapter</button>
</div>

<!-- UPLOAD -->
<div class="box">
  <h3>Upload ảnh chapter</h3>
  <input id="uStoryId" placeholder="Story ID">
  <input id="uChapterId" placeholder="Chapter ID">
  <input type="file" id="files" multiple>
  <button onclick="upload()">Upload</button>
</div>

<script>

/* ADD STORY */
function addStory(){

  fetch("http://localhost:3000/api/story",{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({
      title:document.getElementById("title").value,
      genre:document.getElementById("genre").value
    })
  })

  .then(res=>res.json())
  .then(()=>alert("Đã thêm truyện"));
}

/* ADD CHAPTER */
function addChapter(){

  const storyId = document.getElementById("storyId").value;

  fetch(`http://localhost:3000/api/chapter/${storyId}`,{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({
      title:document.getElementById("chapterTitle").value
    })
  })

  .then(res=>res.json())
  .then(()=>alert("Đã thêm chapter"));
}

/* UPLOAD IMAGES */
function upload(){

  const storyId = document.getElementById("uStoryId").value;
  const chapterId = document.getElementById("uChapterId").value;
  const files = document.getElementById("files").files;

  const formData = new FormData();

  for(let i=0;i<files.length;i++){
    formData.append("images", files[i]);
  }

  fetch(`http://localhost:3000/api/upload/${storyId}/${chapterId}`,{
    method:"POST",
    body:formData
  })
  .then(()=>alert("Upload xong"));

}

</script>

</body>
</html>
