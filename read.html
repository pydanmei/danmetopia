<!DOCTYPE html>
<html>

<body style="margin:0;background:black;color:white;font-family:Arial">

<div style="background:#00dc64;color:black;padding:10px;display:flex;justify-content:space-between">
  <button onclick="location.href='home.html'">HOME</button>
  <div id="title"></div>
  <button onclick="toggle()">MENU</button>
</div>

<div id="menu" style="display:none;position:fixed;right:10px;top:50px;background:#1c1c1c;padding:10px"></div>

<div id="info" style="padding:15px;background:#111;margin-top:40px"></div>

<div id="pages"></div>

<div style="position:fixed;bottom:0;left:0;right:0;background:#111;display:flex">
  <button onclick="prev()" style="flex:1">⬅</button>
  <button onclick="next()" style="flex:1">➡</button>
</div>

<script>

let id = Number(new URLSearchParams(location.search).get("id"));

const role = localStorage.getItem("role");
const myGroup = localStorage.getItem("group");

/* LOAD STORY */
let stories = JSON.parse(localStorage.getItem("stories") || "[]");

let data = stories.find(s => s.id == id);

/* fallback */
if(!data){
  data = {
    title:"Demo",
    alt:"Demo Alt",
    author:"Unknown",
    genre:"Test",
    chapters:3,
    tags:["18+"],
    owner:"system"
  };
}

document.getElementById("title").innerText = data.title;

/* INFO */
function renderInfo(){

document.getElementById("info").innerHTML=`
  <h2>${data.title}</h2>
  <b>Tên khác:</b> ${data.alt}<br>
  <b>Tác giả:</b> ${data.author}<br>
  <b>Thể loại:</b> ${data.genre}<br>
  <b>Số chương:</b> ${data.chapters}<br>
  <b>Owner:</b> ${data.owner}</b><br>

  <div>${data.tags.map(t=>`<span style="background:#00dc64;color:black;padding:3px 8px;margin:3px;display:inline-block">${t}</span>`).join("")}</div>
`;

}

renderInfo();

/* PERMISSION RULE */
const canEdit =
  role === "admin" ||
  (role === "group" && data.owner === myGroup);

/* MENU */
let chapters = [1,2,3];

document.getElementById("menu").innerHTML =
chapters.map(c=>`<div onclick="go(${c})">Chapter ${c}</div>`).join("");

function toggle(){
  const m=document.getElementById("menu");
  m.style.display = m.style.display==="block"?"none":"block";
}

function go(cid){
  location.href="read.html?id="+cid;
}

/* WEBTOON */
function load(){
  let html="";
  for(let i=1;i<=6;i++){
    html+=`<img src="https://picsum.photos/800/1200?${id}${i}">`;
  }
  document.getElementById("pages").innerHTML=html;
}

load();

/* NAV */
function next(){
  location.href="read.html?id="+(id+1);
}

function prev(){
  location.href="read.html?id="+(id-1);
}

</script>

</body>
</html>
