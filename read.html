<!DOCTYPE html>
<html>

<head>
<meta charset="utf-8">
<title>Đọc truyện</title>

<style>
body{
  margin:0;
  background:#0f0f0f;
  color:white;
  font-family:Arial;
}

.top{
  background:#00dc64;
  color:black;
  padding:10px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.container{
  padding:15px;
}

.chapter-list{
  background:#1c1c1c;
  padding:10px;
  border-radius:10px;
  margin-bottom:10px;
}

button{
  padding:8px;
  margin:5px;
  border:none;
  border-radius:5px;
  cursor:pointer;
}

.green{background:#00dc64;}
.gray{background:#333;color:white;}

.content{
  background:#111;
  padding:20px;
  border-radius:10px;
  min-height:300px;
}

.nav{
  display:flex;
  justify-content:space-between;
  margin-top:10px;
}
</style>

</head>

<body>

<div class="top">
<button onclick="home()">🏠 Trang chủ</button>
<div id="title">Truyện</div>
<button onclick="menu()">📖 Mục lục</button>
</div>

<div class="container">

<div class="chapter-list" id="menu" style="display:none"></div>

<div class="content" id="content">
Loading...
</div>

<div class="nav">
<button class="gray" onclick="prev()">⬅ Trước</button>
<button class="gray" onclick="next()">Sau ➡</button>
</div>

</div>

<script>

const storyId = new URLSearchParams(location.search).get("id");

const chapters = [
  "Chương 1: Khởi đầu",
  "Chương 2: Bí ẩn",
  "Chương 3: Cuộc chiến"
];

let current = 0;

document.getElementById("content").innerText = chapters[current];

document.getElementById("menu").innerHTML =
chapters.map((c,i)=>`
  <button class="green" onclick="go(${i})">${c}</button>
`).join("");

function go(i){
  current = i;
  render();
}

function render(){
  document.getElementById("content").innerText = chapters[current];
}

function prev(){
  if(current>0){ current--; render(); }
}

function next(){
  if(current<chapters.length-1){ current++; render(); }
}

function menu(){
  const m = document.getElementById("menu");
  m.style.display = m.style.display==="none"?"block":"none";
}

function home(){
  window.location.href="home.html";
}

</script>

</body>
</html>
