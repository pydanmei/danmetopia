<!DOCTYPE html>
<html>

<head>
<meta charset="utf-8">
<title>Reader</title>

<style>
body{margin:0;background:#000;color:white;font-family:Arial}
.top{background:#00dc64;color:black;padding:10px;display:flex;justify-content:space-between}
.page{padding:20px;text-align:center}
button{padding:8px;margin:5px}
</style>

</head>

<body>

<div class="top">
<button onclick="home()">🏠 Trang chủ</button>
<div id="title">Truyện</div>
<button onclick="menu()">📖 Mục lục</button>
</div>
 
<div class="container">

<div class="chapter-list" id="menu" style="display:none"></div>

<div class="page" id="content"></div>

<script type="module">
Loading...
</div>

<div class="nav">
<button class="gray" onclick="prev()">⬅ Trước</button>
<button class="gray" onclick="next()">Sau ➡</button>
</div>

</div>

<script>

import { DB } from "./db.js";
  
const id = new URLSearchParams(location.search).get("id");
let chap = parseInt(new URLSearchParams(location.search).get(""));

const chapters = [
  "Chương 1: Khởi đầu",
  "Chương 2: Bí ẩn",
  "Chương 3: Cuộc chiến"
];

let current = 0;

document.getElementById("content").innerText = chapters[current];

document.getElementById("menu").innerHTML =
chapters.map((c,i)=>`
  <button class="green" onclick="go(${i})">${c}</button>
`).join("");

const manga = DB.manga.find(m=>m.id==id);
  
function go(i){
  current = i;
  render();
}

function render(){
   const c = manga.chapters[chap];

  document.getElementById("title").innerText = c.title;

  document.getElementById("content").innerHTML =
    c.pages.map(p=>`<p>${p}</p>`).join("");
}

render()

window.next = ()=>{
  if(chap < manga.chapters.length-1){
    chap++;
    render();
  }
}
window.back = ()=>{
  if(chap > 0){
    chap--;
    render();
  }else{
    location.href="manga.html?id="+id;
  }
}

function menu(){
  const m = document.getElementById("menu");
  m.style.display = m.style.display==="none"?"block":"none";
}

function home(){
  window.location.href="home.html";
}

</script>

</body>
</html>
