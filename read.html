<!DOCTYPE html>
<html>

<head>
  <title>READ</title>

  <style>
    body{
      margin:0;
      background:black;
      color:white;
      font-family:Arial;
    }

    /* TOP BAR */
    .topbar{
      position:fixed;
      top:0;
      left:0;
      right:0;
      background:#00dc64;
      color:black;
      display:flex;
      justify-content:space-between;
      align-items:center;
      padding:10px;
      font-weight:bold;
      z-index:999;
    }

    .btn{
      background:black;
      color:white;
      padding:6px 10px;
      border-radius:8px;
      text-decoration:none;
      cursor:pointer;
      font-size:13px;
    }

    /* INFO BOX */
    .info{
      margin-top:60px;
      background:#111;
      padding:15px;
      border-bottom:1px solid #333;
    }

    .info h2{
      margin:0;
      color:#00dc64;
    }

    .meta{
      font-size:12px;
      color:#bbb;
      line-height:1.5;
    }

    .tags span{
      display:inline-block;
      background:#00dc64;
      color:black;
      padding:3px 8px;
      border-radius:10px;
      font-size:11px;
      margin:3px;
    }

    /* CHAPTER TITLE */
    .chapterTitle{
      text-align:center;
      padding:10px;
      color:#aaa;
    }

    /* IMAGES */
    .pages img{
      width:100%;
      display:block;
    }

  </style>

</head>

<body>

<!-- TOP -->
<div class="topbar">
  <a class="btn" href="home.html">🏠 HOME</a>
  <div id="title">Loading...</div>
  <div class="btn">MENU</div>
</div>

<!-- INFO -->
<div class="info">

  <h2 id="storyTitle">Neko Mata</h2>

  <div class="meta">
    <b>Tác giả:</b> Unknown<br>
    <b>Thể loại:</b> Romance, Drama<br>
    <b>Trạng thái:</b> Đang tiến hành<br>
    <b>Nhóm dịch:</b> DANMETOPIA
  </div>

  <div class="tags">
    <span>18+</span>
    <span>BL</span>
    <span>Drama</span>
  </div>

</div>

<!-- CHAPTER -->
<div class="chapterTitle" id="chapterTitle"></div>

<!-- PAGES -->
<div class="pages" id="pages"></div>

<script>

const id = new URLSearchParams(location.search).get("id") || 1;

/* FAKE CHAPTER DATA */
const chapters = {
  1: "Chapter 1",
  2: "Chapter 2",
  3: "Chapter 3"
};

/* TITLE */
document.getElementById("title").innerText = chapters[id];
document.getElementById("chapterTitle").innerText = chapters[id];

/* IMAGES (WEBTOON STYLE SCROLL) */
const pageCount = 5;

let html = "";
for(let i = 1; i <= pageCount; i++){
  html += `
    <img src="https://picsum.photos/800/1200?random=${id}${i}">
  `;
}

document.getElementById("pages").innerHTML = html;

</script>

</body>
</html>
