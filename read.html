<!DOCTYPE html>
<html>

<head>
  <title>READ</title>

  <style>
    body{margin:0;background:black;color:white;font-family:Arial}

    .topbar{
      position:fixed;
      top:0;left:0;right:0;
      background:#00dc64;
      color:black;
      display:flex;
      justify-content:space-between;
      padding:10px;
      font-weight:bold;
      z-index:999;
    }

    .btn{
      background:black;
      color:white;
      padding:6px 10px;
      border-radius:8px;
      cursor:pointer;
      font-size:13px;
    }

    .menu{
      position:fixed;
      right:10px;
      top:50px;
      background:#1c1c1c;
      padding:10px;
      border-radius:10px;
      display:none;
      z-index:9999;
    }

    .menu div{
      padding:5px;
      cursor:pointer;
    }

    .info{
      margin-top:60px;
      background:#111;
      padding:10px;
    }

    img{width:100%;display:block}

    .nav{
      position:fixed;
      bottom:0;
      left:0;right:0;
      background:#111;
      display:flex;
      justify-content:space-between;
      padding:10px;
    }

    .nav button{
      flex:1;
      margin:0 5px;
      background:#00dc64;
      border:none;
      padding:10px;
      border-radius:8px;
    }

  </style>

</head>

<body>

<div class="topbar">
  <div onclick="home()" class="btn">HOME</div>
  <div id="title">READ</div>
  <div onclick="toggle()" class="btn">MENU</div>
</div>

<div class="menu" id="menu"></div>

<div class="info">
  <b>Neko Mata</b><br>
  <small id="roleText"></small>
</div>

<div id="pages"></div>

<div class="nav">
  <button onclick="prev()">⬅ Prev</button>
  <button onclick="next()">Next ➡</button>
</div>

<script>

let id = Number(new URLSearchParams(location.search).get("id")||1);

const role = localStorage.getItem("role");
document.getElementById("roleText").innerText = "Role: " + role;

/* chapters */
const chapters = [
  {id:1,name:"Chapter 1"},
  {id:2,name:"Chapter 2"},
  {id:3,name:"Chapter 3"}
];

/* FIX MENU CLICK */
document.getElementById("menu").innerHTML =
  chapters.map(c=>`
    <div onclick="go(${c.id})">${c.name}</div>
  `).join("");

function go(cid){
  location.href="read.html?id="+cid;
}

function toggle(){
  const m=document.getElementById("menu");
  m.style.display = m.style.display==="block"?"none":"block";
}

/* WEBTOON */
function load(){
  let html="";
  for(let i=1;i<=6;i++){
    html+=`<img src="https://picsum.photos/800/1200?${id}${i}">`;
  }
  document.getElementById("pages").innerHTML=html;
}

load();

/* NAV FIX */
function next(){
  if(id<3) location.href="read.html?id="+(id+1);
}

function prev(){
  if(id>1) location.href="read.html?id="+(id-1);
}

function home(){
  location.href="home.html";
}

</script>

</body>
</html>
