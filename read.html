<!DOCTYPE html>
<html>

<head>
  <title>READ</title>
  <meta charset="utf-8">
</head>

<body style="margin:0;background:black;color:white;font-family:Arial">

<!-- TOP BAR -->
<div style="background:#00dc64;color:black;padding:10px;display:flex;justify-content:space-between">
  <button onclick="location.href='home.html'">HOME</button>
  <div id="title">LOADING...</div>
  <button onclick="toggleMenu()">MENU</button>
</div>

<!-- INFO -->
<div id="info" style="padding:10px;background:#111"></div>

<!-- ACTIONS -->
<div style="padding:10px">
  <button onclick="like()">❤️ Like</button>
  <button onclick="bookmark()">🔖 Bookmark</button>
</div>

<!-- UPLOAD CHAPTER IMAGES -->
<div id="uploadBox" style="display:none;padding:10px;background:#1c1c1c">
  <h3>Upload Chapter Images</h3>
  <input type="file" multiple onchange="uploadImages(event)">
</div>

<!-- CHAPTER IMAGES -->
<div id="pages"></div>

<!-- COMMENTS -->
<div style="padding:10px;background:#111">
  <h3>Comments</h3>

  <input id="cmt" placeholder="comment..." style="width:100%;padding:8px">
  <button onclick="addComment()">Send</button>

  <div id="commentList"></div>
</div>

<script type="module">

/* ================= FIREBASE ================= */
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-app.js";
import {
  getFirestore,
  doc,
  getDoc,
  updateDoc,
  increment,
  arrayUnion
} from "https://www.gstatic.com/firebasejs/12.13.0/firebase-firestore.js";

import {
  getStorage,
  ref,
  uploadBytes,
  getDownloadURL
} from "https://www.gstatic.com/firebasejs/12.13.0/firebase-storage.js";

/* CONFIG */
const firebaseConfig = {
  apiKey: "AIzaSyCDQk9DlMNKwn_508fDMI_3IB_dgpgHujA",
  authDomain: "danmetopia.firebaseapp.com",
  projectId: "danmetopia",
  storageBucket: "danmetopia.appspot.com",
  messagingSenderId: "178240377870",
  appId: "1:178240377870:web:d094b222ebabadccc5585f"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const storage = getStorage(app);

/* ================= USER ================= */
const role = localStorage.getItem("role") || "user";
const group = localStorage.getItem("group") || "groupA";

/* ================= STORY ID ================= */
const id = new URLSearchParams(location.search).get("id");
const refDoc = doc(db,"stories",id);

let storyData = null;

/* ================= LOAD STORY ================= */
async function load(){

  const snap = await getDoc(refDoc);
  storyData = snap.data();

  if(!storyData){
    document.body.innerHTML = "NOT FOUND";
    return;
  }

  document.getElementById("title").innerText = storyData.title;

  document.getElementById("info").innerHTML = `
    <h2>${storyData.title}</h2>
    <b>Genre:</b> ${storyData.genre}<br>
    <b>Owner:</b> ${storyData.owner}<br>
    <b>Likes:</b> ${storyData.likes || 0}
  `;

  renderComments(storyData.comments || []);
  renderImages(storyData.images || []);

  checkPermission();
}

load();

/* ================= PERMISSION ================= */
function checkPermission(){

  const canEdit =
    role === "admin" ||
    (role === "group" && storyData.owner === group);

  if(canEdit){
    document.getElementById("uploadBox").style.display = "block";
  }
}

/* ================= LIKE ================= */
window.like = async ()=>{
  await updateDoc(refDoc,{
    likes: increment(1)
  });
  load();
}

/* ================= BOOKMARK ================= */
window.bookmark = async ()=>{
  await updateDoc(refDoc,{
    bookmarks: arrayUnion("me")
  });
  alert("bookmarked");
}

/* ================= COMMENT ================= */
window.addComment = async ()=>{
  const text = document.getElementById("cmt").value;

  if(!text) return;

  await updateDoc(refDoc,{
    comments: arrayUnion(text)
  });

  document.getElementById("cmt").value = "";
  load();
}

/* ================= RENDER COMMENTS ================= */
function renderComments(list){

  document.getElementById("commentList").innerHTML =
    list.map(c=>`
      <div style="padding:5px;border-bottom:1px solid #333">
        ${c}
      </div>
    `).join("");

}

/* ================= CHAPTER IMAGES ================= */
function renderImages(list){

  let html="";

  if(!list || list.length===0){
    html = "<p style='padding:10px'>No images yet</p>";
  } else {
    html = list.map(img=>`
      <img src="${img}" style="width:100%;display:block">
    `).join("");
  }

  document.getElementById("pages").innerHTML = html;
}

/* ================= UPLOAD IMAGES ================= */
window.uploadImages = async (e)=>{

  const files = [...e.target.files];

  for(const f of files){

    const storageRef = ref(storage, "chapters/" + Date.now() + "_" + f.name);

    await uploadBytes(storageRef, f);

    const url = await getDownloadURL(storageRef);

    await updateDoc(refDoc,{
      images: arrayUnion(url)
    });
  }

  load();
}

</script>

</body>
</html>
