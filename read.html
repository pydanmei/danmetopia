<!DOCTYPE html>
<html>

<head>
<meta charset="utf-8">
<title>READ</title>
</head>

<body style="background:#0f0f0f;color:white;font-family:Arial">

<h2 id="title"></h2>

<div id="chapters"></div>

<h3>💬 Comment</h3>

<input id="c" placeholder="Comment">

<button onclick="comment()">Send</button>

<div id="list"></div>

<script type="module">

import {
  getFirestore,
  doc,
  getDoc,
  collection,
  addDoc,
  getDocs
} from "https://www.gstatic.com/firebasejs/12.13.0/firebase-firestore.js";

const db = window.db;

const user = JSON.parse(localStorage.getItem("user") || "{}");

const id = new URLSearchParams(location.search).get("id");

/* ================= LOAD STORY ================= */
async function load(){

  const snap = await getDoc(doc(db,"stories",id));

  const data = snap.data();

  document.getElementById("title").innerText = data.title;

  document.getElementById("chapters").innerHTML =
    (data.chapters || []).map(c=>`
      <p>📖 ${c.title}</p>
    `).join("");
}

load();

/* ================= COMMENT ================= */
window.comment = async ()=>{

  const text = document.getElementById("c").value;

  let name = "Ẩn danh";

  if(user.email){
    name = user.email + " (" + user.role + ")";
  }

  await addDoc(collection(db,"comments"),{
    storyId:id,
    text,
    name,
    time: Date.now()
  });

  alert("Đã gửi");
};

</script>

</body>
</html>
