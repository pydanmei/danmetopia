<!DOCTYPE html>
<html>

<head>
  <title>READ</title>

  <style>
    body{
      margin:0;
      background:black;
      color:white;
      font-family:Arial;
    }

    /* TOP */
    .topbar{
      position:fixed;
      top:0;left:0;right:0;
      background:#00dc64;
      color:black;
      display:flex;
      justify-content:space-between;
      align-items:center;
      padding:10px;
      font-weight:bold;
      z-index:999;
    }

    .btn{
      background:black;
      color:white;
      padding:6px 10px;
      border-radius:8px;
      cursor:pointer;
      font-size:13px;
    }

    /* PROFILE BOX (🔥 FIXED HERE) */
    .info{
      margin-top:60px;
      background:#111;
      padding:15px;
      border-bottom:1px solid #222;
    }

    .title{
      font-size:20px;
      color:#00dc64;
      font-weight:bold;
    }

    .meta{
      font-size:12px;
      color:#aaa;
      line-height:1.6;
    }

    .tags span{
      display:inline-block;
      background:#00dc64;
      color:black;
      padding:3px 8px;
      margin:3px;
      border-radius:10px;
      font-size:11px;
    }

    /* MENU */
    .menu{
      position:fixed;
      top:50px;
      right:10px;
      background:#1c1c1c;
      padding:10px;
      border-radius:10px;
      display:none;
      z-index:9999;
    }

    .menu div{
      padding:5px;
      cursor:pointer;
    }

    /* CHAPTER TITLE */
    .chapterTitle{
      text-align:center;
      padding:10px;
      color:#aaa;
    }

    /* WEBTOON IMAGES */
    img{
      width:100%;
      display:block;
    }

    /* NAV */
    .nav{
      position:fixed;
      bottom:0;
      left:0;right:0;
      background:#111;
      display:flex;
      justify-content:space-between;
      padding:10px;
    }

    .nav button{
      flex:1;
      margin:0 5px;
      background:#00dc64;
      border:none;
      padding:10px;
      border-radius:8px;
      font-weight:bold;
    }

  </style>

</head>

<body>

<!-- TOP -->
<div class="topbar">
  <div class="btn" onclick="home()">🏠 Home</div>
  <div id="title">READ</div>
  <div class="btn" onclick="toggle()">☰ Menu</div>
</div>

<!-- 🔥 PROFILE INFO (RESTORED FULL) -->
<div class="info">

  <div class="title">Neko Mata</div>

  <div class="meta">
    <b>Tên gốc:</b> Neko Mata Original<br>
    <b>Tác giả:</b> Unknown<br>
    <b>Thể loại:</b> Romance · Drama · BL<br>
    <b>Nhóm dịch:</b> DANMETOPIA<br>
    <b>Tình trạng:</b> Đang tiến hành<br>
    <b>Số chương:</b> 3
  </div>

  <div class="tags">
    <span>18+</span>
    <span>Drama</span>
    <span>Romance</span>
  </div>

</div>

<!-- MENU -->
<div class="menu" id="menu"></div>

<!-- CHAPTER TITLE -->
<div class="chapterTitle" id="chapterTitle"></div>

<!-- CONTENT -->
<div id="pages"></div>

<!-- NAV -->
<div class="nav">
  <button onclick="prev()">⬅ Prev</button>
  <button onclick="next()">Next ➡</button>
</div>

<script>

let id = Number(new URLSearchParams(location.search).get("id") || 1);

/* ROLE */
const role = localStorage.getItem("role");

/* CHAPTERS */
const chapters = [
  {id:1,name:"Chapter 1"},
  {id:2,name:"Chapter 2"},
  {id:3,name:"Chapter 3"}
];

/* TITLE */
document.getElementById("title").innerText =
  chapters.find(c=>c.id==id).name;

document.getElementById("chapterTitle").innerText =
  "Chapter " + id;

/* MENU FIX CLICK */
document.getElementById("menu").innerHTML =
  chapters.map(c=>`
    <div onclick="go(${c.id})">${c.name}</div>
  `).join("");

function go(cid){
  location.href="read.html?id="+cid;
}

/* MENU TOGGLE */
function toggle(){
  const m=document.getElementById("menu");
  m.style.display = m.style.display==="block"?"none":"block";
}

/* WEBTOON SCROLL */
let html="";
for(let i=1;i<=6;i++){
  html+=`<img src="https://picsum.photos/800/1200?${id}${i}">`;
}

document.getElementById("pages").innerHTML=html;

/* NAV */
function next(){
  if(id<3) location.href="read.html?id="+(id+1);
}

function prev(){
  if(id>1) location.href="read.html?id="+(id-1);
}

function home(){
  location.href="home.html";
}

</script>

</body>
</html>
