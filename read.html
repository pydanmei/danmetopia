<!DOCTYPE html>
<html>

<body style="margin:0;background:black;color:white;font-family:Arial">

<div style="background:#00dc64;color:black;padding:10px;display:flex;justify-content:space-between">
  <button onclick="location.href='home.html'">HOME</button>
  <div id="title"></div>
  <button onclick="toggle()">MENU</button>
</div>

<div id="info" style="padding:10px;background:#111"></div>

<!-- LIKE + BOOKMARK -->
<div style="padding:10px">
  <button onclick="like()">❤️ Like</button>
  <button onclick="bookmark()">🔖 Bookmark</button>
</div>

<!-- UPLOAD CHAPTER IMAGES (ADMIN/GROUP) -->
<div id="uploadBox" style="display:none;padding:10px;background:#1c1c1c">
  <h3>Upload Chapter Images</h3>
  <input type="file" multiple onchange="uploadImages(event)">
</div>

<div id="pages"></div>

<!-- COMMENT -->
<div style="padding:10px;background:#111">
  <h3>Comments</h3>

  <input id="cmt" placeholder="comment..." style="width:100%;padding:8px">
  <button onclick="addComment()" style="margin-top:5px">Send</button>

  <div id="comments"></div>
</div>

<script>

let id = Number(new URLSearchParams(location.search).get("id"));

let stories = JSON.parse(localStorage.getItem("stories") || "[]");

let story = stories.find(s=>s.id==id);

/* SAFE INIT */
if(!story){
  story={
    id,
    title:"Demo",
    genre:"Test",
    owner:"system",
    likes:0,
    comments:[],
    bookmarks:[],
    images:[]
  };
}

document.getElementById("title").innerText = story.title;

/* INIT ARRAYS */
story.likes ||= 0;
story.comments ||= [];
story.bookmarks ||= [];
story.images ||= [];

/* SAVE BACK */
function save(){
  localStorage.setItem("stories", JSON.stringify(stories));
}

/* INFO */
document.getElementById("info").innerHTML=`
<h2>${story.title}</h2>
<b>Owner:</b> ${story.owner}<br>
<b>Likes:</b> ${story.likes}
`;

/* LIKE */
function like(){
  story.likes++;
  save();
  location.reload();
}

/* BOOKMARK */
function bookmark(){
  let user = "me";
  story.bookmarks.push(user);
  save();
  alert("bookmarked!");
}

/* COMMENTS */
function addComment(){
  story.comments.push(cmt.value);
  save();
  renderComments();
}

function renderComments(){
  document.getElementById("comments").innerHTML =
  story.comments.map(c=>`<div style="padding:5px;border-bottom:1px solid #333">${c}</div>`).join("");
}

renderComments();

/* CHAPTER IMAGES */
function renderImages(){
  let html="";

  if(story.images.length==0){
    for(let i=1;i<=5;i++){
      html+=`<img src="https://picsum.photos/800/1200?${id}${i}">`;
    }
  }else{
    html = story.images.map(img=>`<img src="${img}">`).join("");
  }

  document.getElementById("pages").innerHTML=html;
}

renderImages();

/* UPLOAD IMAGES (GROUP/ADMIN ONLY) */
const role = localStorage.getItem("role");

if(role==="admin" || role==="group"){
  document.getElementById("uploadBox").style.display="block";
}

function uploadImages(e){
  const files = [...e.target.files];

  files.forEach(f=>{
    const reader = new FileReader();
    reader.onload = function(){
      story.images.push(reader.result);
      save();
      renderImages();
    };
    reader.readAsDataURL(f);
  });
}

</script>

</body>
</html>
