<!DOCTYPE html>
<html>

<body style="margin:0;background:black;color:white;font-family:Arial">

<div style="background:#00dc64;color:black;padding:10px;display:flex;justify-content:space-between">
  <button onclick="location.href='home.html'">HOME</button>
  <div id="title"></div>
</div>

<div id="info" style="padding:10px"></div>

<button onclick="like()">❤️ Like</button>
<button onclick="approve()" id="approveBtn" style="display:none">✔ Approve</button>

<!-- RECOMMEND -->
<div style="padding:10px">
  <h3>🔥 Recommended same genre</h3>
  <div id="recommend"></div>
</div>

<script type="module">

import {
  initializeApp
} from "https://www.gstatic.com/firebasejs/12.13.0/firebase-app.js";

import {
  getFirestore,
  doc,
  getDoc,
  updateDoc,
  increment,
  collection,
  query,
  where,
  getDocs
} from "https://www.gstatic.com/firebasejs/12.13.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyCDQk9DlMNKwn_508fDMI_3IB_dgpgHujA",
  authDomain: "danmetopia.firebaseapp.com",
  projectId: "danmetopia",
  storageBucket: "danmetopia.appspot.com",
  messagingSenderId: "178240377870",
  appId: "1:178240377870:web:d094b222ebabadccc5585f"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

/* ================= ROLE ================= */
const role = localStorage.getItem("role");

/* ================= ID ================= */
const id = new URLSearchParams(location.search).get("id");
const ref = doc(db,"stories",id);

let story=null;

/* ================= LOAD STORY ================= */
async function load(){

  const snap = await getDoc(ref);
  story = snap.data();

  document.getElementById("title").innerText = story.title;

  document.getElementById("info").innerHTML = `
    <h2>${story.title}</h2>
    <p>${story.genre}</p>
    <b>Status:</b> ${story.status}
  `;

  if(role==="admin" || role==="editor"){
    document.getElementById("approveBtn").style.display="block";
  }

  loadRecommend();
}

load();

/* ================= LIKE ================= */
window.like = async ()=>{
  await updateDoc(ref,{
    likes: increment(1)
  });
}

/* ================= APPROVE SYSTEM ================= */
window.approve = async ()=>{

  await updateDoc(ref,{
    status:"approved"
  });

  alert("APPROVED");
}

/* ================= RECOMMEND SYSTEM ================= */
async function loadRecommend(){

  if(!story) return;

  const q = query(
    collection(db,"stories"),
    where("genre","==",story.genre)
  );

  const snap = await getDocs(q);

  let html="";

  snap.forEach(d=>{
    if(d.id === id) return;

    const s = d.data();

    html += `
      <div onclick="location.href='read.html?id=${d.id}'"
        style="background:#1c1c1c;margin:5px;padding:10px">

        ${s.title}<br>
        <small>${s.genre}</small>

      </div>
    `;
  });

  document.getElementById("recommend").innerHTML = html;
}

</script>

</body>
</html>
