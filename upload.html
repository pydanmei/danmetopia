<!DOCTYPE html>
<html>

<head>
  <title>Upload</title>
</head>

<body>

<h2>UPLOAD PAGE</h2>

<script>

// 🔐 CHECK ROLE (KHÔNG PHẢI ADMIN THÌ CHẶN)
const role = localStorage.getItem("role");

if(!role){
  alert("Bạn chưa đăng nhập!");
  window.location.href = "index.html";
}

if(role !== "admin"){
  alert("Bạn không có quyền vào trang upload!");
  window.location.href = "home.html";
}

</script>

</body>
</html>
