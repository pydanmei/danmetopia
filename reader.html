<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>🌸 DANMETOPIA - Đọc truyện 🌸</title>
  <link rel="stylesheet" href="style.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif; background: #0a0a0a; color: #e0e0e0; }
    .reader-container { max-width: 900px; margin: 0 auto; padding: 80px 20px 100px 20px; }
    
    /* Reader Settings Panel */
    .reader-settings {
      position: fixed;
      bottom: 70px;
      right: 20px;
      z-index: 999;
      display: flex;
      flex-direction: column;
      gap: 5px;
    }
    .reader-settings button {
      width: 40px;
      height: 40px;
      border: none;
      border-radius: 50%;
      background: rgba(0,0,0,0.7);
      backdrop-filter: blur(10px);
      color: white;
      font-size: 16px;
      cursor: pointer;
      transition: all 0.2s;
      box-shadow: 0 2px 8px rgba(0,0,0,0.3);
    }
    .reader-settings button:hover {
      background: #FF69B4;
      color: black;
      transform: scale(1.05);
    }
    
    .settings-panel {
      position: fixed;
      bottom: 130px;
      right: 20px;
      background: rgba(0,0,0,0.9);
      backdrop-filter: blur(10px);
      border-radius: 16px;
      padding: 16px;
      min-width: 200px;
      z-index: 1000;
      border: 1px solid #FF69B4;
      display: none;
    }
    .settings-panel.active { display: block; }
    .settings-panel label {
      display: block;
      color: #FF69B4;
      font-size: 12px;
      margin-bottom: 4px;
    }
    .settings-panel select, .settings-panel input {
      width: 100%;
      padding: 6px 10px;
      margin-bottom: 10px;
      background: #2a2a2a;
      border: none;
      border-radius: 8px;
      color: white;
      font-size: 13px;
    }
    .settings-panel .color-options {
      display: flex;
      gap: 8px;
      margin-bottom: 10px;
    }
    .settings-panel .color-options button {
      width: 30px;
      height: 30px;
      border-radius: 50%;
      border: 2px solid transparent;
      cursor: pointer;
    }
    .settings-panel .color-options button.active { border-color: #FF69B4; }
    
    .reader-top-nav {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 1000;
      background: rgba(0,0,0,0.85);
      backdrop-filter: blur(10px);
      padding: 8px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      border-bottom: 1px solid rgba(255,105,180,0.3);
    }
    .reader-top-nav .nav-buttons { display: flex; gap: 8px; align-items: center; }
    .reader-top-nav button {
      padding: 8px 16px;
      background: linear-gradient(135deg, #FF69B4, #FF4FA3);
      border: none;
      border-radius: 40px;
      color: white;
      font-weight: bold;
      font-size: 13px;
      cursor: pointer;
      white-space: nowrap;
    }
    .reader-top-nav button:disabled { opacity: 0.5; cursor: not-allowed; }
    .reader-top-nav .chapter-title {
      font-size: 14px;
      font-weight: bold;
      color: #FF69B4;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 300px;
      margin: 0 10px;
    }
    
    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: rgba(0,0,0,0.9);
      backdrop-filter: blur(10px);
      display: flex;
      justify-content: space-around;
      align-items: center;
      padding: 10px 16px;
      border-top: 1px solid rgba(255,105,180,0.3);
      z-index: 1000;
    }
    .bottom-nav button {
      flex: 1;
      padding: 8px 0;
      background: transparent;
      border: none;
      color: white;
      font-size: 13px;
      font-weight: bold;
      cursor: pointer;
      border-radius: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }
    .bottom-nav button:active { transform: scale(0.95); }
    .bottom-nav button:disabled { opacity: 0.4; cursor: not-allowed; }
    
    /* Progress bar */
    .reading-progress {
      position: fixed;
      top: 56px;
      left: 0;
      right: 0;
      height: 3px;
      background: rgba(255,255,255,0.1);
      z-index: 999;
    }
    .reading-progress .progress-bar {
      height: 100%;
      background: linear-gradient(90deg, #FF69B4, #FF1493);
      width: 0%;
      transition: width 0.1s;
    }
    
    .reader-image { width: 100%; margin: 8px 0; display: block; }
    .chapter-list-section { background: #1c1c1c; border-radius: 16px; padding: 20px; margin-top: 40px; }
    .chapter-list-section h4 { color: #FF69B4; margin-bottom: 15px; }
    .chapter-list { max-height: 400px; overflow-y: auto; }
    .chapter-item {
      background: #2a2a2a;
      padding: 10px 15px;
      margin-bottom: 8px;
      border-radius: 8px;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
    }
    .chapter-item:hover { background: #FF69B4; color: black; }
    .comment-section { margin-top: 40px; background: #1c1c1c; border-radius: 16px; padding: 20px; }
    .comment-section h4 { color: #FF69B4; margin-bottom: 15px; }
    .comment-input-area { display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; }
    .comment-input-area textarea { flex: 1; padding: 10px; background: #2a2a2a; border: none; border-radius: 12px; color: white; resize: vertical; }
    .comment-input-area button { padding: 10px 20px; background: #FF69B4; border: none; border-radius: 30px; font-weight: bold; cursor: pointer; color: black; }
    .comment-item { background: #2a2a2a; padding: 12px; border-radius: 12px; margin-bottom: 10px; }
    .comment-name { font-weight: bold; color: #FF69B4; margin-bottom: 5px; display: flex; justify-content: space-between; flex-wrap: wrap; }
    .comment-time { font-size: 11px; color: #888; }
    .loading-container { text-align: center; padding: 50px; }
    .loading-spinner {
      display: inline-block;
      width: 40px;
      height: 40px;
      border: 3px solid #333;
      border-top-color: #FF69B4;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    
    /* Reader theme styles */
    body.reader-dark .reader-image { filter: none; }
    body.reader-light { background: #f5f0e8; color: #333; }
    body.reader-light .reader-top-nav { background: rgba(245,240,232,0.95); border-bottom-color: #ddd; }
    body.reader-light .reader-top-nav .chapter-title { color: #FF69B4; }
    body.reader-light .bottom-nav { background: rgba(245,240,232,0.95); border-top-color: #ddd; }
    body.reader-light .bottom-nav button { color: #333; }
    body.reader-light .reader-top-nav button { color: white; }
    body.reader-light .chapter-item { background: #e8e0d8; color: #333; }
    body.reader-light .chapter-item:hover { background: #FF69B4; color: black; }
    body.reader-light .comment-section { background: #e8e0d8; }
    body.reader-light .comment-item { background: #ddd; color: #333; }
    body.reader-light .comment-input-area textarea { background: #ddd; color: #333; }
    body.reader-light .chapter-list-section { background: #e8e0d8; }
    body.reader-light .chapter-list-section h4 { color: #FF69B4; }
    body.reader-light .chapter-item { background: #ddd; color: #333; }
    body.reader-light .chapter-item:hover { background: #FF69B4; color: black; }
    
    body.reader-sepia { background: #f4e8c1; color: #5b4636; }
    body.reader-sepia .reader-top-nav { background: rgba(244,232,193,0.95); border-bottom-color: #c4a882; }
    body.reader-sepia .reader-top-nav .chapter-title { color: #8B4513; }
    body.reader-sepia .bottom-nav { background: rgba(244,232,193,0.95); border-top-color: #c4a882; }
    body.reader-sepia .bottom-nav button { color: #5b4636; }
    body.reader-sepia .reader-top-nav button { color: white; }
    body.reader-sepia .chapter-item { background: #e8dcc0; color: #5b4636; }
    body.reader-sepia .chapter-item:hover { background: #FF69B4; color: black; }
    body.reader-sepia .comment-section { background: #e8dcc0; }
    body.reader-sepia .comment-item { background: #ddd0b8; color: #5b4636; }
    body.reader-sepia .comment-input-area textarea { background: #ddd0b8; color: #5b4636; }
    body.reader-sepia .chapter-list-section { background: #e8dcc0; }
    body.reader-sepia .chapter-list-section h4 { color: #8B4513; }
    body.reader-sepia .chapter-item { background: #ddd0b8; color: #5b4636; }
    body.reader-sepia .chapter-item:hover { background: #FF69B4; color: black; }
    
    @media (max-width: 768px) {
      .reader-container { padding: 70px 16px 80px 16px; }
      .reader-top-nav .nav-buttons button { font-size: 11px; padding: 6px 10px; }
      .reader-top-nav .chapter-title { font-size: 11px; max-width: 150px; margin: 0 5px; }
      .bottom-nav button { font-size: 11px; }
      .bottom-nav button span { display: none; }
      .bottom-nav button:after { content: attr(data-icon); font-size: 20px; }
      .settings-panel { right: 10px; min-width: 160px; }
    }
  </style>
</head>
<body>
<div class="reader-container" id="readerContainer">
  <div id="readerContent">
    <div class="loading-container"><div class="loading-spinner"></div><p>Đang tải truyện...</p></div>
  </div>
</div>

<!-- Reader Settings -->
<div class="reader-settings">
  <button id="settingsToggle" title="Tùy chỉnh đọc">⚙️</button>
</div>
<div class="settings-panel" id="settingsPanel">
  <label>Màu nền</label>
  <div class="color-options">
    <button data-theme="dark" style="background:#0a0a0a;" class="active"></button>
    <button data-theme="light" style="background:#f5f0e8;"></button>
    <button data-theme="sepia" style="background:#f4e8c1;"></button>
  </div>
  <label>Font chữ</label>
  <select id="fontSelect">
    <option value="system">Hệ thống</option>
    <option value="serif">Serif</option>
    <option value="sans-serif">Sans-serif</option>
    <option value="monospace">Monospace</option>
  </select>
  <label>Cỡ chữ</label>
  <input type="range" id="fontSizeRange" min="14" max="28" value="18">
  <span id="fontSizeDisplay">18px</span>
  <button onclick="resetReaderSettings()" style="width:100%;padding:6px;background:#FF69B4;border:none;border-radius:8px;color:black;cursor:pointer;font-weight:bold;">Đặt lại mặc định</button>
</div>

<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
  import { getAuth } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
  import { getDatabase, ref, get, set, push, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

  const firebaseConfig = {
    apiKey: "AIzaSyCDQk9DlMNKwn_508fDMI_3IB_dgpgHujA",
    authDomain: "danmetopia.firebaseapp.com",
    projectId: "danmetopia",
    databaseURL: "https://danmetopia-default-rtdb.asia-southeast1.firebasedatabase.app/",
    storageBucket: "danmetopia.appspot.com",
    messagingSenderId: "178240377870",
    appId: "1:178240377870:web:d094b222ebabadccc5585f"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getDatabase(app);
  emailjs.init("fPq8fpw1OqzOtj-lk");

  const urlParams = new URLSearchParams(window.location.search);
  const storyId = urlParams.get('id');
  let currentChapterIndex = parseInt(urlParams.get('chapter') || '0');
  let currentUser = null;
  let currentStory = null;
  let currentChapters = [];
  let commentUnsubscribe = null;

  // ==================== LƯU TIẾN ĐỘ ĐỌC ====================
  function saveReadingProgress() {
    if (!storyId) return;
    const progressKey = `reading_progress_${storyId}`;
    localStorage.setItem(progressKey, currentChapterIndex);
    console.log(`💾 Saved progress: chapter ${currentChapterIndex}`);
  }

  function loadReadingProgress() {
    if (!storyId) return null;
    const progressKey = `reading_progress_${storyId}`;
    const saved = localStorage.getItem(progressKey);
    if (saved !== null) {
      console.log(`📖 Loaded progress: chapter ${saved}`);
      return parseInt(saved);
    }
    return null;
  }

  // ==================== READER SETTINGS ====================
  function loadReaderSettings() {
    const settings = JSON.parse(localStorage.getItem('reader_settings') || '{}');
    return settings;
  }

  function saveReaderSettings(settings) {
    localStorage.setItem('reader_settings', JSON.stringify(settings));
  }

  function applyReaderSettings(settings) {
    const body = document.body;
    body.className = '';
    if (settings.theme && settings.theme !== 'dark') {
      body.classList.add(`reader-${settings.theme}`);
    }
    if (settings.font) {
      document.querySelector('.reader-container').style.fontFamily = settings.font;
    }
    if (settings.fontSize) {
      document.querySelector('.reader-container').style.fontSize = settings.fontSize + 'px';
    }
  }

  // ==================== PRELOAD CHAPTER KẾ TIẾP ====================
  function preloadNextChapter() {
    const nextIndex = currentChapterIndex + 1;
    if (nextIndex < currentChapters.length) {
      const nextChapter = currentChapters[nextIndex];
      if (nextChapter?.pages) {
        console.log(`🔄 Preloading chapter ${nextIndex + 1}...`);
        nextChapter.pages.forEach(pageUrl => {
          const img = new Image();
          img.src = pageUrl;
        });
      }
    }
  }

  function showNotification(msg, isError = false) {
    const notif = document.createElement("div");
    notif.className = "notification";
    notif.style.background = isError ? "#ff4444" : "#FF69B4";
    notif.style.color = "black";
    notif.innerText = msg;
    document.body.appendChild(notif);
    setTimeout(() => notif.remove(), 3000);
  }

  function escapeHtml(str) {
    if (!str) return "";
    return str.replace(/[&<>]/g, m => m === "&" ? "&amp;" : m === "<" ? "&lt;" : "&gt;");
  }

  function getTimeAgo(timestamp) {
    const now = Date.now();
    const diff = now - timestamp;
    const seconds = Math.floor(diff / 1000);
    const minutes = Math.floor(seconds / 60);
    const hours = Math.floor(minutes / 60);
    const days = Math.floor(hours / 24);
    
    if (seconds < 60) return 'vài giây trước';
    if (minutes < 60) return `${minutes} phút trước`;
    if (hours < 24) return `${hours} giờ trước`;
    if (days < 7) return `${days} ngày trước`;
    if (days < 30) return `${Math.floor(days / 7)} tuần trước`;
    if (days < 365) return `${Math.floor(days / 30)} tháng trước`;
    return `${Math.floor(days / 365)} năm trước`;
  }

  function ensureGuestUser() {
    if (!currentUser) {
      const guestId = "guest_" + Date.now() + "_" + Math.random().toString(36).substr(2, 6);
      currentUser = {
        uid: guestId,
        displayName: "Hủ qua đường " + Math.floor(Math.random() * 9999),
        nickname: "Hủ qua đường " + Math.floor(Math.random() * 9999),
        guest: true,
        role: "guest"
      };
      sessionStorage.setItem("tempGuest", JSON.stringify(currentUser));
    }
    return currentUser;
  }

  async function restoreSession() {
    const sessionStr = localStorage.getItem("userSession");
    if (sessionStr) {
      try {
        const session = JSON.parse(sessionStr);
        if (session.expireAt && Date.now() < session.expireAt) {
          if (session.role === "guest") { currentUser = session; return true; }
          else if (session.uid) {
            const userSnap = await get(ref(db, `users/${session.uid}`));
            if (userSnap.exists()) { currentUser = { ...session, ...userSnap.val() }; return true; }
          }
        }
      } catch(e) {}
    }
    ensureGuestUser();
    return true;
  }

  async function loadStoryInfo() {
    const storySnap = await get(ref(db, `stories/${storyId}`));
    if (storySnap.exists()) {
      currentStory = { id: storyId, ...storySnap.val() };
      document.title = `🌸 ${currentStory.title} - Đọc truyện 🌸`;
    }
  }

  async function loadChapters() {
    const chaptersRef = ref(db, `chapters/${storyId}`);
    onValue(chaptersRef, (snapshot) => {
      const data = snapshot.val();
      if (data) {
        currentChapters = Object.entries(data).map(([id, value]) => ({ id, ...value }));
        currentChapters.sort((a, b) => (a.chapterNumber || 0) - (b.chapterNumber || 0));
        
        const savedProgress = loadReadingProgress();
        if (savedProgress !== null && savedProgress < currentChapters.length) {
          currentChapterIndex = savedProgress;
          const newUrl = `${window.location.pathname}?id=${storyId}&chapter=${currentChapterIndex}`;
          window.history.pushState({}, '', newUrl);
        }
        renderReader();
      } else {
        renderReader();
      }
    });
  }

  async function updateViewCount() {
    if (currentStory) {
      const viewRef = ref(db, `stories/${storyId}/views`);
      const snapshot = await get(viewRef);
      await set(viewRef, (snapshot.val() || 0) + 1);
    }
  }

  function goToStoryInfo() {
    saveReadingProgress();
    window.location.href = `story.html?id=${storyId}`;
  }

  function goToHome() {
    saveReadingProgress();
    window.location.href = "index.html";
  }

  function updateProgressBar() {
    const scrollTop = window.scrollY;
    const docHeight = document.documentElement.scrollHeight - window.innerHeight;
    const progress = docHeight > 0 ? (scrollTop / docHeight) * 100 : 0;
    const progressBar = document.querySelector('.reading-progress .progress-bar');
    if (progressBar) {
      progressBar.style.width = Math.min(progress, 100) + '%';
    }
  }

  function renderReader() {
    if (!currentChapters || currentChapters.length === 0) {
      document.getElementById("readerContent").innerHTML = '<div class="loading-container"><p>Không có chapter nào</p></div>';
      return;
    }
    if (!currentChapters[currentChapterIndex]) {
      document.getElementById("readerContent").innerHTML = '<div class="loading-container"><p>Không tìm thấy chapter</p></div>';
      return;
    }
    const chap = currentChapters[currentChapterIndex];
    const hasPrev = currentChapterIndex > 0;
    const hasNext = currentChapterIndex < currentChapters.length - 1;
    const chapTitle = chap.title || `Chương ${chap.chapterNumber}`;

    const html = `
      <div class="reading-progress">
        <div class="progress-bar"></div>
      </div>
      <div class="reader-top-nav">
        <div class="nav-buttons">
          <button ${hasPrev ? `onclick="window.changeChapter(-1)"` : 'disabled'}>⬅ Chương trước</button>
          <div class="chapter-title">${escapeHtml(chapTitle)}</div>
          <button ${hasNext ? `onclick="window.changeChapter(1)"` : 'disabled'}>Chương sau ➡</button>
        </div>
      </div>
      <div id="chapterImages">
        ${chap.pages?.map(page => `<img class="reader-image" src="${escapeHtml(page)}" loading="lazy" onerror="this.src='https://placehold.co/800x1200?text=Error'">`).join("") || "<p>Không có ảnh</p>"}
      </div>
      
      <div class="bottom-nav">
        <button ${hasPrev ? `onclick="window.changeChapter(-1)" data-icon="◀"` : 'disabled'} data-icon="◀"><span>Chương trước</span></button>
        <button onclick="window.scrollToTop()" data-icon="▲"><span>Lên đầu</span></button>
        <button onclick="goToStoryInfo()" data-icon="📖"><span>Thông tin</span></button>
        <button onclick="goToHome()" data-icon="🏠"><span>Trang chủ</span></button>
        <button ${hasNext ? `onclick="window.changeChapter(1)" data-icon="▶"` : 'disabled'} data-icon="▶"><span>Chương sau</span></button>
      </div>
      
      <div class="chapter-list-section">
        <h4>📑 MỤC LỤC CHAPTER</h4>
        <div class="chapter-list">
          ${currentChapters.map((c, i) => `<div class="chapter-item" onclick="window.changeChapterTo(${i})"><span>${i + 1}. ${escapeHtml(c.title)}</span><span style="font-size:12px;">📅 ${new Date(c.createdAt).toLocaleDateString()}</span></div>`).join("")}
        </div>
      </div>
      <div class="comment-section">
        <h4>💬 BÌNH LUẬN</h4>
        <div class="comment-input-area">
          <textarea id="commentText" rows="3" placeholder="Viết bình luận..."></textarea>
          <button id="postCommentBtn">GỬI</button>
        </div>
        <div id="commentList"></div>
      </div>
    `;
    document.getElementById("readerContent").innerHTML = html;
    loadCommentsRealtime(storyId);
    const postBtn = document.getElementById("postCommentBtn");
    if (postBtn) {
      const newPostBtn = postBtn.cloneNode(true);
      postBtn.parentNode.replaceChild(newPostBtn, postBtn);
      newPostBtn.addEventListener("click", () => postComment(storyId));
    }
    
    window.scrollTo({ top: 0, behavior: 'smooth' });
    setTimeout(updateProgressBar, 100);
    window.addEventListener('scroll', updateProgressBar);
    preloadNextChapter();
    
    // Apply reader settings
    const settings = loadReaderSettings();
    applyReaderSettings(settings);
    document.getElementById('fontSelect').value = settings.font || 'system';
    document.getElementById('fontSizeRange').value = settings.fontSize || 18;
    document.getElementById('fontSizeDisplay').textContent = (settings.fontSize || 18) + 'px';
  }

  window.changeChapter = async (delta) => {
    const newIdx = currentChapterIndex + delta;
    if (newIdx >= 0 && newIdx < currentChapters.length) {
      currentChapterIndex = newIdx;
      saveReadingProgress();
      const newUrl = `${window.location.pathname}?id=${storyId}&chapter=${currentChapterIndex}`;
      window.history.pushState({}, '', newUrl);
      renderReader();
    }
  };
  
  window.changeChapterTo = async (index) => {
    currentChapterIndex = index;
    saveReadingProgress();
    const newUrl = `${window.location.pathname}?id=${storyId}&chapter=${currentChapterIndex}`;
    window.history.pushState({}, '', newUrl);
    renderReader();
  };
  
  window.scrollToTop = () => { window.scrollTo({ top: 0, behavior: 'smooth' }); };
  window.goToHome = goToHome;
  window.goToStoryInfo = goToStoryInfo;

  async function loadCommentsRealtime(storyId) {
    if (commentUnsubscribe) commentUnsubscribe();
    const commentsRef = ref(db, `comments/${storyId}`);
    commentUnsubscribe = onValue(commentsRef, (snapshot) => {
      const data = snapshot.val();
      const comments = data ? Object.entries(data).map(([id, value]) => ({ id, ...value })) : [];
      comments.sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
      const commentList = document.getElementById("commentList");
      if (commentList) {
        commentList.innerHTML = comments.map(c => `
          <div class="comment-item">
            <div class="comment-name">
              <span>💬 ${escapeHtml(c.userName)}</span>
              <span class="comment-time">${getTimeAgo(c.createdAt)}</span>
            </div>
            <div class="comment-text">${escapeHtml(c.text)}</div>
          </div>
        `).join("");
        if (comments.length === 0) commentList.innerHTML = '<div style="text-align:center;padding:20px;">Chưa có bình luận</div>';
      }
    });
  }

  async function postComment(storyId) {
    let user = currentUser;
    if (!user || (user.role === "guest" && !user.uid)) {
      user = ensureGuestUser();
      sessionStorage.setItem("tempGuestUser", JSON.stringify(user));
    }
    const text = document.getElementById("commentText")?.value.trim();
    if (!text) return;
    const commentsRef = ref(db, `comments/${storyId}`);
    const newCommentRef = push(commentsRef);
    await set(newCommentRef, {
      text: text,
      userId: user.uid,
      userName: user.displayName,
      createdAt: Date.now()
    });
    document.getElementById("commentText").value = "";
    showNotification("✅ Đã gửi bình luận");
  }
