<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>🌸 DANMETOPIA - Chỉnh sửa chapter 🌸</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .edit-container { max-width: 800px; margin: 0 auto; padding: 20px; }
    .back-link { display: inline-block; margin-bottom: 20px; padding: 8px 16px; background: #333; color: white; text-decoration: none; border-radius: 30px; font-size: 14px; }
    .back-link:hover { background: #FF69B4; color: black; }
    .edit-panel { background: #1c1c1c; border-radius: 16px; padding: 25px; border: 1px solid #FF69B4; }
    .edit-panel h2 { color: #FF69B4; margin-bottom: 20px; }
    .edit-panel input, .edit-panel textarea, .edit-panel select { width: 100%; padding: 12px; margin-bottom: 15px; background: #2a2a2a; border: none; border-radius: 12px; color: white; font-size: 14px; }
    .edit-panel textarea { height: 150px; resize: vertical; }
    .images-preview { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 10px; margin-bottom: 15px; }
    .img-preview-item { width: 80px; height: 120px; object-fit: cover; border-radius: 8px; border: 1px solid #FF69B4; position: relative; cursor: grab; }
    .loading-container { text-align: center; padding: 50px; }
    .note { font-size: 12px; color: #888; margin-bottom: 15px; }
  </style>
</head>
<body>
<div class="edit-container">
  <a href="javascript:history.back()" class="back-link">← Quay lại</a>
  <div id="editContent">
    <div class="loading-container"><div class="loading-spinner"></div><p>Đang tải thông tin chapter...</p></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sortablejs@latest/Sortable.min.js"></script>
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
  import { getAuth } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
  import { getDatabase, ref, get, update } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

  const firebaseConfig = {
    apiKey: "AIzaSyCDQk9DlMNKwn_508fDMI_3IB_dgpgHujA",
    authDomain: "danmetopia.firebaseapp.com",
    projectId: "danmetopia",
    databaseURL: "https://danmetopia-default-rtdb.asia-southeast1.firebasedatabase.app/",
    storageBucket: "danmetopia.appspot.com",
    messagingSenderId: "178240377870",
    appId: "1:178240377870:web:d094b222ebabadccc5585f"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getDatabase(app);
  const IMGBB_API_KEY = "d16b5595d7f6044476d254c8f428cc28";
  emailjs.init("fPq8fpw1OqzOtj-lk");

  const urlParams = new URLSearchParams(window.location.search);
  const storyId = urlParams.get('id');
  const chapterId = urlParams.get('chapterId');
  let currentUser = null;
  let story = null;
  let chapter = null;
  let existingPages = [];
  let newImageFiles = [];
  let sortableInstance = null;

  function showNotification(msg, isError = false) {
    const notif = document.createElement("div");
    notif.className = "notification";
    notif.style.background = isError ? "#ff4444" : "#FF69B4";
    notif.style.color = "black";
    notif.innerText = msg;
    document.body.appendChild(notif);
    setTimeout(() => notif.remove(), 3000);
  }

  function showLoading(show) {
    let spinner = document.getElementById("globalSpinner");
    if (show) {
      if (!spinner) {
        spinner = document.createElement("div");
        spinner.id = "globalSpinner";
        spinner.className = "spinner-overlay";
        spinner.innerHTML = '<div class="loading-spinner"></div>';
        document.body.appendChild(spinner);
      }
      spinner.style.display = "flex";
    } else {
      if (spinner) spinner.style.display = "none";
    }
  }

  function escapeHtml(str) {
    if (!str) return "";
    return str.replace(/[&<>]/g, m => m === "&" ? "&amp;" : m === "<" ? "&lt;" : "&gt;");
  }

  function isAdmin(userData) { return userData?.role === "admin"; }

  async function uploadImage(file) {
    if (!file) return null;
    if (file.size > 10 * 1024 * 1024) { showNotification(`Ảnh ${file.name} quá lớn (tối đa 10MB)`, true); return null; }
    const formData = new FormData();
    formData.append("image", file);
    formData.append("key", IMGBB_API_KEY);
    try {
      const response = await fetch("https://api.imgbb.com/1/upload", { method: "POST", body: formData });
      const result = await response.json();
      return result.success ? result.data.url : null;
    } catch (err) { showNotification("Lỗi upload: " + err.message, true); return null; }
  }

  async function uploadMultipleImages(files) {
    if (!files || files.length === 0) return [];
    const urls = [];
    for (const file of files) {
      const url = await uploadImage(file);
      if (url) urls.push(url);
    }
    return urls;
  }

  async function restoreSession() {
    const sessionStr = localStorage.getItem("userSession");
    if (!sessionStr) return false;
    try {
      const session = JSON.parse(sessionStr);
      if (!session.expireAt || Date.now() > session.expireAt) {
        localStorage.removeItem("userSession");
        return false;
      }
      if (session.role === "guest") {
        currentUser = session;
        return true;
      } else if (session.uid) {
        const userSnap = await get(ref(db, `users/${session.uid}`));
        if (userSnap.exists()) {
          currentUser = { ...session, ...userSnap.val() };
          return true;
        }
      }
      return false;
    } catch { return false; }
  }

  async function loadStoryAndChapter() {
    const storySnap = await get(ref(db, `stories/${storyId}`));
    if (storySnap.exists()) {
      story = { id: storyId, ...storySnap.val() };
    } else {
      document.getElementById("editContent").innerHTML = '<div class="loading-container"><p>Không tìm thấy truyện</p></div>';
      return;
    }

    const chapterSnap = await get(ref(db, `chapters/${storyId}/${chapterId}`));
    if (chapterSnap.exists()) {
      chapter = { id: chapterId, ...chapterSnap.val() };
      existingPages = chapter.pages || [];
      renderEditForm();
    } else {
      document.getElementById("editContent").innerHTML = '<div class="loading-container"><p>Không tìm thấy chapter</p></div>';
    }
  }

  function renderEditForm() {
    const canEdit = currentUser && (isAdmin(currentUser) || story.ownerUid === currentUser?.uid || (currentUser.privileges?.groupId && story.groupId === currentUser.privileges?.groupId));
    if (!canEdit) {
      document.getElementById("editContent").innerHTML = '<div class="loading-container"><p>⚠️ Bạn không có quyền chỉnh sửa chapter này!</p><a href="story.html?id=${storyId}" class="back-link">← Quay lại</a></div>';
      return;
    }

    const html = `
      <div class="edit-panel">
        <h2>✏️ CHỈNH SỬA CHAPTER: ${escapeHtml(chapter.title)}</h2>
        <input id="editChapterTitle" value="${escapeHtml(chapter.title)}" placeholder="Tên chapter *">
        <input id="editChapterNumber" value="${chapter.chapterNumber || 0}" type="number" placeholder="Số chapter">
        
        <label style="color:#FF69B4; margin-top:10px; display:block;">📷 Ảnh hiện tại (kéo thả để sắp xếp)</label>
        <div id="existingImagesPreview" class="images-preview" style="min-height:120px;"></div>
        
        <label style="color:#FF69B4; margin-top:15px; display:block;">➕ Thêm ảnh mới</label>
        <input type="file" id="editNewChapterImages" accept="image/*" multiple>
        <div id="editNewChapterPreview" class="images-preview"></div>
        
        <label style="color:#FF69B4; margin-top:15px; display:block;">🔗 Hoặc nhập link ảnh (mỗi dòng 1 link)</label>
        <textarea id="editChapterPages" rows="8">${existingPages.join('\n')}</textarea>
        
        <button class="btn-pink" id="saveChapterEditBtn">💾 LƯU THAY ĐỔI</button>
      </div>
    `;
    document.getElementById("editContent").innerHTML = html;

    const existingPreviewDiv = document.getElementById("existingImagesPreview");
    existingPreviewDiv.innerHTML = "";
    for (let i = 0; i < existingPages.length; i++) {
      const imgDiv = document.createElement("div");
      imgDiv.className = "img-preview-item";
      imgDiv.innerHTML = `
        <img src="${escapeHtml(existingPages[i])}" style="width:100%; height:100%; object-fit:cover; border-radius:8px;">
        <button class="remove-existing-img" data-index="${i}" style="position:absolute; top:-8px; right:-8px; width:20px; height:20px; border-radius:50%; background:#ff4444; color:white; border:none; cursor:pointer; font-size:12px;">✕</button>
      `;
      existingPreviewDiv.appendChild(imgDiv);
    }

    document.querySelectorAll('.remove-existing-img').forEach(btn => {
      btn.addEventListener('click', (e) => {
        e.stopPropagation();
        const idx = parseInt(btn.dataset.index);
        existingPages.splice(idx, 1);
        btn.parentElement.remove();
        document.querySelectorAll('.remove-existing-img').forEach((b, newIdx) => { b.dataset.index = newIdx; });
        showNotification("Đã xóa ảnh khỏi danh sách");
      });
    });

    if (existingPreviewDiv.children.length > 0) {
      sortableInstance = new Sortable(existingPreviewDiv, {
        animation: 150,
        handle: '.img-preview-item',
        onEnd: () => {
          const newOrder = [];
          for (let i = 0; i < existingPreviewDiv.children.length; i++) {
            const img = existingPreviewDiv.children[i].querySelector('img');
            if (img) newOrder.push(img.src);
          }
          existingPages = newOrder;
        }
      });
    }

    document.getElementById("editNewChapterImages")?.addEventListener("change", (e) => {
      newImageFiles = Array.from(e.target.files);
      const previewDiv = document.getElementById("editNewChapterPreview");
      previewDiv.innerHTML = "";
      for (const file of newImageFiles) {
        const reader = new FileReader();
        reader.onload = (ev) => {
          const imgDiv = document.createElement("div");
          imgDiv.className = "img-preview-item";
          imgDiv.innerHTML = `<img src="${ev.target.result}" style="width:100%; height:100%; object-fit:cover; border-radius:8px;"><button onclick="this.parentElement.remove()" style="position:absolute; top:-8px; right:-8px; width:20px; height:20px; border-radius:50%; background:#ff4444; color:white; border:none; cursor:pointer; font-size:12px;">✕</button>`;
          previewDiv.appendChild(imgDiv);
        };
        reader.readAsDataURL(file);
      }
    });

    document.getElementById("saveChapterEditBtn")?.addEventListener("click", saveEditChapter);
  }

  async function saveEditChapter() {
    const newTitle = document.getElementById("editChapterTitle").value.trim();
    const newNumber = parseInt(document.getElementById("editChapterNumber").value) || 0;
    let newPages = [...existingPages];

    const pagesText = document.getElementById("editChapterPages").value;
    if (pagesText.trim()) {
      const linkPages = pagesText.split('\n').filter(p => p.trim());
      newPages = [...newPages, ...linkPages];
    }

    if (!newTitle) { showNotification("Nhập tên chapter", true); return; }

    if (newImageFiles.length > 0) {
      showLoading(true);
      showNotification(`📤 Đang upload ${newImageFiles.length} ảnh mới...`, false);
      const newImageUrls = await uploadMultipleImages(newImageFiles);
      if (newImageUrls.length > 0) {
        newPages = [...newPages, ...newImageUrls];
      }
      showLoading(false);
    }

    if (newPages.length === 0) { showNotification("Chapter phải có ít nhất 1 ảnh", true); return; }

    showLoading(true);
    try {
      await update(ref(db, `chapters/${storyId}/${chapterId}`), {
        title: newTitle,
        chapterNumber: newNumber,
        pages: newPages
      });
      showNotification("✅ Đã cập nhật chapter!");
      setTimeout(() => { window.location.href = `story.html?id=${storyId}`; }, 1000);
    } catch (err) {
      showNotification("Lỗi: " + err.message, true);
    } finally {
      showLoading(false);
    }
  }

  const restored = await restoreSession();
  if (!restored) {
    window.location.href = 'index.html';
  } else {
    await loadStoryAndChapter();
  }
</script>
</body>
</html>
