<!DOCTYPE html>
<html>

<body style="background:black;color:white;font-family:Arial;text-align:center">

<h2>STORY</h2>

<div id="chapters">Loading...</div>

<script>

const role = localStorage.getItem("role");
if(!role){
  window.location.href = "index.html";
}

const chapters = [
  {id:1,name:"Chapter 1"},
  {id:2,name:"Chapter 2"}
];

document.getElementById("chapters").innerHTML =
  chapters.map(c=>`
    <div onclick="openChapter(${c.id})"
      style="padding:10px;margin:10px;background:#222;cursor:pointer">
      ${c.name}
    </div>
  `).join("");

function openChapter(id){
  window.location.href = "read.html?id="+id;
}

</script>

</body>
</html>
