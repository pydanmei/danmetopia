<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>🌸 DANMETOPIA - Thông tin truyện 🌸</title>
  <link rel="stylesheet" href="style.css">

  <style>
    .story-container { max-width: 1000px; margin: 0 auto; padding: 20px; }
    .back-home { display: inline-block; margin-bottom: 20px; padding: 8px 16px; background: #333; color: white; text-decoration: none; border-radius: 30px; font-size: 14px; }
    .back-home:hover { background: #FF69B4; color: black; }

    .story-detail-grid { display: grid; grid-template-columns: 250px 1fr; gap: 30px; margin-bottom: 30px; }

    .story-detail-cover { width: 100%; border-radius: 12px; }

    .story-detail-info h2 { color: #FF69B4; margin-bottom: 15px; }

    .story-detail-label { font-weight: bold; color: #FF69B4; min-width: 100px; display: inline-block; }

    .clickable-tag { display: inline-block; background: #2a2a2a; padding: 4px 10px; border-radius: 20px; font-size: 12px; margin: 2px 4px; cursor: pointer; }

    .chapter-item { background: #2a2a2a; padding: 12px 15px; margin-bottom: 8px; border-radius: 8px; display: flex; justify-content: space-between; cursor: pointer; }

    .comment-section { margin-top: 40px; background: #1c1c1c; border-radius: 16px; padding: 20px; }

    .comment-item { background: #2a2a2a; padding: 12px; border-radius: 12px; margin-bottom: 10px; }
  </style>
</head>

<body>
<div class="story-container">
  <a href="index.html" class="back-home">← Về trang chủ</a>

  <div id="storyContent">
    <p>Đang tải...</p>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
import { getAuth } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
import {
  getDatabase, ref, get, set, push, onValue, update, remove
} from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

/* ================= FIREBASE ================= */
const firebaseConfig = {
  apiKey: "AIzaSyCDQk9DlMNKwn_508fDMI_3IB_dgpgHujA",
  authDomain: "danmetopia.firebaseapp.com",
  projectId: "danmetopia",
  databaseURL: "https://danmetopia-default-rtdb.asia-southeast1.firebasedatabase.app/",
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

/* ================= PARAM ================= */
const urlParams = new URLSearchParams(window.location.search);
const storyId = urlParams.get("id");

console.log("storyId =", storyId);

/* ================= CHECK ID ================= */
if (!storyId) {
  document.getElementById("storyContent").innerHTML =
    "<h3>❌ Thiếu ID truyện</h3><a href='index.html'>← Về trang chủ</a>";
  throw new Error("Missing storyId");
}

/* ================= STATE ================= */
let story = null;
let chapters = [];
let currentUser = null;

/* ================= GUEST ================= */
function ensureGuestUser() {
  if (currentUser) return currentUser;

  const guestId = "guest_" + Date.now();
  currentUser = {
    uid: guestId,
    displayName: "Khách",
    role: "guest"
  };

  sessionStorage.setItem("tempGuestUser", JSON.stringify(currentUser));
  return currentUser;
}

/* ================= LOAD STORY ================= */
async function loadStory() {
  try {
    const snap = await get(ref(db, `stories/${storyId}`));

    if (!snap.exists()) {
      document.getElementById("storyContent").innerHTML =
        "<h3>❌ Không tìm thấy truyện</h3>";
      return;
    }

    story = snap.val();

    const chapterSnap = await get(ref(db, `chapters/${storyId}`));
    chapters = [];

    if (chapterSnap.exists()) {
      chapters = Object.entries(chapterSnap.val()).map(([id, v]) => ({
        id,
        ...v
      }));
    }

    render();
  } catch (err) {
    console.error(err);
    document.getElementById("storyContent").innerHTML =
      "<h3>❌ Lỗi load dữ liệu</h3>";
  }
}

/* ================= ESCAPE ================= */
function escapeHtml(str = "") {
  return str.replace(/[&<>]/g, s =>
    s === "&" ? "&amp;" : s === "<" ? "&lt;" : "&gt;"
  );
}

/* ================= RENDER ================= */
function render() {
  const html = `
    <div class="story-detail-grid">

      <div>
        <img class="story-detail-cover"
          src="${story.cover || "https://placehold.co/300x450"}"
          onerror="this.src='https://placehold.co/300x450'">
      </div>

      <div class="story-detail-info">
        <h2>${escapeHtml(story.title)}</h2>

        <p><b>Tác giả:</b> ${escapeHtml(story.author || "Chưa rõ")}</p>
        <p><b>Mô tả:</b> ${escapeHtml(story.desc || "")}</p>
        <p><b>Số chapter:</b> ${chapters.length}</p>
        <p><b>Lượt thích:</b> ${story.likes || 0}</p>
      </div>
    </div>

    <h3>📖 Chapters</h3>
    <div>
      ${chapters.map((c, i) => `
        <div class="chapter-item"
          onclick="location.href='reader.html?id=${storyId}&chapter=${i}'">
          <span>${escapeHtml(c.title)}</span>
        </div>
      `).join("")}
    </div>

    <h3>💬 Comment</h3>
    <textarea id="cmt"></textarea>
    <button onclick="postComment()">Gửi</button>

    <div id="comments"></div>
  `;

  document.getElementById("storyContent").innerHTML = html;

  loadComments();
}

/* ================= COMMENT ================= */
function loadComments() {
  const cRef = ref(db, `comments/${storyId}`);

  onValue(cRef, snap => {
    const data = snap.val() || {};

    const list = Object.values(data)
      .sort((a, b) => b.createdAt - a.createdAt);

    document.getElementById("comments").innerHTML =
      list.map(c => `
        <div class="comment-item">
          <b>${escapeHtml(c.userName)}</b><br>
          ${escapeHtml(c.text)}
        </div>
      `).join("");
  });
}

window.postComment = async function () {
  const user = ensureGuestUser();
  const text = document.getElementById("cmt").value.trim();

  if (!text) return;

  const newRef = push(ref(db, `comments/${storyId}`));

  await set(newRef, {
    text,
    userName: user.displayName,
    createdAt: Date.now()
  });

  document.getElementById("cmt").value = "";
};

/* ================= INIT ================= */
loadStory();
</script>
</body>
</html>
