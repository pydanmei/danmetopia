<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>🌸 DANMETOPIA - Thêm chapter mới 🌸</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .add-container { max-width: 800px; margin: 0 auto; padding: 20px; }
    .back-link { display: inline-block; margin-bottom: 20px; padding: 8px 16px; background: #333; color: white; text-decoration: none; border-radius: 30px; font-size: 14px; }
    .back-link:hover { background: #FF69B4; color: black; }
    .add-panel { background: #1c1c1c; border-radius: 16px; padding: 25px; border: 1px solid #FF69B4; }
    .add-panel h2 { color: #FF69B4; margin-bottom: 20px; }
    .add-panel input, .add-panel textarea, .add-panel select { width: 100%; padding: 12px; margin-bottom: 15px; background: #2a2a2a; border: none; border-radius: 12px; color: white; font-size: 14px; }
    .add-panel textarea { height: 150px; resize: vertical; }
    .images-preview { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 10px; margin-bottom: 15px; }
    .img-preview-item { width: 80px; height: 120px; object-fit: cover; border-radius: 8px; border: 1px solid #FF69B4; position: relative; cursor: grab; }
    .loading-container { text-align: center; padding: 50px; }
    .note { font-size: 12px; color: #888; margin-bottom: 15px; }
  </style>
</head>
<body>
<div class="add-container">
  <a href="javascript:history.back()" class="back-link">← Quay lại</a>
  <div id="addContent">
    <div class="loading-container"><div class="loading-spinner"></div><p>Đang tải thông tin truyện...</p></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sortablejs@latest/Sortable.min.js"></script>
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
  import { getAuth } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
  import { getDatabase, ref, get, push, set, update } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

  const firebaseConfig = {
    apiKey: "AIzaSyCDQk9DlMNKwn_508fDMI_3IB_dgpgHujA",
    authDomain: "danmetopia.firebaseapp.com",
    projectId: "danmetopia",
    databaseURL: "https://danmetopia-default-rtdb.asia-southeast1.firebasedatabase.app/",
    storageBucket: "danmetopia.appspot.com",
    messagingSenderId: "178240377870",
    appId: "1:178240377870:web:d094b222ebabadccc5585f"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getDatabase(app);
  const IMGBB_API_KEY = "d16b5595d7f6044476d254c8f428cc28";
  emailjs.init("fPq8fpw1OqzOtj-lk");

  const urlParams = new URLSearchParams(window.location.search);
  const storyId = urlParams.get('id');
  let currentUser = null;
  let story = null;
  let selectedChapterImages = [];
  let sortableInstance = null;

  function showNotification(msg, isError = false) {
    const notif = document.createElement("div");
    notif.className = "notification";
    notif.style.background = isError ? "#ff4444" : "#FF69B4";
    notif.style.color = "black";
    notif.innerText = msg;
    document.body.appendChild(notif);
    setTimeout(() => notif.remove(), 3000);
  }

  function showLoading(show) {
    let spinner = document.getElementById("globalSpinner");
    if (show) {
      if (!spinner) {
        spinner = document.createElement("div");
        spinner.id = "globalSpinner";
        spinner.className = "spinner-overlay";
        spinner.innerHTML = '<div class="loading-spinner"></div>';
        document.body.appendChild(spinner);
      }
      spinner.style.display = "flex";
    } else {
      if (spinner) spinner.style.display = "none";
    }
  }

  function escapeHtml(str) {
    if (!str) return "";
    return str.replace(/[&<>]/g, m => m === "&" ? "&amp;" : m === "<" ? "&lt;" : "&gt;");
  }

  function isAdmin(userData) { return userData?.role === "admin"; }

  async function uploadImage(file) {
    if (!file) return null;
    if (file.size > 10 * 1024 * 1024) { showNotification(`Ảnh ${file.name} quá lớn (tối đa 10MB)`, true); return null; }
    const formData = new FormData();
    formData.append("image", file);
    formData.append("key", IMGBB_API_KEY);
    try {
      const response = await fetch("https://api.imgbb.com/1/upload", { method: "POST", body: formData });
      const result = await response.json();
      return result.success ? result.data.url : null;
    } catch (err) { showNotification("Lỗi upload: " + err.message, true); return null; }
  }

  async function uploadMultipleImages(files) {
    if (!files || files.length === 0) return [];
    const urls = [];
    for (const file of files) {
      const url = await uploadImage(file);
      if (url) urls.push(url);
    }
    return urls;
  }

  async function restoreSession() {
    const sessionStr = localStorage.getItem("userSession");
    if (!sessionStr) return false;
    try {
      const session = JSON.parse(sessionStr);
      if (!session.expireAt || Date.now() > session.expireAt) {
        localStorage.removeItem("userSession");
        return false;
      }
      if (session.role === "guest") {
        currentUser = session;
        return true;
      } else if (session.uid) {
        const userSnap = await get(ref(db, `users/${session.uid}`));
        if (userSnap.exists()) {
          currentUser = { ...session, ...userSnap.val() };
          return true;
        }
      }
      return false;
    } catch { return false; }
  }

  async function loadStory() {
    const storySnap = await get(ref(db, `stories/${storyId}`));
    if (storySnap.exists()) {
      story = { id: storyId, ...storySnap.val() };
      renderAddForm();
    } else {
      document.getElementById("addContent").innerHTML = '<div class="loading-container"><p>Không tìm thấy truyện</p></div>';
    }
  }

  function renderAddForm() {
    const html = `
      <div class="add-panel">
        <h2>📖 THÊM CHAPTER MỚI CHO: ${escapeHtml(story.title)}</h2>
        <input id="chapterTitle" placeholder="Tên chapter *">
        <input id="chapterNumber" placeholder="Số chapter (để trống tự động)">
        <input type="file" id="chapterImages" accept="image/*" multiple>
        <div id="chapterImagesPreview" class="images-preview"></div>
        <div class="note">💡 Kéo thả ảnh để sắp xếp thứ tự</div>
        <textarea id="chapterPages" placeholder="Hoặc nhập link ảnh (mỗi dòng 1 link)" rows="10"></textarea>
        <button class="btn-pink" id="saveChapterBtn">📤 ĐĂNG CHAPTER</button>
      </div>
    `;
    document.getElementById("addContent").innerHTML = html;

    const previewDiv = document.getElementById("chapterImagesPreview");
    
    const updateSortable = () => {
      if (sortableInstance) sortableInstance.destroy();
      if (previewDiv.children.length > 0) {
        sortableInstance = new Sortable(previewDiv, {
          animation: 150,
          handle: '.img-preview-item',
          onEnd: () => {
            const newOrder = [];
            for (let i = 0; i < previewDiv.children.length; i++) {
              newOrder.push(selectedChapterImages[i]);
            }
            if (newOrder.length === selectedChapterImages.length) {
              selectedChapterImages = newOrder;
            }
          }
        });
      }
    };

    document.getElementById("chapterImages")?.addEventListener("change", (e) => {
      const files = Array.from(e.target.files);
      selectedChapterImages = files;
      previewDiv.innerHTML = "";
      for (const file of files) {
        const reader = new FileReader();
        reader.onload = (ev) => {
          const imgDiv = document.createElement("div");
          imgDiv.className = "img-preview-item";
          imgDiv.innerHTML = `<img src="${ev.target.result}" style="width:100%; height:100%; object-fit:cover; border-radius:8px;"><button onclick="this.parentElement.remove()" style="position:absolute; top:-8px; right:-8px; width:20px; height:20px; border-radius:50%; background:#ff4444; color:white; border:none; cursor:pointer; font-size:12px;">✕</button>`;
          previewDiv.appendChild(imgDiv);
          updateSortable();
        };
        reader.readAsDataURL(file);
      }
      updateSortable();
    });

    document.getElementById("saveChapterBtn")?.addEventListener("click", saveAddChapter);
  }

  async function saveAddChapter() {
    const title = document.getElementById("chapterTitle")?.value.trim();
    const pagesText = document.getElementById("chapterPages")?.value;
    const chapterNumber = parseInt(document.getElementById("chapterNumber")?.value) || 0;

    if (!title) { showNotification("Nhập tên chapter", true); return; }

    let pages = [];

    if (selectedChapterImages.length > 0) {
      showLoading(true);
      showNotification(`📤 Đang upload ${selectedChapterImages.length} ảnh...`, false);
      const uploadedUrls = await uploadMultipleImages(selectedChapterImages);
      if (uploadedUrls.length > 0) pages = [...pages, ...uploadedUrls];
      showLoading(false);
    }

    if (pagesText && pagesText.trim()) {
      const linkPages = pagesText.split('\n').filter(p => p.trim());
      pages = [...pages, ...linkPages];
    }

    if (pages.length === 0) { showNotification("Thêm ít nhất 1 ảnh", true); return; }

    showLoading(true);
    try {
      const existingChaptersSnap = await get(ref(db, `chapters/${storyId}`));
      const existingChapters = existingChaptersSnap.val() || {};
      const existingChaptersList = Object.entries(existingChapters).map(([id, value]) => value);
      existingChaptersList.sort((a, b) => (a.chapterNumber || 0) - (b.chapterNumber || 0));
      const newChapterNumber = chapterNumber || existingChaptersList.length + 1;

      const newChapterRef = push(ref(db, `chapters/${storyId}`));
      await set(newChapterRef, {
        title: title,
        pages: pages,
        chapterNumber: newChapterNumber,
        createdAt: Date.now()
      });

      const storyRef = ref(db, `stories/${storyId}/chapters`);
      const snap = await get(storyRef);
      const currentChapters = snap.val() || {};
      currentChapters[newChapterRef.key] = true;
      await set(storyRef, currentChapters);

      showNotification("✅ Đã thêm chapter thành công!");
      setTimeout(() => { window.location.href = `story.html?id=${storyId}`; }, 1000);
    } catch (err) {
      showNotification("Lỗi: " + err.message, true);
    } finally {
      showLoading(false);
    }
  }

  const restored = await restoreSession();
  if (!restored) {
    window.location.href = 'index.html';
  } else {
    await loadStory();
  }
</script>
</body>
</html>
