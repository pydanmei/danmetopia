<!DOCTYPE html>
<html>

<head>
  <title>DANMETOPIA LOGIN</title>
  <meta charset="utf-8">
</head>

<body style="margin:0;background:#0f0f0f;color:white;font-family:Arial">

<!-- ⚠️ WARNING -->
<div id="warning"
style="position:fixed;inset:0;background:black;display:flex;justify-content:center;align-items:center">

  <div style="background:#1c1c1c;padding:20px;border-radius:10px;width:320px;text-align:center">

    <h2>⚠️ 18+ CONTENT</h2>

    <p>Bạn phải đủ 18+ để vào website</p>

    <button onclick="enter()"
    style="width:100%;padding:10px;background:#00dc64;border:none">
      ENTER
    </button>

    <button onclick="leave()"
    style="width:100%;padding:10px;margin-top:5px">
      EXIT
    </button>

  </div>

</div>

<!-- LOGIN -->
<div id="login" style="display:none;justify-content:center;align-items:center;height:100vh">

  <div style="background:#1c1c1c;padding:20px;border-radius:10px;width:320px">

    <h2>LOGIN SYSTEM</h2>

    <input id="pass" type="password" placeholder="Password"
    style="width:100%;padding:10px;margin-top:5px">

    <button onclick="login()"
    style="width:100%;padding:10px;background:#00dc64;border:none;margin-top:10px">
      LOGIN
    </button>

    <hr>

    <h3>REGISTER GROUP (UPLOAD ACCESS)</h3>

    <input id="email" placeholder="Email"
    style="width:100%;padding:10px;margin-top:5px">

    <input id="groupName" placeholder="Group name"
    style="width:100%;padding:10px;margin-top:5px">

    <input id="displayName" placeholder="Display name"
    style="width:100%;padding:10px;margin-top:5px">

    <button onclick="registerGroup()"
    style="width:100%;padding:10px;background:#ffcc00;border:none;margin-top:10px">
      REGISTER GROUP
    </button>

    <p id="msg" style="color:red"></p>

  </div>

</div>

<script>

/* ================= WARNING ================= */
function enter(){
  document.getElementById("warning").style.display="none";
  document.getElementById("login").style.display="flex";
}

function leave(){
  document.body.innerHTML="<h2 style='color:white;text-align:center;margin-top:100px'>EXIT</h2>";
}

/* ================= LOGIN ================= */
function login(){

  const pass = document.getElementById("pass").value;

  // ADMIN
  if(pass === "pydanmetopia"){
    setUser("admin","admin","Admin");
    return;
  }

  // GROUP LOGIN (basic demo password)
  if(pass === "group123"){
    const group = localStorage.getItem("groupName") || "groupA";
    setUser("group", group, group);
    return;
  }

  // USER / ANONYMOUS
  if(pass === "1234"){
    setUser("user","anonymous","Anonymous");
    return;
  }

  document.getElementById("msg").innerText="Wrong password";
}

/* ================= REGISTER GROUP ================= */
function registerGroup(){

  const email = document.getElementById("email").value;
  const groupName = document.getElementById("groupName").value;
  const displayName = document.getElementById("displayName").value;

  if(!email || !groupName){
    document.getElementById("msg").innerText="Fill all fields";
    return;
  }

  localStorage.setItem("groupName", groupName);
  localStorage.setItem("displayName", displayName);

  document.getElementById("msg").innerText="Group registered! Now login";

}

/* ================= USER SYSTEM ================= */
function setUser(role, group, name){

  localStorage.setItem("role",role);
  localStorage.setItem("group",group);
  localStorage.setItem("name",name);

  window.location.href="home.html";
}

</script>

</body>
</html>
