<!DOCTYPE html>
<html>

<head>
<meta charset="utf-8">
<title>DANMETOPIA</title>

<style>
body{
  margin:0;
  background:#0f0f0f;
  color:white;
  font-family:Arial;
}

/* ===== WARNING ===== */
#warning{
  position:fixed;
  inset:0;
  background:black;
  display:flex;
  justify-content:center;
  align-items:center;
  z-index:999;
}

.box{
  background:#1c1c1c;
  padding:20px;
  width:320px;
  border-radius:12px;
  text-align:center;
}

button{
  width:100%;
  padding:10px;
  margin-top:10px;
  border:none;
  border-radius:8px;
  cursor:pointer;
  font-weight:bold;
}

.green{background:#00dc64;color:black;}
.red{background:#ff4444;color:white;}

/* ===== LOGIN ===== */
#login{
  display:none;
  height:100vh;
  justify-content:center;
  align-items:center;
}

/* ===== HOME ===== */
#home{
  display:none;
}

.topbar{
  background:#00dc64;
  color:black;
  padding:15px;
  font-weight:bold;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.container{
  padding:15px;
}

.card{
  background:#1c1c1c;
  padding:15px;
  margin-top:10px;
  border-radius:10px;
  cursor:pointer;
}

.card:hover{
  background:#2a2a2a;
}
</style>

</head>

<body>

<!-- WARNING -->
<div id="warning">
  <div class="box">
    <h2>⚠️ CẢNH BÁO 18+</h2>

    <p>Trang có nội dung người lớn</p>
    Xác nhận đủ tuổi khi tiếp tục.

    <button class="green" onclick="enter()">TIẾP TỤC</button>
    <button class="red" onclick="leave()">THOÁT</button>
  </div>
</div>

<!-- LOGIN -->
<div id="login">
  <div class="box">

    <h2>DANMETOPIA</h2>
    <p>Nền tảng đọc truyện</p>

    <input id="pass" type="password" placeholder="Mật khẩu">

    <button class="green" onclick="login()">TRUY CẬP</button>

    <p id="msg" style="color:red"></p>

  </div>
</div>

<!-- HOME -->
<div id="home">

  <div class="topbar">
    <span>🏠 DANMETOPIA HOME</span>
    <button style="width:auto;padding:8px" onclick="logout()">Đăng xuất</button>
  </div>

  <div class="container">
    <h3>📚 Danh sách truyện</h3>

    <div class="card" onclick="goRead(1)">📖 Truyện 1 - Hành trình tu tiên</div>
    <div class="card" onclick="goRead(2)">📖 Truyện 2 - Tình yêu cấm</div>
    <div class="card" onclick="goRead(3)">📖 Truyện 3 - Dị giới phiêu lưu</div>

  </div>

</div>

<script>

/* ===== WARNING ===== */
function enter(){
  document.getElementById("warning").style.display="none";
  document.getElementById("login").style.display="flex";
}

function leave(){
  document.body.innerHTML="<h2 style='color:white;text-align:center;margin-top:100px'>Đã thoát</h2>";
}

/* ===== LOGIN ===== */
function login(){

  const pass = document.getElementById("pass").value;

  if(pass !== "danmei"){
    document.getElementById("msg").innerText="Sai mật khẩu";
    return;
  }

  localStorage.setItem("auth","ok");

  showHome();
}

/* ===== HOME ===== */
function showHome(){
  document.getElementById("warning").style.display="none";
  document.getElementById("login").style.display="none";
  document.getElementById("home").style.display="block";
}

/* ===== READ ===== */
function goRead(id){
  window.location.href="read.html?id="+id;
}

/* ===== LOGOUT ===== */
function logout(){
  localStorage.removeItem("auth");
  location.reload();
}

/* ===== AUTO LOGIN ===== */
if(localStorage.getItem("auth") === "ok"){
  showHome();
}

</script>

</body>
</html>
