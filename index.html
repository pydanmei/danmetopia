<!DOCTYPE html>
<html>

<head>
<meta charset="utf-8">
<title>DANMETOPIA</title>

<style>
body{
  margin:0;
  background:#0f0f0f;
  color:white;
  font-family:Arial;
}

/* ===== WARNING ===== */
#warning{
  position:fixed;
  inset:0;
  background:black;
  display:flex;
  justify-content:center;
  align-items:center;
  z-index:999;
}

.box{
  background:#1c1c1c;
  padding:20px;
  width:340px;
  border-radius:12px;
  text-align:center;
}

/* ===== LOGIN ===== */
#login{
  display:none;
  position:fixed;
  inset:0;
  justify-content:center;
  align-items:center;
  background:#0f0f0f;
  z-index:998;
}

/* INPUT */
input{
  width:100%;
  padding:10px;
  margin-top:8px;
  border:none;
  border-radius:8px;
  background:#2a2a2a;
  color:white;
}

/* BUTTON */
button{
  width:100%;
  padding:10px;
  margin-top:10px;
  border:none;
  border-radius:8px;
  cursor:pointer;
  font-weight:bold;
}

.green{background:#00dc64;color:black;}
.red{background:#ff4444;color:white;}

/* ===== HOME ===== */
#home{
  display:none;
}

.topbar{
  background:#00dc64;
  color:black;
  padding:15px;
  display:flex;
  justify-content:space-between;
  font-weight:bold;
}

.container{
  padding:15px;
}

.card{
  background:#1c1c1c;
  padding:15px;
  margin-top:10px;
  border-radius:10px;
}
</style>

</head>

<body>

<!-- ================= WARNING ================= -->
<div id="warning">
  <div class="box">
    <h2>⚠️ CẢNH BÁO 18+</h2>
    <p>Trang truyện người lớn. Xác nhận đủ tuổi khi tiếp tục.</p>

    <button class="green" onclick="enter()">TIẾP TỤC</button>
    <button class="red" onclick="leave()">THOÁT</button>
  </div>
</div>

<!-- ================= LOGIN ================= -->
<div id="login">

  <div class="box">

    <h2>DANMETOPIA</h2>
    <p>Nền tảng đọc truyện</p>

    <!-- 🔥 REQUIRED PASSWORD -->
    <input id="mainPass" type="password" placeholder="Mật khẩu">

    <hr>

    <!-- OPTIONAL LOGIN -->
    <input id="email" placeholder="Email / Tên đăng nhập (không bắt buộc)">
    <input id="pass" type="password" placeholder="Mật khẩu tài khoản (nếu có)">

    <button class="green" onclick="login()">VÀO WEB</button>

    <p id="msg" style="color:red"></p>

  </div>
</div>

<!-- ================= HOME ================= -->
<div id="home">

  <div class="topbar">
    <div>🏠 DANMETOPIA - TRANG CHỦ</div>
    <div id="userBox">Ẩn danh</div>
  </div>

  <div class="container">

    <h3>📚 Danh sách truyện</h3>

    <div class="card">📖 Truyện 1</div>
    <div class="card">📖 Truyện 2</div>
    <div class="card">📖 Truyện 3</div>

  </div>

</div>

<script>

/* ================= STATE ================= */
let user = {
  email:null,
  role:"guest"
};

/* ================= ENTER ================= */
function enter(){
  document.getElementById("warning").style.display="none";
  document.getElementById("login").style.display="flex";
}

/* ================= EXIT ================= */
function leave(){
  document.body.innerHTML = "<h2 style='color:white;text-align:center;margin-top:100px'>Đã thoát</h2>";
}

/* ================= ROLE CHECK ================= */
function getRole(email){

  if(!email) return "user";

  if(
    email === "pydanmeii@gmail.com" ||
    email === "pepyl4298@gmail.com"
  ) return "admin";

  if(email.includes("@group")) return "group";

  return "user";
}

/* ================= LOGIN ================= */
function login(){

  const mainPass = document.getElementById("mainPass").value;

  if(mainPass !== "danmei"){
    document.getElementById("msg").innerText = "Sai mật khẩu chính";
    return;
  }

  const email = document.getElementById("email").value;

  // 🔥 CASE 1: ANON
  if(!email){
    user = { email:null, role:"guest" };
  }

  // 🔥 CASE 2: LOGIN USER
  else{
    user = {
      email: email,
      role: getRole(email)
    };
  }

  localStorage.setItem("user", JSON.stringify(user));

  showHome();
}

/* ================= HOME ================= */
function showHome(){

  document.getElementById("warning").style.display="none";
  document.getElementById("login").style.display="none";
  document.getElementById("home").style.display="block";

  updateUI();
}

/* ================= UI ================= */
function updateUI(){

  if(!user.email){
    document.getElementById("userBox").innerText = "Ẩn danh";
  }else{
    document.getElementById("userBox").innerText =
      user.email + " (" + user.role + ")";
  }
}

/* ================= INIT ================= */
const saved = localStorage.getItem("user");
if(saved){
  user = JSON.parse(saved);
}

</script>

</body>
</html>
