<!DOCTYPE html>
<html>

<head>
<meta charset="utf-8">
<title>DANMETOPIA</title>

<style>
body{
  margin:0;
  background:#0f0f0f;
  color:white;
  font-family:Arial;
}

#warning{
  position:fixed;
  inset:0;
  background:black;
  display:flex;
  justify-content:center;
  align-items:center;
}

.box{
  background:#1c1c1c;
  padding:20px;
  width:320px;
  border-radius:12px;
  text-align:center;
}

button{
  width:100%;
  padding:10px;
  margin-top:10px;
  border:none;
  border-radius:8px;
  cursor:pointer;
  font-weight:bold;
}

.green{background:#00dc64;color:black;}
.red{background:#ff4444;color:white;}

#login{
  display:none;
  height:100vh;
  justify-content:center;
  align-items:center;
}
</style>
</head>

<body>

<div id="warning">
  <div class="box">
    <h2>⚠️ CẢNH BÁO 18+</h2>

    <p>Bạn đủ 18 tuổi chưa?</p>

    <button class="green" onclick="enter()">TRUY CẬP</button>
    <button class="red" onclick="leave()">THOÁT</button>
  </div>
</div>

<div id="login">
  <div class="box">

    <h2>ĐĂNG NHẬP</h2>

    <input id="email" placeholder="Email">
    <input id="pass" type="password" placeholder="Mật khẩu (danmei)">

    <button class="green" onclick="login()">ĐĂNG NHẬP</button>

    <p id="msg" style="color:red"></p>

  </div>
</div>

<script>

/* ===== ENTER ===== */
function enter(){
  document.getElementById("warning").style.display="none";
  document.getElementById("login").style.display="flex";
}

/* ===== EXIT ===== */
function leave(){
  document.body.innerHTML="<h2 style='color:white;text-align:center;margin-top:100px'>Đã thoát</h2>";
}

/* ===== LOGIN TEST ===== */
function login(){

  const pass = document.getElementById("pass").value;

  if(pass !== "danmei"){
    document.getElementById("msg").innerText="Sai mật khẩu";
    return;
  }

  alert("Login OK (test)");

  window.location.href="home.html";
}

</script>

</body>
</html>
