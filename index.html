<!DOCTYPE html>
<html>

<body style="background:#111;color:white;font-family:Arial;display:flex;justify-content:center;align-items:center;height:100vh">

<div style="background:#1c1c1c;padding:20px;border-radius:10px;width:300px">

<h2>LOGIN</h2>

<input id="pass" type="password" placeholder="password" style="width:100%;padding:10px"><br><br>
<input id="group" placeholder="group (nếu có)" style="width:100%;padding:10px"><br><br>

<button onclick="login()" style="width:100%;padding:10px;background:#00dc64;border:none">
ENTER
</button>

</div>

<script>

function login(){

  const p = pass.value;
  const g = group.value;

  if(p === "pydanmetopia"){
    localStorage.setItem("role","admin");
  }
  else if(p === "group123"){
    localStorage.setItem("role","group");
    localStorage.setItem("group", g || "groupA");
  }
  else if(p === "1234"){
    localStorage.setItem("role","user");
  }

  location.href="home.html";
}

</script>

</body>
</html>
