<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>DANMETOPIA</title>

<style>
body{
  margin:0;
  font-family:Arial;
  background:#0f0f0f;
  color:white;
}

#warning, #loginPage, #nicknamePage{
  position:fixed;
  inset:0;
  display:flex;
  justify-content:center;
  align-items:center;
  background:rgba(0,0,0,0.9);
}

.box{
  background:#1c1c1c;
  padding:25px;
  width:380px;
  border-radius:15px;
  text-align:center;
}

input{
  width:100%;
  padding:10px;
  margin-top:10px;
  border:none;
  border-radius:8px;
  background:#2a2a2a;
  color:white;
}

button{
  width:100%;
  margin-top:10px;
  padding:10px;
  border:none;
  border-radius:8px;
  cursor:pointer;
}

.green{background:#00dc64;color:black;}
.red{background:#ff4444;color:white;}

#home{
  display:none;
  padding:20px;
}

.topbar{
  background:#00dc64;
  color:black;
  padding:15px;
  display:flex;
  justify-content:space-between;
}
</style>
</head>

<body>

<!-- WARNING -->
<div id="warning">
  <div class="box">
    <h2>⚠️ CẢNH BÁO 18+ ⚠️</h2>
     <p>Bằng việc tiếp tục, bạn xác nhận rằng bạn đủ 18 tuổi trở lên và việc xem nội dung này hợp pháp tại khu vực của bạn.</p>
    <button class="green" onclick="enter()">TIẾP TỤC</button>
    <button class="red" onclick="leave()">THOÁT</button>
  </div>
</div>

<!-- LOGIN -->
<div id="loginPage" style="display:none">
  <div class="box">
    <h2>DANMETOPIA</h2>
    <p>Nền tảng đọc truyện</p>

    <input id="mainPass" type="password" placeholder="Mật khẩu chính (danmei)">
    <input id="email" type="email" placeholder="Email">
    <input id="password" type="password" placeholder="Mật khẩu">

    <button class="green" onclick="login()">TRUY CẬP</button>
    <p id="msg"></p>
  </div>
</div>

<!-- NICKNAME STEP (CHỈ SAU VERIFY) -->
<div id="nicknamePage" style="display:none">
  <div class="box">
    <h2>🎉 XÁC NHẬN HOÀN TẤT</h2>
    <p>Tạo nickname (chỉ 1 lần)</p>

    <input id="nickname" placeholder="Nickname">

    <button class="green" onclick="saveNickname()">HOÀN TẤT</button>
  </div>
</div>

<!-- HOME -->
<div id="home">
  <div class="topbar">
    <span>DANMETOPIA</span>
    <button onclick="logout()">Đăng xuất</button>
  </div>
</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-app.js";
import {
  getAuth,
  createUserWithEmailAndPassword,
  signInWithEmailAndPassword,
  sendEmailVerification,
  onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/12.13.0/firebase-auth.js";

import {
  getFirestore,
  doc,
  setDoc,
  getDoc,
  query,
  collection,
  where,
  getDocs
} from "https://www.gstatic.com/firebasejs/12.13.0/firebase-firestore.js";

/* FIREBASE */
const app = initializeApp({
  apiKey: "AIzaSyCDQk9DlMNKwn_508fDMI_3IB_dgpgHujA",
  authDomain: "danmetopia.firebaseapp.com",
  projectId: "danmetopia"
});

const auth = getAuth(app);
const db = getFirestore(app);

const ADMIN = ["pydanmeii@gmail.com","pepyl4298@gmail.com"];

let currentUser = null;

/* UI */
window.enter = () => {
  warning.style.display="none";
  loginPage.style.display="flex";
};

window.leave = () => {
  document.body.innerHTML="ĐÃ THOÁT";
};

/* LOGIN / REGISTER */
window.login = async () => {

  const mainPass = mainPass.value;
  const email = email.value;
  const pass = password.value;

  if(mainPass !== "danmei"){
    msg.innerText="Sai mật khẩu chính";
    return;
  }

  try{

    const cred = await createUserWithEmailAndPassword(auth,email,pass);

    await sendEmailVerification(cred.user);

    alert("📩 Check email để xác nhận tài khoản");

    localStorage.setItem("tempUID",cred.user.uid);
    loginPage.style.display="none";

  }catch(e){

    try{
      const cred = await signInWithEmailAndPassword(auth,email,pass);

      if(!cred.user.emailVerified){
        alert("⚠️ Vui lòng verify email trước");
        return;
      }

      currentUser = cred.user;

      const data = await getDoc(doc(db,"users",cred.user.uid));

      if(!data.exists() || !data.data().nickname){
        loginPage.style.display="none";
        nicknamePage.style.display="flex";
        return;
      }

      showHome();

    }catch(err){
      msg.innerText = err.message;
    }
  }
};

/* SAVE NICKNAME (CHỈ 1 LẦN) */
window.saveNickname = async () => {

  const nick = document.getElementById("nickname").value;

  const uid = currentUser.uid;

  const q = await getDocs(query(collection(db,"users"),where("nickname","==",nick)));

  if(!q.empty){
    alert("Nickname đã tồn tại");
    return;
  }

  await setDoc(doc(db,"users",uid),{
    email:currentUser.email,
    nickname:nick,
    role:ADMIN.includes(currentUser.email) ? "admin" : "user",
    group:false
  });

  nicknamePage.style.display="none";
  showHome();
};

/* HOME */
function showHome(){
  home.style.display="block";
}

/* LOGOUT */
window.logout = () => {
  localStorage.clear();
  location.reload();
};

/* AUTO CHECK */
onAuthStateChanged(auth,(u)=>{
  if(u && u.emailVerified){
    currentUser=u;
  }
});

</script>

</body>
</html>
