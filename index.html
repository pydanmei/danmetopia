<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DANMETOPIA - Đăng nhập</title>
<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}
body {
  font-family: Arial, sans-serif;
  background: #0f0f0f;
  color: white;
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
}
.login-box {
  background: #1c1c1c;
  width: 380px;
  padding: 35px 25px;
  border-radius: 24px;
  text-align: center;
  border: 1px solid #FF69B4;
}
.login-box h2 {
  color: #FF69B4;
  font-size: 28px;
  margin-bottom: 20px;
}
.login-box input {
  width: 100%;
  padding: 12px;
  margin-top: 12px;
  border: none;
  border-radius: 12px;
  background: #2a2a2a;
  color: white;
}
.login-box button {
  width: 100%;
  padding: 12px;
  margin-top: 12px;
  border: none;
  border-radius: 40px;
  background: #FF69B4;
  color: black;
  font-weight: bold;
  cursor: pointer;
}
.otp-group {
  display: none;
  margin-top: 15px;
}
.msg {
  color: #ff6666;
  margin-top: 15px;
  font-size: 13px;
}
.success {
  color: #00dc64;
}
hr {
  margin: 20px 0;
  border-color: #333;
}
</style>
</head>
<body>

<div class="login-box">
  <h2>🌸 DANMETOPIA 🌸</h2>
  
  <input type="password" id="mainPassword" placeholder="Mật khẩu chính *">
  <button id="guestBtn">🔓 VÀO WEB (KHÁCH)</button>
  
  <hr>
  
  <p>📧 Đăng nhập bằng email</p>
  <input type="email" id="email" placeholder="Email">
  <button id="sendOtpBtn">📩 Gửi mã OTP</button>
  
  <div id="otpGroup" class="otp-group">
    <input type="text" id="otpCode" placeholder="Nhập mã 6 số" maxlength="6">
    <button id="verifyBtn">🔓 Xác nhận & Đăng nhập</button>
    <button id="resendBtn" style="background:#555;">🔄 Gửi lại</button>
  </div>
  
  <div id="msg" class="msg"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
<script>
// EmailJS Config
const EMAILJS_PUBLIC_KEY = "fPq8fpw1OqzOtj-lk";
const EMAILJS_SERVICE_ID = "service_8bxh5mm";
const EMAILJS_TEMPLATE_ID = "template_8ahbuhu";

// Firebase Config
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyCDQk9DlMNKwn_508fDMI_3IB_dgpgHujA",
  authDomain: "danmetopia.firebaseapp.com",
  projectId: "danmetopia",
  databaseURL: "https://danmetopia-default-rtdb.asia-southeast1.firebasedatabase.app/",
  storageBucket: "danmetopia.appspot.com",
  messagingSenderId: "178240377870",
  appId: "1:178240377870:web:d094b222ebabadccc5585f"
};

// Khởi tạo Firebase
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
import { getAuth, signInAnonymously, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
import { getDatabase, ref, set, get, remove } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

const app = initializeApp(FIREBASE_CONFIG);
const auth = getAuth(app);
const db = getDatabase(app);

// EmailJS init
emailjs.init(EMAILJS_PUBLIC_KEY);

// DOM elements
const mainPassword = document.getElementById("mainPassword");
const guestBtn = document.getElementById("guestBtn");
const emailInput = document.getElementById("email");
const sendOtpBtn = document.getElementById("sendOtpBtn");
const otpGroup = document.getElementById("otpGroup");
const otpCode = document.getElementById("otpCode");
const verifyBtn = document.getElementById("verifyBtn");
const resendBtn = document.getElementById("resendBtn");
const msgDiv = document.getElementById("msg");

let pendingEmail = null;
let lastOtpTime = 0;

const MAIN_PASSWORD = "danmei";

// Helper
function showMessage(text, isError = true) {
  msgDiv.innerHTML = text;
  msgDiv.className = isError ? "msg" : "msg success";
  setTimeout(() => { if (msgDiv.innerHTML === text) msgDiv.innerHTML = ""; }, 5000);
}

// Tạo OTP ngẫu nhiên
function generateOTP() {
  return Math.floor(100000 + Math.random() * 900000).toString();
}

// Gửi OTP qua EmailJS
async function sendOTP(email) {
  const now = Date.now();
  if (now - lastOtpTime < 30000) {
    showMessage(`Vui lòng đợi ${Math.ceil((30000 - (now - lastOtpTime)) / 1000)} giây`, true);
    return false;
  }
  
  const otp = generateOTP();
  const expires = now + 5 * 60 * 1000;
  const emailKey = email.replace(/\./g, "_");
  
  try {
    // Lưu OTP vào database
    await set(ref(db, `otp_requests/${emailKey}`), {
      code: otp,
      expires: expires
    });
    
    // Gửi email
    await emailjs.send(EMAILJS_SERVICE_ID, EMAILJS_TEMPLATE_ID, {
      otp: otp,
      to_email: email
    });
    
    lastOtpTime = now;
    showMessage(`📩 Đã gửi mã OTP đến ${email}`, false);
    return true;
  } catch (err) {
    console.error("Send OTP error:", err);
    showMessage(`Lỗi gửi OTP. Mã demo: ${otp}`, true);
    return true;
  }
}

// Xác thực OTP
async function verifyOTP(email, code) {
  const emailKey = email.replace(/\./g, "_");
  const snapshot = await get(ref(db, `otp_requests/${emailKey}`));
  const data = snapshot.val();
  
  if (!data) return { success: false, message: "Mã OTP không tồn tại" };
  if (Date.now() > data.expires) return { success: false, message: "Mã OTP đã hết hạn" };
  if (data.code !== code) return { success: false, message: "Sai mã OTP" };
  
  await remove(ref(db, `otp_requests/${emailKey}`));
  return { success: true, message: "OK" };
}

// Login với Firebase Anonymous
async function loginWithEmail(email) {
  try {
    showMessage("Đang đăng nhập...", false);
    
    // Sign in anonymously
    const userCred = await signInAnonymously(auth);
    const uid = userCred.user.uid;
    
    // Lưu thông tin user vào database
    await set(ref(db, `users/${uid}`), {
      email: email,
      nickname: email.split("@")[0],
      role: "user",
      privileges: { moderator: false, groupId: null },
      createdAt: Date.now()
    });
    
    // Lưu session
    const sessionData = {
      uid: uid,
      email: email,
      role: "user",
      displayName: email.split("@")[0]
    };
    localStorage.setItem("userSession", JSON.stringify(sessionData));
    
    showMessage("✅ Đăng nhập thành công! Chuyển trang...", false);
    
    // Chuyển sang trang chủ
    setTimeout(() => {
      window.location.href = "home.html";
    }, 1000);
    
  } catch (err) {
    console.error("Login error:", err);
    showMessage("Lỗi đăng nhập: " + err.message, true);
  }
}

// Xử lý guest mode
async function handleGuest() {
  const pass = mainPassword.value;
  if (pass !== MAIN_PASSWORD) {
    showMessage("❌ Sai mật khẩu chính", true);
    return;
  }
  
  const guestName = "Hủ nằm vùng " + Math.floor(Math.random() * 10000);
  const sessionData = {
    role: "guest",
    displayName: guestName
  };
  localStorage.setItem("userSession", JSON.stringify(sessionData));
  showMessage("👤 Chế độ khách, đang chuyển trang...", false);
  setTimeout(() => {
    window.location.href = "home.html";
  }, 500);
}

// Xử lý gửi OTP
async function handleSendOTP() {
  const email = emailInput.value.trim();
  if (!email) {
    showMessage("Nhập email", true);
    return;
  }
  if (!email.includes("@")) {
    showMessage("Email không hợp lệ", true);
    return;
  }
  
  pendingEmail = email;
  const success = await sendOTP(email);
  if (success) {
    otpGroup.style.display = "block";
    showMessage("Đã gửi OTP, kiểm tra email", false);
  }
}

// Xử lý xác nhận OTP
async function handleVerify() {
  const email = pendingEmail;
  const code = otpCode.value.trim();
  
  if (!email) {
    showMessage("Vui lòng nhập email trước", true);
    return;
  }
  if (!code || code.length !== 6) {
    showMessage("Nhập mã OTP 6 số", true);
    return;
  }
  
  showMessage("Đang xác thực OTP...", false);
  
  const result = await verifyOTP(email, code);
  if (!result.success) {
    showMessage(result.message, true);
    return;
  }
  
  showMessage("✅ OTP chính xác! Đang đăng nhập...", false);
  await loginWithEmail(email);
}

// Xử lý gửi lại OTP
async function handleResend() {
  if (!pendingEmail) {
    showMessage("Chưa có email", true);
    return;
  }
  await sendOTP(pendingEmail);
}

// Gắn sự kiện
guestBtn.onclick = handleGuest;
sendOtpBtn.onclick = handleSendOTP;
verifyBtn.onclick = handleVerify;
resendBtn.onclick = handleResend;

// Kiểm tra session đã tồn tại
const existingSession = localStorage.getItem("userSession");
if (existingSession) {
  window.location.href = "home.html";
}
</script>
</body>
</html>
