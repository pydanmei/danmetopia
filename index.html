<!DOCTYPE html>
<html>

<head>
<meta charset="utf-8">
<title>DANMETOPIA</title>

<style>
body{
  margin:0;
  background:#0f0f0f;
  color:white;
  font-family:Arial;
}

/* ===== WARNING ===== */
#warning{
  position:fixed;
  inset:0;
  background:black;
  display:flex;
  justify-content:center;
  align-items:center;
  z-index:999;
}

.box{
  background:#1c1c1c;
  padding:20px;
  width:340px;
  border-radius:12px;
  text-align:center;
}

button{
  width:100%;
  padding:10px;
  margin-top:10px;
  border:none;
  border-radius:8px;
  cursor:pointer;
  font-weight:bold;
}

.green{background:#00dc64;color:black;}
.red{background:#ff4444;color:white;}
.yellow{background:#ffcc00;color:black;}

/* ===== LOGIN ===== */
#login{
  display:none;
  height:100vh;
  justify-content:center;
  align-items:center;
}

input{
  width:100%;
  padding:10px;
  margin-top:8px;
  border:none;
  border-radius:8px;
  background:#2a2a2a;
  color:white;
}

hr{
  border:0;
  border-top:1px solid #333;
  margin:15px 0;
}

.title{
  font-size:18px;
  font-weight:bold;
}

.sub{
  font-size:12px;
  color:#aaa;
}
</style>

</head>

<body>

<!-- ⚠️ WARNING -->
<div id="warning">
  <div class="box">

    <h2>⚠️ CẢNH BÁO 18+</h2>

    <p style="font-size:14px;line-height:1.5">
      Trang có nội dung 18+<br>
      Bạn xác nhận đủ tuổi để tiếp tục
    </p>

    <button class="green" onclick="enter()">TRUY CẬP</button>
    <button class="red" onclick="leave()">THOÁT</button>

  </div>
</div>

<!-- LOGIN -->
<div id="login">

  <div class="box">

    <div class="title">DANMETOPIA</div>
    <div class="sub">Nền tảng đọc truyện</div>

    <input id="email" placeholder="Email (không bắt buộc)">
    <input id="pass" type="password" placeholder="Mật khẩu: danmei">

    <button class="green" onclick="login()">ĐĂNG NHẬP</button>

    <hr>

    <div class="title">NHÓM DỊCH</div>

    <input id="groupName" placeholder="Tên nhóm dịch">
    <input id="displayName" placeholder="Tên hiển thị">

    <button class="yellow" onclick="registerGroup()">TẠO NHÓM</button>

    <p id="msg" style="color:red"></p>

  </div>

</div>

<script>

/* ================= WARNING ================= */
function enter(){
  document.getElementById("warning").style.display="none";
  document.getElementById("login").style.display="flex";
}

function leave(){
  document.body.innerHTML="<h2 style='color:white;text-align:center;margin-top:100px'>Đã thoát</h2>";
}

/* ================= LOGIN ================= */
function login(){

  const email = document.getElementById("email").value || "user@danmei.com";
  const pass = document.getElementById("pass").value;

  if(pass !== "danmei"){
    document.getElementById("msg").innerText="Sai mật khẩu";
    return;
  }

  // USER DATA RESTORE
  localStorage.setItem("email", email);
  localStorage.setItem("role", "user");

  // nếu là admin (tuỳ bạn chỉnh)
  if(email === "admin@danmei.com"){
    localStorage.setItem("role","admin");
  }

  window.location.href="home.html";
}

/* ================= GROUP ================= */
function registerGroup(){

  const groupName = document.getElementById("groupName").value;
  const displayName = document.getElementById("displayName").value;

  if(!groupName){
    document.getElementById("msg").innerText="Nhập tên nhóm";
    return;
  }

  localStorage.setItem("groupName", groupName);
  localStorage.setItem("displayName", displayName);
  localStorage.setItem("role", "group");

  document.getElementById("msg").innerText="Tạo nhóm thành công!";
}

</script>

</body>
</html>
