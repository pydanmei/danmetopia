<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>DANMETOPIA</title>

<style>
/* ================= RESET ================= */
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #0f0f0f;
  color: white;
  font-family: 'Segoe UI', Arial, sans-serif;
}

/* ================= WARNING ================= */
#warning {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.95);
  display: flex;
  justify-content: center;
  align-items: center;
  z-index: 9999;
}

#warning .box {
  background: #1c1c1c;
  width: 400px;
  padding: 30px;
  border-radius: 20px;
  text-align: center;
  border: 2px solid #e94560;
}

#warning button {
  margin-top: 10px;
  padding: 12px;
  width: 100%;
  border: none;
  border-radius: 10px;
  cursor: pointer;
}

.green { background:#00dc64; color:black; }
.red { background:#ff4444; color:white; }

/* ================= LOGIN ================= */
#loginPage {
  display: none;
  position: fixed;
  inset: 0;
  justify-content: center;
  align-items: center;
  background: #111;
}

#loginPage .box {
  background: #1c1c1c;
  width: 380px;
  padding: 25px;
  border-radius: 20px;
  text-align: center;
}

#loginPage input {
  width: 100%;
  padding: 10px;
  margin-top: 10px;
  background: #2a2a2a;
  border: none;
  color: white;
  border-radius: 8px;
}

/* ================= HOME ================= */
#home {
  display: none;
  padding: 20px;
}

.topbar {
  background: #00dc64;
  color: black;
  padding: 15px;
  display: flex;
  justify-content: space-between;
  font-weight: bold;
}
</style>
</head>

<body>

<!-- ================= WARNING ================= -->
<div id="warning">
  <div class="box">
    <h2>⚠️ CẢNH BÁO 18+</h2>
    <p>Trang web này có thể chứa nội dung dành cho người trưởng thành (18+).<br>
      Bằng việc tiếp tục, bạn xác nhận rằng bạn đủ 18 tuổi trở lên và việc xem nội dung này hợp pháp tại khu vực của bạn.
    </p>

    <button class="green" onclick="enter()">TIẾP TỤC</button>
    <button class="red" onclick="leave()">THOÁT</button>
  </div>
</div>

<!-- ================= LOGIN ================= -->
<div id="loginPage">
  <div class="box">
    <h1>DANMETOPIA</h1>
    <p>Nền tảng đọc truyện</p>

    <input id="mainPass" type="password" placeholder="Mật khẩu chính (danmei)">
    <input id="email" placeholder="Email (không bắt buộc)">
    <input id="password" type="password" placeholder="Mật khẩu tài khoản (nếu có)">
    <input id="nickname" placeholder="Tên hiển thị (nếu tạo mới)">

    <button class="green" onclick="login()">TRUY CẬP</button>
    <p id="msg" style="color:red"></p>
  </div>
</div>

<!-- ================= HOME ================= -->
<div id="home">
  <div class="topbar">
    <span>🏠 DANMETOPIA HOME</span>
    <button onclick="logout()">Đăng xuất</button>
  </div>

  <h3>📚 Trang chủ truyện</h3>
</div>

<script>
/* ================= ROLE SYSTEM ================= */

const ADMIN_EMAILS = [
  "pydanmeii@gmail.com",
  "pepyl4298@gmail.com"
];

function getUser() {
  return JSON.parse(localStorage.getItem("user") || "{}");
}

/* ================= WARNING ================= */
function enter() {
  document.getElementById("warning").style.display = "none";
  document.getElementById("loginPage").style.display = "flex";
}

function leave() {
  document.body.innerHTML = "<h2 style='color:white;text-align:center;margin-top:100px'>Đã thoát</h2>";
}

/* ================= LOGIN ================= */
function login() {
  const mainPass = document.getElementById("mainPass").value;
  const email = document.getElementById("email").value;
  const nickname = document.getElementById("nickname").value;

  if (mainPass !== "danmei") {
    document.getElementById("msg").innerText = "Sai mật khẩu chính";
    return;
  }

  let role = "guest";
  let displayName = "Ẩn danh";

  if (email) {
    if (ADMIN_EMAILS.includes(email)) {
      role = "admin";
      displayName = "ADMIN - " + (nickname || email);
    } else {
      role = "user";
      displayName = nickname || email.split("@")[0];
    }
  }

  localStorage.setItem("user", JSON.stringify({
    email,
    role,
    displayName
  }));

  showHome();
}

/* ================= HOME ================= */
function showHome() {
  document.getElementById("warning").style.display = "none";
  document.getElementById("loginPage").style.display = "none";
  document.getElementById("home").style.display = "block";

  const user = getUser();

  console.log("LOGIN:", user);
}

/* ================= LOGOUT ================= */
function logout() {
  localStorage.removeItem("user");
  location.reload();
}

/* ================= AUTO LOGIN ================= */
if (getUser().role) {
  showHome();
}
</script>

</body>
</html>
