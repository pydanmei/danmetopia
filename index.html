<!DOCTYPE html>
<html>

<head>
  <title>DANMETOPIA - Đọc Truyện</title>
  <meta charset="utf-8">

  <style>
    body{
      margin:0;
      background:#0f0f0f;
      color:white;
      font-family:Arial;
    }

    #warning{
      position:fixed;
      inset:0;
      background:black;
      display:flex;
      justify-content:center;
      align-items:center;
      z-index:999;
    }

    .box{
      background:#1c1c1c;
      padding:20px;
      border-radius:12px;
      width:320px;
      text-align:center;
    }

    button{
      width:100%;
      padding:10px;
      margin-top:10px;
      border:none;
      border-radius:8px;
      cursor:pointer;
      font-weight:bold;
    }

    .green{background:#00dc64;color:black;}
    .red{background:#ff4444;color:white;}

    #login{
      display:none;
      height:100vh;
      justify-content:center;
      align-items:center;
    }

    input{
      width:100%;
      padding:10px;
      margin-top:8px;
      border:none;
      border-radius:8px;
      background:#2a2a2a;
      color:white;
    }

    hr{
      border:0;
      border-top:1px solid #333;
      margin:15px 0;
    }

    .title{
      font-size:20px;
      font-weight:bold;
      margin-bottom:10px;
    }

    .sub{
      font-size:12px;
      color:#aaa;
      margin-bottom:10px;
    }

  </style>
</head>

<body>

<!-- ⚠️ WARNING -->
<div id="warning">
  <div class="box">
    <h2>⚠️ CẢNH BÁO 18+</h2>

    <p style="font-size:14px;line-height:1.5">
      Đây là trang truyện có nội dung 18+.<br>
      Xác nhận đủ 18 tuổi khi tiếp tục.
    </p>

    <button class="green" onclick="enter()">TIẾP TỤC</button>
    <button class="red" onclick="leave()">THOÁT</button>
  </div>
</div>

<!-- LOGIN -->
<div id="login">

  <div class="box">

    <div class="title">DANMETOPIA</div>
    <div class="sub">Nền tảng đọc truyện</div>

    <input id="email" placeholder="Email (không bắt buộc)">
    <input id="pass" type="password" placeholder="Mật khẩu (danmei)">

    <button class="green" onclick="login()">ĐĂNG NHẬP</button>

    <hr>

    <div class="title">ĐĂNG KÝ NHÓM DỊCH</div>

    <input id="groupName" placeholder="Tên nhóm dịch">
    <input id="displayName" placeholder="Tên hiển thị">

    <button onclick="registerGroup()" style="background:#ffcc00;">
      TẠO NHÓM
    </button>

    <p id="msg" style="color:red"></p>

  </div>

</div>

<script type="module">

import { loginApp } from "./auth.js";

/* ================= WARNING ================= */
window.enter = ()=>{
  document.getElementById("warning").style.display="none";
  document.getElementById("login").style.display="flex";
}

window.leave = ()=>{
  document.body.innerHTML="<h2 style='color:white;text-align:center;margin-top:100px'>Đã thoát</h2>";
}

/* ================= LOGIN ================= */
window.login = async ()=>{

  const email = document.getElementById("email").value || "user@danmei.com";
  const pass = document.getElementById("pass").value;

  if(pass !== "danmei"){
    document.getElementById("msg").innerText="Sai mật khẩu";
    return;
  }

  await loginApp(email, pass);

  localStorage.setItem("email", email);

  window.location.href="home.html";
}

/* ================= GROUP ================= */
window.registerGroup = ()=>{

  const groupName = document.getElementById("groupName").value;
  const displayName = document.getElementById("displayName").value;

  if(!groupName){
    document.getElementById("msg").innerText="Vui lòng nhập tên nhóm";
    return;
  }

  localStorage.setItem("groupName", groupName);
  localStorage.setItem("displayName", displayName);

  document.getElementById("msg").innerText="Đã tạo nhóm thành công!";
}

</script>

</body>
</html>
