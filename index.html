<!DOCTYPE html>
<html>

<head>
<meta charset="utf-8">
<title>DANMETOPIA</title>

<style>
body{
  margin:0;
  background:#0f0f0f;
  color:white;
  font-family:Arial;
}

#warning{
  position:fixed;
  inset:0;
  background:black;
  display:flex;
  justify-content:center;
  align-items:center;
}

.box{
  background:#1c1c1c;
  padding:20px;
  width:320px;
  border-radius:12px;
  text-align:center;
}

button{
  width:100%;
  padding:10px;
  margin-top:10px;
  border:none;
  border-radius:8px;
  cursor:pointer;
  font-weight:bold;
}

.green{background:#00dc64;color:black;}
.red{background:#ff4444;color:white;}

#login{
  display:none;
  height:100vh;
  justify-content:center;
  align-items:center;
}

input{
  width:100%;
  padding:10px;
  margin-top:8px;
  border:none;
  border-radius:8px;
  background:#2a2a2a;
  color:white;
}
</style>

</head>

<body>

<!-- WARNING -->
<div id="warning">
  <div class="box">
    <h2>⚠️ CẢNH BÁO 18+</h2>

    <p>Xác nhận đủ 18 tuổi khi tiếp tục.</p>

    <button class="green" onclick="enter()">TRUY CẬP</button>
    <button class="red" onclick="leave()">THOÁT</button>
  </div>
</div>

<!-- LOGIN -->
<div id="login">
  <div class="box">

    <h2>ĐĂNG NHẬP</h2>

    <input id="email" placeholder="Email">
    <input id="pass" type="password" placeholder="Mật khẩu (danmei)">

    <button class="green" onclick="login()">ĐĂNG NHẬP</button>

    <p id="msg" style="color:red"></p>

  </div>
</div>

<script>

/* ================= SAFE STATE ================= */
let firebaseReady = false;

/* ================= WARNING ================= */
function enter(){
  document.getElementById("warning").style.display="none";
  document.getElementById("login").style.display="flex";
}

function leave(){
  document.body.innerHTML="<h2 style='color:white;text-align:center;margin-top:100px'>Đã thoát</h2>";
}

/* ================= SIMPLE LOGIN (NO CRASH) ================= */
function login(){

  const pass = document.getElementById("pass").value;

  if(pass !== "danmei"){
    document.getElementById("msg").innerText="Sai mật khẩu";
    return;
  }

  // SAFE: không phụ thuộc firebase → tránh chết web
  localStorage.setItem("login","ok");

  alert("Đăng nhập thành công");

  window.location.href="home.html";
}

/* ================= OPTIONAL FIREBASE LOAD LATER ================= */
try{
  // nếu sau này bạn muốn gắn firebase thì thêm vào đây
  console.log("System OK");
}catch(e){
  console.log("Firebase not loaded - safe mode");
}

</script>

</body>
</html>
