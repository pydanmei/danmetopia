<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>DANMETOPIA - Quản lý nhóm dịch</title>
<meta name="theme-color" content="#FF69B4">
<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
  background: #0f0f0f;
  color: #e0e0e0;
}
.loading-spinner {
  display: inline-block;
  width: 40px;
  height: 40px;
  border: 3px solid #333;
  border-top-color: #FF69B4;
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
}
@keyframes spin {
  to { transform: rotate(360deg); }
}
.spinner-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.7);
  display: flex;
  justify-content: center;
  align-items: center;
  z-index: 20000;
}
.topbar {
  background: #FF69B4;
  color: black;
  padding: 12px 20px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  position: sticky;
  top: 0;
  z-index: 100;
  flex-wrap: wrap;
  gap: 10px;
}
.logo {
  font-size: 22px;
  font-weight: bold;
  cursor: pointer;
  text-decoration: none;
  color: black;
}
.user-area {
  display: flex;
  gap: 12px;
  align-items: center;
  flex-wrap: wrap;
}
.user-area button, .nav-btn {
  background: rgba(0,0,0,0.2);
  border: none;
  padding: 6px 14px;
  border-radius: 30px;
  cursor: pointer;
  font-weight: bold;
  color: black;
  transition: background 0.2s;
}
.user-area button:hover, .nav-btn:hover {
  background: rgba(0,0,0,0.4);
}
.nav-link {
  background: rgba(0,0,0,0.2);
  border: none;
  padding: 6px 14px;
  border-radius: 30px;
  cursor: pointer;
  font-weight: bold;
  color: black;
  text-decoration: none;
  transition: background 0.2s;
}
.nav-link:hover {
  background: rgba(0,0,0,0.4);
}
.container {
  max-width: 1200px;
  margin: 0 auto;
  padding: 20px;
}
h1 {
  color: #FF69B4;
  margin-bottom: 20px;
}
.groups-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
  gap: 20px;
  margin-top: 20px;
}
.group-card {
  background: #1c1c1c;
  border-radius: 16px;
  padding: 20px;
  border: 1px solid #333;
  transition: transform 0.2s;
  cursor: pointer;
}
.group-card:hover {
  transform: translateY(-3px);
  border-color: #FF69B4;
}
.group-name {
  font-size: 20px;
  font-weight: bold;
  color: #FF69B4;
  margin-bottom: 10px;
}
.group-desc {
  color: #aaa;
  font-size: 14px;
  margin-bottom: 10px;
}
.group-meta {
  font-size: 12px;
  color: #888;
  margin-top: 10px;
}
.modal {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.9);
  justify-content: center;
  align-items: center;
  z-index: 10002;
}
.modal-content {
  background: #1c1c1c;
  width: 90%;
  max-width: 500px;
  max-height: 90vh;
  overflow-y: auto;
  padding: 25px;
  border-radius: 24px;
  position: relative;
  border: 1px solid #FF69B4;
}
.modal-content h2, .modal-content h3 {
  color: #FF69B4;
  margin-bottom: 20px;
}
.modal-content input, .modal-content textarea, .modal-content select {
  width: 100%;
  padding: 12px;
  margin-bottom: 12px;
  background: #2a2a2a;
  border: none;
  border-radius: 12px;
  color: white;
}
.modal-content textarea {
  height: 100px;
  resize: vertical;
}
.modal-content button {
  padding: 10px 20px;
  background: #FF69B4;
  border: none;
  border-radius: 30px;
  font-weight: bold;
  cursor: pointer;
  color: black;
  margin-right: 10px;
}
.modal-content button:hover {
  background: #FF1493;
  color: white;
}
.close-modal {
  position: absolute;
  top: 15px;
  right: 20px;
  font-size: 28px;
  cursor: pointer;
  color: #aaa;
}
.close-modal:hover {
  color: #FF69B4;
}
.notification {
  position: fixed;
  bottom: 20px;
  right: 20px;
  background: #FF69B4;
  color: black;
  padding: 12px 20px;
  border-radius: 40px;
  font-weight: bold;
  z-index: 1000;
  animation: slideIn 0.3s ease;
}
@keyframes slideIn {
  from { transform: translateX(100%); opacity: 0; }
  to { transform: translateX(0); opacity: 1; }
}
.btn-pink {
  background: #FF69B4;
  color: black;
  border: none;
  padding: 10px 20px;
  border-radius: 30px;
  cursor: pointer;
  font-weight: bold;
}
.btn-red {
  background: #ff4444;
  color: white;
}
.member-list {
  max-height: 300px;
  overflow-y: auto;
  margin: 15px 0;
}
.member-item {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 10px;
  background: #2a2a2a;
  border-radius: 8px;
  margin-bottom: 8px;
}
.member-email {
  font-size: 13px;
  color: #aaa;
}
.btn-small {
  padding: 4px 12px;
  font-size: 12px;
}
.stories-list {
  max-height: 200px;
  overflow-y: auto;
  margin: 15px 0;
}
.story-item {
  padding: 8px;
  background: #2a2a2a;
  border-radius: 8px;
  margin-bottom: 8px;
  cursor: pointer;
}
.story-item:hover {
  background: #FF69B4;
  color: black;
}
.admin-badge {
  background: #FF1493;
  color: white;
  padding: 2px 8px;
  border-radius: 12px;
  font-size: 11px;
  margin-left: 8px;
}
</style>
</head>
<body>

<div class="topbar">
  <a href="index.html" class="logo">🌸 DANMETOPIA</a>
  <div class="user-area">
    <span id="userDisplay">👤 Đang tải...</span>
    <button id="createGroupBtn" class="nav-btn" style="display:none">➕ Tạo nhóm</button>
    <a href="index.html" class="nav-link">🏠 Trang chủ</a>
    <a href="admin.html" id="adminLink" style="display:none" class="nav-link admin-link">👑 Admin</a>
    <button id="logoutBtn" style="display:none">🚪 Đăng xuất</button>
  </div>
</div>

<div class="container">
  <h1>📚 Nhóm dịch</h1>
  <div class="groups-grid" id="groupsGrid">
    <div style="text-align:center; padding:50px;"><div class="loading-spinner"></div><p>Đang tải nhóm...</p></div>
  </div>
</div>

<!-- MODAL TẠO/CHỈNH SỬA NHÓM -->
<div id="groupFormModal" class="modal">
  <div class="modal-content">
    <span class="close-modal" onclick="closeModal('groupFormModal')">&times;</span>
    <h2 id="groupFormTitle">📚 TẠO NHÓM MỚI</h2>
    <input type="text" id="groupName" placeholder="Tên nhóm *">
    <textarea id="groupDesc" placeholder="Mô tả nhóm"></textarea>
    <input type="hidden" id="editingGroupId">
    <button id="saveGroupBtn">LƯU</button>
  </div>
</div>

<!-- MODAL CHI TIẾT NHÓM -->
<div id="groupDetailModal" class="modal">
  <div class="modal-content" style="max-width: 600px;">
    <span class="close-modal" onclick="closeModal('groupDetailModal')">&times;</span>
    <div id="groupDetailContent"></div>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
import { getAuth, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
import { getDatabase, ref, get, set, update, remove, push, onValue, off } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyCDQk9DlMNKwn_508fDMI_3IB_dgpgHujA",
  authDomain: "danmetopia.firebaseapp.com",
  projectId: "danmetopia",
  databaseURL: "https://danmetopia-default-rtdb.asia-southeast1.firebasedatabase.app/",
  storageBucket: "danmetopia.appspot.com",
  messagingSenderId: "178240377870",
  appId: "1:178240377870:web:d094b222ebabadccc5585f"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getDatabase(app);

let currentUserData = null;
let allGroups = [];
let groupsUnsubscribe = null;

const ADMIN_EMAILS = ["pydanmeii@gmail.com", "pepyl4298@gmail.com", "maihuong4298@gmail.com"];

function showNotification(msg, isError = false) {
  const notif = document.createElement("div");
  notif.className = "notification";
  notif.style.background = isError ? "#ff4444" : "#FF69B4";
  notif.style.color = "black";
  notif.innerText = msg;
  document.body.appendChild(notif);
  setTimeout(() => notif.remove(), 3000);
}

function escapeHtml(str) {
  if (!str) return "";
  return str.replace(/[&<>]/g, m => m === "&" ? "&amp;" : m === "<" ? "&lt;" : "&gt;");
}

function generateRandomGuestName() {
  return `Hủ nằm vùng ${Math.floor(Math.random() * 10000)}`;
}

function isAdmin(userData) { return userData?.role === "admin"; }
function isModerator(userData) { return userData?.role === "user" && userData?.privileges?.moderator === true; }
function canModerate(userData) { return isAdmin(userData) || isModerator(userData); }

async function getUserData(uid) {
  const snap = await get(ref(db, `users/${uid}`));
  return snap.exists() ? snap.val() : null;
}

async function getDisplayName(uid, email, userData) {
  if (!userData) userData = await getUserData(uid);
  if (!userData) return generateRandomGuestName();
  const nickname = userData?.nickname || email?.split("@")[0] || "Người dùng";
  if (userData?.role === "admin") return `${nickname} (Admin)`;
  if (userData?.role === "user" && userData?.privileges?.moderator) return `${nickname} (Quản lý)`;
  if (userData?.role === "user" && userData?.privileges?.groupId) {
    const groupSnap = await get(ref(db, `groups/${userData.privileges.groupId}`));
    const groupName = groupSnap.exists() ? groupSnap.val().groupName : "Nhóm dịch";
    return `${nickname} (${groupName})`;
  }
  return nickname;
}

async function loadUserData(uid, email) {
  const userData = await getUserData(uid);
  const displayName = await getDisplayName(uid, email, userData);
  return {
    uid, email,
    role: userData?.role || "user",
    privileges: userData?.privileges || { moderator: false, groupId: null },
    nickname: userData?.nickname,
    displayName: displayName
  };
}

// Kiểm tra quyền chỉnh sửa nhóm (admin, moderator, hoặc chủ nhóm)
function canEditGroup(userData, group) {
  if (!userData || userData.role === "guest") return false;
  if (isAdmin(userData) || isModerator(userData)) return true;
  return group?.ownerId === userData.uid;
}

// Kiểm tra quyền xóa nhóm (chỉ admin)
function canDeleteGroup(userData) {
  return isAdmin(userData);
}

// Kiểm tra quyền quản lý thành viên (admin, moderator, hoặc chủ nhóm)
function canManageMembers(userData, group) {
  if (!userData || userData.role === "guest") return false;
  if (isAdmin(userData) || isModerator(userData)) return true;
  return group?.ownerId === userData.uid;
}

async function loadGroups() {
  if (groupsUnsubscribe) groupsUnsubscribe();
  const groupsRef = ref(db, 'groups');
  groupsUnsubscribe = onValue(groupsRef, (snapshot) => {
    const data = snapshot.val();
    allGroups = data ? Object.entries(data).map(([id, g]) => ({ id, ...g })) : [];
    renderGroups();
  });
}

async function renderGroups() {
  const grid = document.getElementById("groupsGrid");
  if (!grid) return;
  
  if (allGroups.length === 0) {
    grid.innerHTML = "<div style='text-align:center; padding:50px;'>📭 Chưa có nhóm dịch nào</div>";
    return;
  }
  
  grid.innerHTML = allGroups.map(group => `
    <div class="group-card" onclick="openGroupDetail('${group.id}')">
      <div class="group-name">${escapeHtml(group.groupName)}</div>
      <div class="group-desc">${escapeHtml(group.description) || "Chưa có mô tả"}</div>
      <div class="group-meta">👥 ${group.members?.length || 0} thành viên</div>
      <div class="group-meta">📅 ${new Date(group.createdAt).toLocaleDateString()}</div>
    </div>
  `).join("");
}

window.openGroupDetail = async (groupId) => {
  const group = allGroups.find(g => g.id === groupId);
  if (!group) return;
  
  // Lấy thông tin thành viên
  const members = [];
  if (group.members && group.members.length > 0) {
    for (const uid of group.members) {
      const userData = await getUserData(uid);
      if (userData) {
        members.push({ uid, email: userData.email, nickname: userData.nickname, isOwner: group.ownerId === uid });
      }
    }
  }
  
  // Lấy danh sách truyện của nhóm
  const storiesSnap = await get(ref(db, "stories"));
  const stories = storiesSnap.val() || {};
  const groupStories = Object.entries(stories)
    .filter(([_, s]) => s.groupId === groupId)
    .map(([id, s]) => ({ id, title: s.title, cover: s.cover }));
  
  const canEdit = canEditGroup(currentUserData, group);
  const canDelete = canDeleteGroup(currentUserData);
  const canManage = canManageMembers(currentUserData, group);
  
  document.getElementById("groupDetailContent").innerHTML = `
    <h2>${escapeHtml(group.groupName)}</h2>
    <p><strong>📝 Mô tả:</strong> ${escapeHtml(group.description) || "Chưa có mô tả"}</p>
    <p><strong>👑 Chủ nhóm:</strong> ${escapeHtml(members.find(m => m.isOwner)?.nickname || group.ownerId)}</p>
    <p><strong>📅 Ngày tạo:</strong> ${new Date(group.createdAt).toLocaleDateString()}</p>
    
    ${canEdit ? `
      <button onclick="editGroup('${groupId}')" class="btn-pink" style="margin-top:10px;">✏️ Chỉnh sửa nhóm</button>
    ` : ''}
    ${canDelete ? `
      <button onclick="deleteGroup('${groupId}')" class="btn-red" style="margin-top:10px;">🗑 Xóa nhóm</button>
    ` : ''}
    
    <h3 style="margin-top:20px;">👥 Thành viên (${members.length})</h3>
    <div class="member-list">
      ${members.map(m => `
        <div class="member-item">
          <div>
            <b>${escapeHtml(m.nickname || m.email)}</b>
            ${m.isOwner ? '<span class="admin-badge">Chủ nhóm</span>' : ''}
            <div class="member-email">${escapeHtml(m.email)}</div>
          </div>
          ${canManage && !m.isOwner ? `<button onclick="removeMember('${groupId}', '${m.uid}')" class="btn-small btn-red">Xóa</button>` : ''}
        </div>
      `).join("")}
    </div>
    
    ${canManage ? `
      <div style="margin-top:15px;">
        <h4>➕ Thêm thành viên</h4>
        <div style="display: flex; gap: 10px;">
          <input type="email" id="memberEmail" placeholder="Nhập email người dùng" style="flex:1;">
          <button onclick="addMember('${groupId}')" class="btn-pink">Thêm</button>
        </div>
      </div>
    ` : ''}
    
    <h3 style="margin-top:20px;">📚 Truyện của nhóm (${groupStories.length})</h3>
    <div class="stories-list">
      ${groupStories.map(s => `
        <div class="story-item" onclick="window.location.href='index.html?story=${s.id}'">
          <b>${escapeHtml(s.title)}</b>
        </div>
      `).join("")}
      ${groupStories.length === 0 ? '<p style="color:#888;">Chưa có truyện nào trong nhóm</p>' : ''}
    </div>
  `;
  document.getElementById("groupDetailModal").style.display = "flex";
};

window.editGroup = (groupId) => {
  const group = allGroups.find(g => g.id === groupId);
  if (!group) return;
  document.getElementById("groupFormTitle").innerText = "✏️ CHỈNH SỬA NHÓM";
  document.getElementById("groupName").value = group.groupName;
  document.getElementById("groupDesc").value = group.description || "";
  document.getElementById("editingGroupId").value = groupId;
  document.getElementById("groupFormModal").style.display = "flex";
};

window.saveGroup = async () => {
  const groupName = document.getElementById("groupName").value.trim();
  const groupDesc = document.getElementById("groupDesc").value;
  const editingId = document.getElementById("editingGroupId").value;
  
  if (!groupName) {
    showNotification("Nhập tên nhóm", true);
    return;
  }
  
  showLoading(true);
  try {
    if (editingId) {
      // Cập nhật nhóm
      await update(ref(db, `groups/${editingId}`), {
        groupName: groupName,
        description: groupDesc
      });
      showNotification("Đã cập nhật nhóm");
    } else {
      // Tạo nhóm mới
      const groupsRef = ref(db, 'groups');
      const newGroupRef = push(groupsRef);
      await set(newGroupRef, {
        groupName: groupName,
        description: groupDesc,
        ownerId: currentUserData.uid,
        members: [currentUserData.uid],
        createdAt: Date.now()
      });
      showNotification("✅ Tạo nhóm thành công");
    }
    closeModal("groupFormModal");
    document.getElementById("groupName").value = "";
    document.getElementById("groupDesc").value = "";
    document.getElementById("editingGroupId").value = "";
  } catch (err) {
    showNotification("Lỗi: " + err.message, true);
  } finally {
    showLoading(false);
  }
};

window.deleteGroup = async (groupId) => {
  if (!confirm("Bạn có chắc chắn muốn xóa nhóm này? Hành động này không thể hoàn tác!")) return;
  
  showLoading(true);
  try {
    // Xóa groupId khỏi tất cả user trong nhóm
    const group = allGroups.find(g => g.id === groupId);
    if (group && group.members) {
      for (const uid of group.members) {
        const userRef = ref(db, `users/${uid}/privileges/groupId`);
        const currentGroupId = await get(userRef);
        if (currentGroupId.val() === groupId) {
          await set(userRef, null);
        }
      }
    }
    // Xóa nhóm
    await remove(ref(db, `groups/${groupId}`));
    showNotification("Đã xóa nhóm");
    closeModal("groupDetailModal");
  } catch (err) {
    showNotification("Lỗi: " + err.message, true);
  } finally {
    showLoading(false);
  }
};

window.addMember = async (groupId) => {
  const email = document.getElementById("memberEmail").value.trim();
  if (!email) {
    showNotification("Nhập email", true);
    return;
  }
  
  showLoading(true);
  try {
    // Tìm user theo email
    const usersSnap = await get(ref(db, "users"));
    const users = usersSnap.val() || {};
    let targetUid = null;
    for (const uid in users) {
      if (users[uid].email === email) {
        targetUid = uid;
        break;
      }
    }
    
    if (!targetUid) {
      showNotification("Không tìm thấy người dùng với email này", true);
      return;
    }
    
    // Thêm vào danh sách thành viên
    const groupRef = ref(db, `groups/${groupId}`);
    const groupSnap = await get(groupRef);
    const group = groupSnap.val();
    const members = group.members || [];
    if (!members.includes(targetUid)) {
      members.push(targetUid);
      await update(groupRef, { members: members });
      showNotification("Đã thêm thành viên");
      document.getElementById("memberEmail").value = "";
      openGroupDetail(groupId);
    } else {
      showNotification("Người dùng đã là thành viên của nhóm", true);
    }
  } catch (err) {
    showNotification("Lỗi: " + err.message, true);
  } finally {
    showLoading(false);
  }
};

window.removeMember = async (groupId, memberUid) => {
  if (!confirm("Xóa thành viên này khỏi nhóm?")) return;
  
  showLoading(true);
  try {
    const groupRef = ref(db, `groups/${groupId}`);
    const groupSnap = await get(groupRef);
    const group = groupSnap.val();
    let members = group.members || [];
    members = members.filter(uid => uid !== memberUid);
    await update(groupRef, { members: members });
    
    // Nếu là chủ nhóm, chuyển quyền? (giữ nguyên, không xóa)
    // Xóa groupId khỏi user
    const userRef = ref(db, `users/${memberUid}/privileges/groupId`);
    const currentGroupId = await get(userRef);
    if (currentGroupId.val() === groupId) {
      await set(userRef, null);
    }
    
    showNotification("Đã xóa thành viên");
    openGroupDetail(groupId);
  } catch (err) {
    showNotification("Lỗi: " + err.message, true);
  } finally {
    showLoading(false);
  }
};

function closeModal(modalId) {
  document.getElementById(modalId).style.display = "none";
}
window.closeModal = closeModal;

let loadingSpinner = null;
function showLoading(show) {
  if (show) {
    if (!loadingSpinner) {
      loadingSpinner = document.createElement("div");
      loadingSpinner.id = "globalSpinner";
      loadingSpinner.className = "spinner-overlay";
      loadingSpinner.innerHTML = '<div class="loading-spinner"></div>';
      document.body.appendChild(loadingSpinner);
    }
    loadingSpinner.style.display = "flex";
  } else {
    if (loadingSpinner) loadingSpinner.style.display = "none";
  }
}

async function updateUserDisplay() {
  const userDisplay = document.getElementById("userDisplay");
  const createGroupBtn = document.getElementById("createGroupBtn");
  const adminLink = document.getElementById("adminLink");
  
  if (!userDisplay) return;
  
  const session = localStorage.getItem("userSession");
  if (!session) {
    userDisplay.innerHTML = "👤 Chưa đăng nhập";
    if (createGroupBtn) createGroupBtn.style.display = "none";
    if (adminLink) adminLink.style.display = "none";
    return;
  }
  
  try {
    const data = JSON.parse(session);
    if (data.role === "guest") {
      userDisplay.innerHTML = `👤 ${escapeHtml(data.displayName || "Khách")}`;
      if (createGroupBtn) createGroupBtn.style.display = "none";
      if (adminLink) adminLink.style.display = "none";
    } else {
      currentUserData = data;
      userDisplay.innerHTML = `👤 ${escapeHtml(data.displayName)}`;
      if (createGroupBtn) createGroupBtn.style.display = "inline-block";
      if (adminLink) adminLink.style.display = canModerate(data) ? "inline-block" : "none";
    }
  } catch(e) {
    userDisplay.innerHTML = "👤 Khách";
  }
}

async function logout() {
  await signOut(auth);
  localStorage.removeItem("userSession");
  window.location.href = "index.html";
}

async function init() {
  await updateUserDisplay();
  loadGroups();
  
  document.getElementById("createGroupBtn")?.addEventListener("click", () => {
    document.getElementById("groupFormTitle").innerText = "📚 TẠO NHÓM MỚI";
    document.getElementById("groupName").value = "";
    document.getElementById("groupDesc").value = "";
    document.getElementById("editingGroupId").value = "";
    document.getElementById("groupFormModal").style.display = "flex";
  });
  document.getElementById("saveGroupBtn")?.addEventListener("click", saveGroup);
  document.getElementById("logoutBtn")?.addEventListener("click", logout);
}

// Kiểm tra session khi load
const session = localStorage.getItem("userSession");
if (!session) {
  window.location.href = "index.html";
} else {
  init();
}

onAuthStateChanged(auth, async (user) => {
  if (!user && !localStorage.getItem("userSession")) {
    window.location.href = "index.html";
  }
});
</script>
</body>
