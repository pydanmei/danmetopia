<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>🌸 DANMETOPIA - Quản lý nhóm 🌸</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="mainContainer">
    <div id="header-placeholder"></div>
    
    <div class="groups-panel" style="padding: 20px;">
      <h2>📚 Quản lý nhóm dịch</h2>
      
      <div class="my-groups">
        <h3>📖 Nhóm của tôi</h3>
        <div id="myGroupsList"></div>
      </div>
      
      <div class="all-groups" style="margin-top: 30px;">
        <h3>🌐 Tất cả nhóm</h3>
        <div id="allGroupsList"></div>
      </div>
    </div>
    
    <div id="footer-placeholder"></div>
  </div>
  
  <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
  <script type="module">
    import { initFirebase, db, ref, get, update, push, set } from './js/db.js';
    import { initAuth, restoreSession, currentUserData } from './js/auth.js';
    import { escapeHtml, showNotification, getUserGroups } from './js/utils.js';
    import { initUI } from './js/ui.js';
    
    initFirebase();
    emailjs.init("fPq8fpw1OqzOtj-lk");
    
    async function loadGroups() {
      if (!currentUserData) return;
      
      const groupsSnap = await get(ref(db, 'groups'));
      const allGroups = groupsSnap.val() || {};
      
      const userGroups = await getUserGroups(currentUserData.uid);
      const myGroupsDiv = document.getElementById('myGroupsList');
      if (userGroups.length === 0) {
        myGroupsDiv.innerHTML = '<p>Bạn chưa tham gia nhóm nào</p>';
      } else {
        myGroupsDiv.innerHTML = userGroups.map(group => `
          <div class="group-card" style="background:#2a2a2a; margin:10px 0; padding:15px; border-radius:12px;">
            <strong>${escapeHtml(group.groupName)}</strong>
            <p>${escapeHtml(group.description) || 'Chưa có mô tả'}</p>
            ${group.ownerId === currentUserData.uid ? '<span style="color:#FF69B4;">👑 Chủ nhóm</span>' : ''}
          </div>
        `).join('');
      }
      
      const allGroupsDiv = document.getElementById('allGroupsList');
      const allGroupsArray = Object.entries(allGroups).map(([id, g]) => ({ id, ...g }));
      allGroupsDiv.innerHTML = allGroupsArray.map(group => `
        <div class="group-card" style="background:#2a2a2a; margin:10px 0; padding:15px; border-radius:12px;">
          <strong>${escapeHtml(group.groupName)}</strong>
          <p>${escapeHtml(group.description) || 'Chưa có mô tả'}</p>
          <div style="font-size:12px; color:#888;">Thành viên: ${group.members?.length || 0}</div>
          <button onclick="requestJoinGroup('${group.id}')" class="btn-pink" style="margin-top:10px;">➕ Tham gia</button>
        </div>
      `).join('');
    }
    
    window.requestJoinGroup = async (groupId) => {
      showNotification('Chức năng đang phát triển');
    };
    
    async function loadComponents() {
      const headerRes = await fetch('components/header.html');
      const headerHtml = await headerRes.text();
      document.getElementById('header-placeholder').innerHTML = headerHtml;
      
      const footerRes = await fetch('components/footer.html');
      const footerHtml = await footerRes.text();
      document.getElementById('footer-placeholder').innerHTML = footerHtml;
      
      document.getElementById('homeLogo')?.addEventListener('click', () => window.location.href = 'index.html');
    }
    
    const restored = await restoreSession();
    if (!restored) {
      window.location.href = 'index.html';
    } else {
      await loadComponents();
      initUI();
      await loadGroups();
    }
  </script>
</body>
</html>
