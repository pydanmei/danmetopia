<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>🌸 DANMETOPIA - Đọc truyện</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="readerContainer">
    <div class="reader-page" id="readerContent"></div>
  </div>
  
  <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
  <script type="module">
    import { initFirebase, db, ref, get, onValue } from './js/db.js';
    import { restoreSession, currentUserData, refreshUserSession } from './js/auth.js';
    import { escapeHtml, loadImageWithSkeleton } from './js/utils.js';
    import { allStories, loadStoriesRealtime } from './js/data.js';
    
    initFirebase();
    emailjs.init("fPq8fpw1OqzOtj-lk");
    
    const urlParams = new URLSearchParams(window.location.search);
    const storyId = urlParams.get('id');
    const chapterIndex = parseInt(urlParams.get('chapter') || '0');
    
    let currentChapters = [];
    let currentChapterIndex = chapterIndex;
    
    async function initReader() {
      await restoreSession();
      await loadStoriesRealtime();
      
      // Wait for stories to load
      setTimeout(async () => {
        const story = allStories.find(s => s.id === storyId);
        if (!story) {
          document.getElementById('readerContent').innerHTML = '<p>Không tìm thấy truyện</p>';
          return;
        }
        
        const chaptersRef = ref(db, `chapters/${storyId}`);
        onValue(chaptersRef, (snapshot) => {
          const data = snapshot.val();
          if (data) {
            currentChapters = Object.entries(data).map(([id, value]) => ({ id, ...value }));
            currentChapters.sort((a, b) => (a.chapterNumber || 0) - (b.chapterNumber || 0));
            renderChapter();
          }
        });
      }, 500);
    }
    
    function renderChapter() {
      if (!currentChapters[currentChapterIndex]) return;
      const chap = currentChapters[currentChapterIndex];
      const readerDiv = document.getElementById("readerContent");
      
      readerDiv.innerHTML = `
        <div class="chapter-nav">
          <button onclick="window.location.href='index.html'">🏠 Về trang chủ</button>
          <h3>${escapeHtml(chap.title)}</h3>
          <div></div>
        </div>
        ${chap.pages?.map(page => `<img class="reader-image" src="${escapeHtml(page)}" loading="lazy" onerror="this.src='https://placehold.co/800x1200?text=Error'">`).join("")}
      `;
    }
    
    initReader();
  </script>
</body>
</html>
