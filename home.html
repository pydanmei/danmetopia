<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8">
  <title>Trang chủ - DanmeTopia</title>

  <style>
    body{
      margin:0;
      background:#0f0f0f;
      color:white;
      font-family:Arial;
    }

    .topbar{
      background:#00dc64;
      color:black;
      padding:15px;
      font-size:20px;
      font-weight:bold;
    }

    .grid{
      display:grid;
      grid-template-columns:repeat(auto-fill,minmax(160px,1fr));
      gap:15px;
      padding:15px;
    }

    .card{
      background:#1c1c1c;
      border-radius:10px;
      overflow:hidden;
      cursor:pointer;
      transition:0.2s;
    }

    .card:hover{
      transform:scale(1.03);
    }

    img{
      width:100%;
      height:220px;
      object-fit:cover;
    }

    .info{
      padding:10px;
    }

    .tag{
      font-size:12px;
      background:#00dc64;
      color:black;
      padding:3px 6px;
      border-radius:5px;
      display:inline-block;
      margin-top:5px;
    }
  </style>
</head>

<body>

<div class="topbar">
📚 DANMETOPIA - TRANG CHỦ
</div>

<div class="grid" id="list"></div>

<script>

const stories = [
  {
    id:1,
    title:"Huyết Tộc Ma Cà Rồng",
    genre:"Hành động",
    cover:"https://via.placeholder.com/300x400"
  },
  {
    id:2,
    title:"Tình Yêu Học Đường",
    genre:"Romance",
    cover:"https://via.placeholder.com/300x400"
  }
];

const list = document.getElementById("list");

list.innerHTML = stories.map(s=>`
  <div class="card" onclick="openStory(${s.id})">
    <img src="${s.cover}">
    <div class="info">
      <b>${s.title}</b><br>
      <span class="tag">${s.genre}</span>
    </div>
  </div>
`).join("");

function openStory(id){
  window.location.href="read.html?id="+id;
}

</script>

</body>
</html>
