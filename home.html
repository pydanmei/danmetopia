<!DOCTYPE html>
<html>

<body style="margin:0;background:#0f0f0f;color:white;font-family:Arial">

<div style="background:#00dc64;color:black;padding:15px;font-weight:bold;display:flex;justify-content:space-between">
  DANMETOPIA
  <button onclick="location.href='upload.html'">UPLOAD</button>
</div>

<div id="list" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px;padding:10px"></div>

<script>

const role = localStorage.getItem("role");

function load(){

  const stories = JSON.parse(localStorage.getItem("stories") || "[]");

  document.getElementById("list").innerHTML =
  stories.map(s=>`
    <div onclick="openR(${s.id})"
      style="background:#1c1c1c;border-radius:10px;overflow:hidden;cursor:pointer">

      <img src="https://picsum.photos/300/400?${s.id}"
        style="width:100%;height:220px;object-fit:cover">

      <div style="padding:10px">
        <b>${s.title}</b><br>
        <small>${s.genre}</small><br>
        <small style="color:#00dc64">${s.owner}</small>
      </div>

    </div>
  `).join("");

}

load();

function openR(id){
  location.href="read.html?id="+id;
}

</script>

</body>
</html>
