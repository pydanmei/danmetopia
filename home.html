<!DOCTYPE html>
<html>

<head>
<meta charset="utf-8">
<title>Trang chủ</title>

<style>
body{
  margin:0;
  background:#0f0f0f;
  color:white;
  font-family:Arial;
}

.topbar{
  background:#00dc64;
  color:black;
  padding:15px;
  font-size:20px;
  font-weight:bold;
}

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(180px,1fr));
  gap:15px;
  padding:15px;
}

.card{
  background:#1c1c1c;
  border-radius:10px;
  overflow:hidden;
  cursor:pointer;
}

.card:hover{
  transform:scale(1.03);
}

.info{
  padding:10px;
}

.tag{
  font-size:12px;
  background:#00dc64;
  color:black;
  padding:3px 6px;
  border-radius:5px;
  margin-right:5px;
}

button{
  padding:5px;
  margin-top:5px;
  width:100%;
}
</style>

</head>

<body>

<div class="topbar">
📚 DANMETOPIA - TRANG CHỦ
</div>

<div class="grid" id="list"></div>

<script type="module">

import { stories } from "./data.js";

const list = document.getElementById("list");

list.innerHTML = stories.map(s=>`
  <div class="card">
    <div class="info">
      <h3>${s.title}</h3>
      <small>${s.author}</small><br>

      ${s.tags.map(t=>`<span class="tag">${t}</span>`).join("")}

      <p>❤️ ${s.likes}</p>

      <button onclick="openStory(${s.id})">Đọc truyện</button>
    </div>
  </div>
`).join("");

window.openStory = (id)=>{
  window.location.href="read.html?id="+id;
}

</script>

</body>
</html>
