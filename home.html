<!DOCTYPE html>
<html>

<head>
  <title>DANMETOPIA</title>

  <style>

    body{
      margin:0;
      background:#0f0f0f;
      font-family:Arial;
      color:white;
    }

    .topbar{
      background:#00dc64;
      padding:15px;
      font-size:28px;
      font-weight:bold;
      color:black;
      position:sticky;
      top:0;
    }

    .grid{
      display:grid;
      grid-template-columns:repeat(auto-fill,minmax(200px,1fr));
      gap:20px;
      padding:20px;
    }

    .card{
      background:#1c1c1c;
      border-radius:15px;
      overflow:hidden;
      cursor:pointer;
      transition:0.2s;
    }

    .card:hover{
      transform:scale(1.03);
    }

    .cover{
      width:100%;
      height:280px;
      object-fit:cover;
    }

    .info{
      padding:10px;
    }

    .genre{
      display:inline-block;
      background:#00dc64;
      color:black;
      padding:5px 10px;
      border-radius:20px;
      font-size:12px;
      margin-top:5px;
    }

  </style>
</head>

<body>

<div class="topbar">
DANMETOPIA
</div>

<div id="list" class="grid">
Loading...
</div>

<script>

fetch("http://localhost:3000/api/stories")
  .then(res => res.json())
  .then(data => {

    document.getElementById("list").innerHTML =
      data.map(s => `

        <div class="card" onclick="openStory(${s.id})">

          <img class="cover"
            src="${
              s.id == 1
              ? 'images/covers/nekomata.jpg'
              : 'images/covers/chomuc.jpg'
            }">

          <div class="info">

            <h2>${s.title}</h2>

            <div class="genre">${s.genre}</div>

          </div>

        </div>

      `).join("");

  });

function openStory(id){
  window.location.href = "story.html?id=" + id;
}

</script>

</body>
</html>
