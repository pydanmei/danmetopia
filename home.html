<!DOCTYPE html>
<html>

<head>
  <title>DANMETOPIA PRO SYSTEM</title>
  <meta charset="utf-8">
</head>

<body style="margin:0;background:#0f0f0f;color:white;font-family:Arial">

<!-- TOP -->
<div style="background:#00dc64;color:black;padding:15px;display:flex;justify-content:space-between">
  <b>DANMETOPIA PRO</b>
  <button onclick="uploadStory()">UPLOAD</button>
</div>

<!-- LIST -->
<div id="list" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px;padding:10px"></div>

<!-- RECOMMEND -->
<div style="padding:10px">
  <h3>🔥 Recommended</h3>
  <div id="recommend"></div>
</div>

<script type="module">

/* ================= FIREBASE ================= */
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-app.js";
import {
  getFirestore,
  collection,
  addDoc,
  onSnapshot,
  updateDoc,
  doc,
  getDoc,
  query,
  where,
  getDocs,
  arrayUnion,
  increment
} from "https://www.gstatic.com/firebasejs/12.13.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyCDQk9DlMNKwn_508fDMI_3IB_dgpgHujA",
  authDomain: "danmetopia.firebaseapp.com",
  projectId: "danmetopia",
  storageBucket: "danmetopia.appspot.com",
  messagingSenderId: "178240377870",
  appId: "1:178240377870:web:d094b222ebabadccc5585f"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

/* ================= ROLE ================= */
const role = localStorage.getItem("role") || "user";
const group = localStorage.getItem("group") || "groupA";

/* ================= APPROVAL RULE ================= */
/*
status:
- pending (chờ duyệt)
- approved (đã duyệt)
*/

function canPublish(){
  return role === "admin" || role === "editor" || role === "group";
}

/* ================= UPLOAD STORY ================= */
window.uploadStory = async ()=>{

  if(!canPublish()){
    alert("NO PERMISSION");
    return;
  }

  await addDoc(collection(db,"stories"),{
    title:"New Story",
    genre:"Action",
    owner:group,
    status:"pending",   // 🔥 APPROVAL SYSTEM
    likes:0,
    comments:[]
  });

  alert("UPLOADED (WAITING APPROVAL)");
}

/* ================= LOAD STORIES ================= */
onSnapshot(collection(db,"stories"), (snap)=>{

  let html="";

  snap.forEach(d=>{
    const s = d.data();

    /* chỉ show approved hoặc admin */
    if(s.status !== "approved" && role !== "admin" && role !== "editor") return;

    html += `
      <div onclick="openStory('${d.id}')"
        style="background:#1c1c1c;margin:10px;padding:10px;border-radius:10px">

        <b>${s.title}</b><br>
        <small>${s.genre}</small><br>
        👤 ${s.owner}<br>

        ${s.status === "pending" ? "<span style='color:orange'>PENDING</span>" : ""}

      </div>
    `;
  });

  document.getElementById("list").innerHTML = html;

});

/* ================= OPEN ================= */
window.openStory = (id)=>{
  location.href="read.html?id="+id;
}

</script>

</body>
</html>
