<!DOCTYPE html>
<html>

<head>
  <title>HOME</title>
</head>

<body style="background:#111;color:white;font-family:Arial">

<h2>HOME</h2>

<div id="list"></div>

<script>

const stories = [
  {
    id: 1,
    title: "Neko Mata",
    genre: "Yaoi / Drama"
  },
  {
    id: 2,
    title: "Chó Mực",
    genre: "Romance"
  }
];

document.getElementById("list").innerHTML =
  stories.map(s => `
    <div onclick="openRead(${s.id})"
      style="padding:10px;margin:10px;background:#222;cursor:pointer">
      <b>${s.title}</b><br>
      <small>${s.genre}</small>
    </div>
  `).join("");

function openRead(id){
  window.location.href = "read.html?id=" + id;
}

</script>

</body>
</html>
