<!DOCTYPE html>
<html>

<head>
  <title>HOME</title>
</head>

<body style="background:#111;color:white;font-family:Arial">

<h2>HOME</h2>

<div id="list">Loading...</div>

<script>

// check login
const role = localStorage.getItem("role");
if(!role){
  window.location.href = "index.html";
}

// fake data (KHÔNG FETCH để tránh lỗi trắng)
const data = [
  {id:1,title:"Neko Mata",genre:"shounen ai"},
  {id:2,title:"Chó Mực",genre:"yaoi"}
];

document.getElementById("list").innerHTML =
  data.map(s=>`
    <div onclick="openStory(${s.id})"
      style="padding:10px;margin:10px;background:#222;cursor:pointer">
      ${s.title} - ${s.genre}
    </div>
  `).join("");

function openStory(id){
  window.location.href = "story.html?id="+id;
}

</script>

</body>
</html>
