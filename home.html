<!DOCTYPE html>
<html>

<head>
  <title>HOME</title>
</head>

<body style="margin:0;background:#0f0f0f;color:white;font-family:Arial">

<div style="background:#00dc64;color:black;padding:15px;font-weight:bold">DANMETOPIA</div>

<div id="list" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px;padding:10px"></div>

<script>

const stories = [
  {
    id:1,
    title:"Neko Mata",
    cover:"https://picsum.photos/300/400?1"
  },
  {
    id:2,
    title:"Dark Soul",
    cover:"https://picsum.photos/300/400?2"
  }
];

document.getElementById("list").innerHTML =
stories.map(s=>`
  <div onclick="openR(${s.id})" style="background:#1c1c1c;border-radius:10px;overflow:hidden;cursor:pointer">
    <img src="${s.cover}" style="width:100%;height:220px;object-fit:cover">
    <div style="padding:10px">${s.title}</div>
  </div>
`).join("");

function openR(id){
  location.href="read.html?id="+id;
}

</script>

</body>
</html>
