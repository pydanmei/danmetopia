<!DOCTYPE html>
<html>

<head>
<meta charset="utf-8">
<title>DANMETOPIA HOME</title>

<style>
body{
  margin:0;
  background:#0f0f0f;
  color:white;
  font-family:Arial;
}

/* TOP */
.topbar{
  background:#00dc64;
  color:black;
  padding:15px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

/* LOGIN PANEL */
#loginPanel{
  background:#1c1c1c;
  padding:15px;
  margin:10px;
  border-radius:10px;
}

/* LIST */
.container{
  padding:15px;
}

.card{
  background:#1c1c1c;
  padding:15px;
  margin-top:10px;
  border-radius:10px;
  cursor:pointer;
}

/* COMMENT */
.commentBox{
  margin-top:20px;
  background:#1c1c1c;
  padding:10px;
  border-radius:10px;
}

input{
  width:100%;
  padding:10px;
  margin-top:5px;
  border:none;
  border-radius:8px;
  background:#2a2a2a;
  color:white;
}

button{
  width:100%;
  padding:10px;
  margin-top:10px;
  border:none;
  border-radius:8px;
  cursor:pointer;
}

.green{background:#00dc64;color:black;}
.gray{background:#333;color:white;}
</style>

</head>

<body>

<!-- TOP -->
<div class="topbar">
  <div>🏠 DANMETOPIA</div>
  <div id="userInfo">Ẩn danh</div>
</div>

<!-- LOGIN AREA -->
<div id="loginPanel">

  <h3>🔐 Đăng nhập (tùy chọn)</h3>

  <input id="email" placeholder="Email">
  <input id="role" placeholder="role: admin / group / user">

  <button class="green" onclick="login()">Đăng nhập</button>

  <button class="gray" onclick="logout()">Đăng xuất</button>

</div>

<!-- LIST -->
<div class="container">

  <h3>📚 Danh sách truyện</h3>

  <div class="card">📖 Truyện 1</div>
  <div class="card">📖 Truyện 2</div>

  <!-- COMMENT -->
  <div class="commentBox">

    <h4>💬 Bình luận</h4>

    <input id="commentInput" placeholder="Viết bình luận...">

    <button class="green" onclick="comment()">Gửi</button>

    <div id="comments"></div>

  </div>

</div>

<script>

/* ================= USER STATE ================= */
let user = {
  email: null,
  role: "guest",
  group: null
};

/* ================= LOGIN ================= */
function login(){

  const email = document.getElementById("email").value;
  const role = document.getElementById("role").value || "user";

  user.email = email;
  user.role = role;

  localStorage.setItem("user", JSON.stringify(user));

  updateUI();
}

/* ================= LOGOUT ================= */
function logout(){
  localStorage.removeItem("user");
  user = {email:null, role:"guest"};
  updateUI();
}

/* ================= LOAD ================= */
function loadUser(){
  const data = localStorage.getItem("user");
  if(data){
    user = JSON.parse(data);
  }
}

/* ================= UI ================= */
function updateUI(){

  if(user.email){
    document.getElementById("userInfo").innerText =
      user.email + " (" + user.role + ")";
  }else{
    document.getElementById("userInfo").innerText = "Ẩn danh";
  }
}

/* ================= COMMENT ================= */
function comment(){

  const text = document.getElementById("commentInput").value;

  if(!text) return;

  let name = "Ẩn danh";

  if(user.email){
    name = user.email + " (" + user.role + ")";
  }

  const div = document.createElement("div");
  div.innerText = name + ": " + text;

  document.getElementById("comments").appendChild(div);

  document.getElementById("commentInput").value = "";
}

/* INIT */
loadUser();
updateUI();

</script>

</body>
</html>
