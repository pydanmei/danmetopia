<!DOCTYPE html>
<html>

<head>
<meta charset="utf-8">
<title>MangaDex Clone</title>

<style>
body{margin:0;background:#0f0f0f;color:white;font-family:Arial}
.top{background:#00dc64;color:black;padding:15px;font-weight:bold}
.grid{display:grid;grid-template-columns:repeat(auto-fill,180px);gap:10px;padding:10px}
.card{background:#1c1c1c;border-radius:10px;overflow:hidden;cursor:pointer}
.card img{width:100%}
.info{padding:10px}
.tag{font-size:12px;background:#00dc64;color:black;padding:3px;border-radius:5px}
</style>

</head>

<body>

<div class="topbar">
📚 DANMETOPIA - TRANG CHỦ
</div>

<div class="grid" id="list"></div>

<script type="module">

import { DB } from "./db.js";

const list = document.getElementById("list");

list.innerHTML = DB.manga.map(m=>`
  <div class="card" onclick="openManga(${m.id})">
    <img src="${m.cover}">
    <div class="info">
      <b>${m.title}</b><br>
      <small>${m.group}</small><br>
      <span class="tag">${m.status}</span>
      <p>❤️ ${m.likes}</p>
    </div>
  </div>
`).join("")

      <p>❤️ ${s.likes}</p>

      <button onclick="openStory(${s.id})">Đọc truyện</button>
    </div>
  </div>
`).join("");

window.openStory = (id)=>{
  window.location.href="read.html?id="+id;
}

</script>

</body>
</html>
