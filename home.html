<!DOCTYPE html>
<html>

<head>
<meta charset="utf-8">
<title>DANMETOPIA - TRANG CHỦ</title>

<style>
body{
  margin:0;
  background:#0f0f0f;
  color:white;
  font-family:Arial;
}

.topbar{
  background:#00dc64;
  color:black;
  padding:15px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  font-weight:bold;
}

.loginBox{
  background:#1c1c1c;
  padding:15px;
  margin:10px;
  border-radius:10px;
}

input{
  width:100%;
  padding:10px;
  margin-top:8px;
  border:none;
  border-radius:8px;
  background:#2a2a2a;
  color:white;
}

button{
  width:100%;
  padding:10px;
  margin-top:10px;
  border:none;
  border-radius:8px;
  cursor:pointer;
}

.green{background:#00dc64;color:black;}
.gray{background:#333;color:white;}

.card{
  background:#1c1c1c;
  padding:15px;
  margin:10px;
  border-radius:10px;
  cursor:pointer;
}
</style>

</head>

<body>

<!-- TOP -->
<div class="topbar">
  <div>🏠 DANMETOPIA HOME</div>
  <div id="userBox">Ẩn danh</div>
</div>

<!-- LOGIN -->
<div class="loginBox">

  <h3>🔐 Đăng nhập</h3>

  <input id="email" placeholder="Email">
  <input id="pass" type="password" placeholder="Mật khẩu (danmei)">

  <button class="green" onclick="login()">Đăng nhập</button>

</div>

<!-- LIST -->
<div>

  <div class="card">📖 Truyện 1</div>
  <div class="card">📖 Truyện 2</div>
  <div class="card">📖 Truyện 3</div>

</div>

<script>

let user = JSON.parse(localStorage.getItem("user") || "{}");

function updateUI(){

  if(user.email){
    document.getElementById("userBox").innerText =
      `${user.email} (${user.role})`;
  }else{
    document.getElementById("userBox").innerText = "Ẩn danh";
  }
}

function login(){

  const email = document.getElementById("email").value;
  const pass = document.getElementById("pass").value;

  if(pass !== "danmei"){
    alert("Sai mật khẩu");
    return;
  }

  let role = "user";

  if(
    email === "pydanmeii@gmail.com" ||
    email === "pepyl4298@gmail.com"
  ){
    role = "admin";
  }

  user = { email, role };

  localStorage.setItem("user", JSON.stringify(user));

  updateUI();
}

updateUI();

</script>

</body>
</html>
