<!DOCTYPE html>
<html>

<head>
<meta charset="utf-8">
<title>HOME</title>

<style>
body{
  margin:0;
  background:#0f0f0f;
  color:white;
  font-family:Arial;
}

.topbar{
  background:#00dc64;
  color:black;
  padding:15px;
  display:flex;
  justify-content:space-between;
}

.card{
  background:#1c1c1c;
  padding:15px;
  margin:10px;
  border-radius:10px;
}

button{
  padding:8px;
  border:none;
  border-radius:8px;
  cursor:pointer;
}

.green{background:#00dc64;color:black;}
</style>
</head>

<body>

<div class="topbar">
  <div>📚 DANMETOPIA</div>
  <div id="user"></div>
</div>

<div id="list"></div>

<script type="module">

import {
  getFirestore,
  collection,
  getDocs,
  addDoc,
  updateDoc,
  doc,
  increment
} from "https://www.gstatic.com/firebasejs/12.13.0/firebase-firestore.js";

const db = window.db;

const user = JSON.parse(localStorage.getItem("user") || "{}");

document.getElementById("user").innerText =
user.email ? `${user.email} (${user.role})` : "Ẩn danh";

/* ================= LOAD STORIES ================= */
async function load(){

  const snap = await getDocs(collection(db,"stories"));

  document.getElementById("list").innerHTML =
  snap.docs.map(d=>{

    const s = d.data();

    return `
      <div class="card">
        <h3>${s.title}</h3>
        <p>👥 ${s.group || "system"}</p>

        <button class="green" onclick="like('${d.id}')">
          ❤️ Like (${s.like || 0})
        </button>

        <button onclick="read('${d.id}')">
          📖 Đọc
        </button>
      </div>
    `;
  }).join("");
}

/* ================= LIKE ================= */
window.like = async (id)=>{

  const ref = doc(db,"stories",id);
  await updateDoc(ref,{
    like: increment(1)
  });

  load();
};

/* ================= READ ================= */
window.read = (id)=>{
  window.location.href = "read.html?id="+id;
};

load();

</script>

</body>
</html>
