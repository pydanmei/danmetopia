<!DOCTYPE html>
<html>

<head>
  <title>HOME</title>

  <style>
    body{margin:0;background:#0f0f0f;color:white;font-family:Arial}

    .top{
      background:#00dc64;
      padding:15px;
      color:black;
      font-weight:bold;
    }

    .grid{
      display:grid;
      grid-template-columns:repeat(auto-fill,minmax(160px,1fr));
      gap:10px;
      padding:10px;
    }

    .card{
      background:#1c1c1c;
      border-radius:10px;
      overflow:hidden;
      cursor:pointer;
    }

    img{width:100%;height:220px;object-fit:cover}

    .info{padding:10px}

  </style>

</head>

<body>

<div class="top">
  DANMETOPIA
</div>

<div id="list" class="grid"></div>

<script>

const role = localStorage.getItem("role");

/* sample data */
const stories = [
  {id:1,title:"Neko Mata",genre:"Romance"},
  {id:2,title:"Dark Soul",genre:"Action"},
  {id:3,title:"Moon Love",genre:"Drama"}
];

document.getElementById("list").innerHTML =
  stories.map(s=>`
    <div class="card" onclick="openR(${s.id})">
      <img src="https://picsum.photos/300/400?${s.id}">
      <div class="info">
        <b>${s.title}</b><br>
        <small>${s.genre}</small>
      </div>
    </div>
  `).join("");

function openR(id){
  window.location.href="read.html?id="+id;
}

</script>

</body>
</html>
