<div class="topbar">
  <div class="logo" id="homeLogo">🌸 DANMETOPIA 🌸</div>
  
  <!-- Desktop menu -->
  <div class="user-area desktop-menu">
    <span id="userDisplay">👤 Đang tải...</span>
    <a href="groups.html" id="groupsLink" class="nav-link" style="display:none">📚 Nhóm</a>
    <button id="profileBtn" style="display:none">👤 Thông tin</button>
    <a href="admin.html" id="adminLink" style="display:none" class="nav-link admin-link">👑 Admin</a>
    <button id="logoutBtn" style="display:none">🚪 Đăng xuất</button>
    <button id="createGroupBtn" style="display:none" class="nav-btn">➕ Tạo nhóm</button>
  </div>
  
  <!-- Mobile menu button -->
  <div class="mobile-menu-btn" id="mobileMenuBtn" style="display:none">
    <span>☰</span>
  </div>
  
  <!-- Mobile menu dropdown -->
  <div id="mobileMenu" class="mobile-menu" style="display:none">
    <div class="mobile-user-info" id="mobileUserDisplay">👤 Đang tải...</div>
    <a href="index.html" class="mobile-nav-link">🏠 Trang chủ</a>
    <a href="groups.html" id="mobileGroupsLink" class="mobile-nav-link">📚 Nhóm</a>
    <button id="mobileProfileBtn" class="mobile-nav-btn">👤 Thông tin</button>
    <a href="admin.html" id="mobileAdminLink" class="mobile-nav-link admin-link">👑 Admin</a>
    <button id="mobileLogoutBtn" class="mobile-nav-btn">🚪 Đăng xuất</button>
    <button id="mobileCreateGroupBtn" class="mobile-nav-btn">➕ Tạo nhóm</button>
  </div>
</div>

<style>
  .mobile-menu-btn {
    background: rgba(0,0,0,0.2);
    border: none;
    padding: 8px 12px;
    border-radius: 30px;
    cursor: pointer;
    font-size: 20px;
    font-weight: bold;
    color: black;
    display: none;
    align-items: center;
    justify-content: center;
  }
  .mobile-menu-btn:hover {
    background: rgba(0,0,0,0.4);
  }
  
  .mobile-menu {
    position: absolute;
    top: 60px;
    right: 10px;
    background: #1c1c1c;
    border: 1px solid #FF69B4;
    border-radius: 16px;
    padding: 10px;
    min-width: 200px;
    z-index: 200;
    box-shadow: 0 4px 15px rgba(0,0,0,0.3);
  }
  
  .mobile-user-info {
    padding: 10px;
    border-bottom: 1px solid #333;
    margin-bottom: 8px;
    font-weight: bold;
    color: #FF69B4;
  }
  
  .mobile-nav-link, .mobile-nav-btn {
    display: block;
    width: 100%;
    padding: 10px 14px;
    background: transparent;
    border: none;
    color: white;
    text-decoration: none;
    text-align: left;
    cursor: pointer;
    border-radius: 8px;
    font-size: 14px;
  }
  
  .mobile-nav-link:hover, .mobile-nav-btn:hover {
    background: #FF69B4;
    color: black;
  }
  
  .mobile-nav-link.admin-link {
    background: #FF1493;
    color: white;
  }
  .mobile-nav-link.admin-link:hover {
    background: #FF69B4;
    color: black;
  }
  
  @media (max-width: 768px) {
    .desktop-menu { display: none; }
    .mobile-menu-btn { display: flex !important; }
  }
  
  body.light-mode .mobile-menu {
    background: #f0f0f0;
    border-color: #FF69B4;
  }
  body.light-mode .mobile-nav-link,
  body.light-mode .mobile-nav-btn {
    color: #333;
  }
  body.light-mode .mobile-nav-link:hover,
  body.light-mode .mobile-nav-btn:hover {
    color: black;
  }
</style>

<script>
document.addEventListener('DOMContentLoaded', function() {
    const menuBtn = document.getElementById('mobileMenuBtn');
    const mobileMenu = document.getElementById('mobileMenu');
    
    if (menuBtn && mobileMenu) {
        menuBtn.addEventListener('click', function(e) {
            e.stopPropagation();
            mobileMenu.style.display = mobileMenu.style.display === 'block' ? 'none' : 'block';
        });
        
        document.addEventListener('click', function(event) {
            if (!menuBtn.contains(event.target) && !mobileMenu.contains(event.target)) {
                mobileMenu.style.display = 'none';
            }
        });
    }
});
</script>
