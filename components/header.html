<div class="topbar">
  <div class="logo" id="homeLogo">🌸 DANMETOPIA 🌸</div>
  
  <!-- Desktop menu -->
  <div class="user-area desktop-menu">
    <span id="userDisplay">👤 Đang tải...</span>
    <a href="groups.html" id="groupsLink" class="nav-link" style="display:none">📚 Nhóm</a>
    <button id="profileBtn" style="display:none">👤 Thông tin</button>
    <a href="admin.html" id="adminLink" style="display:none" class="nav-link admin-link">👑 Admin</a>
    <button id="logoutBtn" style="display:none">🚪 Đăng xuất</button>
    <button id="createGroupBtn" style="display:none" class="nav-btn">➕ Tạo nhóm</button>
  </div>
  
  <!-- Mobile menu button -->
  <div class="mobile-menu-btn" id="mobileMenuBtn" style="display:none">☰</div>
  
  <!-- Mobile menu dropdown -->
  <div id="mobileMenu" class="mobile-menu" style="display:none">
    <div class="mobile-user-info" id="mobileUserDisplay">👤 Đang tải...</div>
    <a href="groups.html" id="mobileGroupsLink" class="mobile-nav-link">📚 Nhóm</a>
    <button id="mobileProfileBtn" class="mobile-nav-btn">👤 Thông tin</button>
    <a href="admin.html" id="mobileAdminLink" class="mobile-nav-link admin-link">👑 Admin</a>
    <button id="mobileLogoutBtn" class="mobile-nav-btn">🚪 Đăng xuất</button>
    <button id="mobileCreateGroupBtn" class="mobile-nav-btn">➕ Tạo nhóm</button>
  </div>
</div>

<style>
  .mobile-menu-btn {
    background: rgba(0,0,0,0.2);
    border: none;
    padding: 8px 12px;
    border-radius: 30px;
    cursor: pointer;
    font-size: 20px;
    font-weight: bold;
    color: black;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  
  .mobile-menu {
    position: fixed;
    top: 60px;
    right: 10px;
    background: #1c1c1c;
    border: 1px solid #FF69B4;
    border-radius: 16px;
    padding: 10px;
    min-width: 180px;
    z-index: 10000;
    box-shadow: 0 4px 15px rgba(0,0,0,0.3);
  }
  
  .mobile-user-info {
    padding: 10px;
    border-bottom: 1px solid #333;
    margin-bottom: 8px;
    font-weight: bold;
    color: #FF69B4;
  }
  
  .mobile-nav-link, .mobile-nav-btn {
    display: block;
    width: 100%;
    padding: 10px;
    background: transparent;
    border: none;
    color: white;
    text-decoration: none;
    text-align: left;
    cursor: pointer;
    border-radius: 8px;
    font-size: 14px;
  }
  
  .mobile-nav-link:hover, .mobile-nav-btn:hover {
    background: #FF69B4;
    color: black;
  }
  
  @media (max-width: 768px) {
    .desktop-menu { display: none; }
    .mobile-menu-btn { display: flex !important; }
  }
  
  @media (min-width: 769px) {
    .mobile-menu-btn { display: none !important; }
    .mobile-menu { display: none !important; }
  }
</style>

<script>
  (function() {
    // Hàm toggle menu
    window.toggleMobileMenu = function() {
      const menu = document.getElementById('mobileMenu');
      if (menu) {
        if (menu.style.display === 'none' || !menu.style.display || getComputedStyle(menu).display === 'none') {
          menu.style.display = 'block';
        } else {
          menu.style.display = 'none';
        }
      }
    };
    
    // Gắn sự kiện sau khi DOM load
    function initMobileMenu() {
      const menuBtn = document.getElementById('mobileMenuBtn');
      if (menuBtn) {
        // Xóa event cũ nếu có
        const newBtn = menuBtn.cloneNode(true);
        menuBtn.parentNode.replaceChild(newBtn, menuBtn);
        newBtn.addEventListener('click', function(e) {
          e.stopPropagation();
          window.toggleMobileMenu();
        });
      }
      
      // Đóng menu khi click ra ngoài
      document.addEventListener('click', function(event) {
        const menu = document.getElementById('mobileMenu');
        const btn = document.getElementById('mobileMenuBtn');
        if (menu && btn && !btn.contains(event.target) && !menu.contains(event.target)) {
          menu.style.display = 'none';
        }
      });
    }
    
    // Sync mobile user display
    function syncMobileUserDisplay() {
      const desktopDisplay = document.getElementById('userDisplay');
      const mobileDisplay = document.getElementById('mobileUserDisplay');
      if (desktopDisplay && mobileDisplay) {
        mobileDisplay.innerHTML = desktopDisplay.innerHTML;
      }
    }
    
    // Lắng nghe sự thay đổi của userDisplay
    const observer = new MutationObserver(syncMobileUserDisplay);
    const userDisplay = document.getElementById('userDisplay');
    if (userDisplay) {
      observer.observe(userDisplay, { childList: true, subtree: true, characterData: true });
    }
    
    // Chạy khi DOM ready
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', function() {
        initMobileMenu();
        syncMobileUserDisplay();
      });
    } else {
      initMobileMenu();
      syncMobileUserDisplay();
    }
  })();
</script>
