<!DOCTYPE html>
<html>

<head>
<meta charset="utf-8">
<title>Thông tin Truyện</title>

<style>
body{margin:0;background:#0f0f0f;color:white;font-family:Arial}
.top{background:#00dc64;color:black;padding:10px}
.box{padding:15px}
.chapter{background:#1c1c1c;margin:5px;padding:10px;cursor:pointer}
</style>

</head>

<body>

<div class="top">📖 Thông tin truyện</div>

<div class="box" id="info"></div>

<div class="box" id="chapters"></div>

<script type="module">

import { DB } from "./db.js";

const id = new URLSearchParams(location.search).get("id");

const manga = DB.manga.find(m=>m.id==id);

document.getElementById("info").innerHTML = `
<h2>${manga.title}</h2>
<p>Tên khác: ${manga.othertitel}</p>
<p>Nhóm dịch: ${manga.group}</p>
<p>Tác giả: ${manga.author}</p>
<p>Trạng thái: ${manga.status}</p>
<p>❤️ ${manga.likes}</p>
`;

document.getElementById("chapters").innerHTML =
manga.chapters.map((c,i)=>`
  <div class="chapter" onclick="openRead(${id},${i})">
    ${c.title}
  </div>
`).join("");

window.openRead = (id,chap)=>{
  location.href="read.html?id="+id+"&chap="+chap;
}

</script>

</body>
</html>
